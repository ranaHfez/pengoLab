<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 7-1: Read Picture Graphs and Bar Graphs</title>
<!-- Shared template: colors, fonts, sounds, buttons, mascots. Keep this. -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/theme.js" defer></script>

<style>
:root{--c1:#1d4ed8;--c2:#f59e0b;--c3:#93c5fd;--bg:#eff6ff;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:#1f2937;
 background-image:radial-gradient(circle at 10% 20%,rgba(255,255,255,.6) 0 40px,transparent 41px),radial-gradient(circle at 85% 60%,rgba(255,255,255,.5) 0 60px,transparent 61px);background-attachment:fixed}
header{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 5px 0 rgba(0,0,0,.12)}
header .badge{background:#fff;color:var(--c1);font-weight:900;border-radius:16px;padding:8px 14px;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
header h1{margin:0;font-size:clamp(20px,3vw,34px);text-shadow:2px 2px 0 rgba(0,0,0,.2);line-height:1.1}
header .sub{font-size:15px;opacity:.95;margin-top:4px}
header .sig{margin-left:auto;font-style:italic;font-weight:700;background:rgba(255,255,255,.22);padding:8px 16px;border-radius:999px;font-size:16px}
nav{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 3px 10px rgba(0,0,0,.08);align-items:center}
nav .tab{border:none;background:#f1f5f9;color:#334155;font:inherit;font-weight:700;font-size:17px;padding:10px 16px;border-radius:14px;cursor:pointer;transition:.15s;box-shadow:0 3px 0 #cbd5e1}
nav .tab:hover{transform:translateY(-2px)}
nav .tab.active{background:var(--c1);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
nav .tools{margin-left:auto;display:flex;gap:6px}
nav .tools button{border:none;background:#f1f5f9;font-size:20px;width:44px;height:44px;border-radius:12px;cursor:pointer;box-shadow:0 3px 0 #cbd5e1}
.panel{display:none;position:relative;padding:20px 16px 110px;min-height:calc(100vh - 150px)}
.panel.active{display:block;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
canvas.ink{position:absolute;left:0;top:0;pointer-events:none;z-index:30}
body.pen-on canvas.ink{pointer-events:auto;cursor:crosshair;touch-action:none}
.card{background:#fff;border-radius:24px;padding:22px 24px;box-shadow:0 6px 0 rgba(0,0,0,.07),0 12px 30px rgba(0,0,0,.07);max-width:1050px;margin:0 auto 18px}
h2{margin:0 0 10px;color:var(--c1);font-size:28px}
h3{margin:8px 0;color:var(--c2)}
p,li{font-size:20px;line-height:1.5}
.big{font-size:26px;font-weight:800}
.eq{font-size:26px;font-weight:800;background:#fef9c3;border:3px dashed #facc15;border-radius:16px;padding:10px 16px;display:inline-block;margin:6px 0}
.blank{display:inline-block;min-width:46px;border:3px solid var(--c1);border-radius:10px;background:#fff;text-align:center;color:var(--c1)}
.btn{border:none;font:inherit;font-weight:800;font-size:20px;padding:12px 22px;border-radius:16px;background:var(--c1);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.alt{background:var(--c2)}.btn.ghost{background:#e2e8f0;color:#334155}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.pill{display:inline-block;background:var(--c3);color:#fff;border-radius:999px;padding:4px 14px;font-weight:800}
.note{background:#ecfeff;border-left:8px solid #06b6d4;border-radius:14px;padding:12px 16px;font-size:19px;margin:10px 0}
.tip{background:#fef3c7;border-left:8px solid #f59e0b;border-radius:14px;padding:12px 16px;font-size:19px;margin:10px 0}
svg.rsvg{width:100%;height:auto;display:block;margin:6px auto}
svg text{font-family:inherit}
input[type=range]{width:220px;accent-color:var(--c1);height:30px}
/* stepper */
.steps-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.steps-nav button{border:none;font:inherit;font-weight:700;font-size:15px;padding:8px 12px;border-radius:12px;background:#e2e8f0;cursor:pointer}
.steps-nav button.on{background:var(--c2);color:#fff}
.steps-nav button.done{background:#bbf7d0}
.step-foot{display:flex;justify-content:space-between;margin-top:16px}
/* quiz */
.qwrap{max-width:1000px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qhead .title{font-size:28px;font-weight:900;color:var(--c1)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{width:22px;height:22px;border-radius:50%;background:#e2e8f0;display:inline-block;border:3px solid #fff;box-shadow:0 2px 0 #cbd5e1}
.dots span.cur{background:#fde68a;transform:scale(1.2)}
.dots span.ok{background:var(--ok)}.dots span.mid{background:#f59e0b}
.score{margin-left:auto;background:#fff;border-radius:999px;padding:6px 16px;font-weight:900;font-size:22px;box-shadow:0 3px 0 #cbd5e1}
.qcard{background:#fff;border-radius:26px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.08);border:4px solid var(--c3)}
.qnum{font-weight:800;color:var(--c2);font-size:18px}
.qtext{font-size:24px;line-height:1.45;margin:8px 0 14px}
.qtext p{font-size:24px;margin:6px 0}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.answers.wide{grid-template-columns:1fr}
.ans{border:none;font:inherit;font-size:24px;font-weight:800;padding:16px 12px;border-radius:18px;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:.12s}
.answers.wide .ans{font-size:21px;text-align:left;padding:14px 18px}
.ans:hover{transform:translateY(-3px)}
.ans:nth-child(4n+1){background:#3b82f6}.ans:nth-child(4n+2){background:#ec4899}.ans:nth-child(4n+3){background:#f59e0b}.ans:nth-child(4n+4){background:#8b5cf6}
.ans.right{background:var(--ok)!important;animation:bounce .5s}
.ans.wrong{background:#9ca3af!important;opacity:.6;animation:shake .4s;cursor:not-allowed}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@keyframes bounce{40%{transform:scale(1.08)}}
.feedback{margin-top:14px;font-size:22px;min-height:10px}
.feedback .good{background:#dcfce7;border-radius:16px;padding:12px 16px;border:3px solid #86efac}
.feedback .try{background:#fee2e2;border-radius:16px;padding:12px 16px;border:3px solid #fca5a5}
.numpad{display:flex;flex-direction:column;align-items:center;gap:10px}
.numdisp{font-size:40px;font-weight:900;min-width:180px;text-align:center;background:#f8fafc;border:4px solid var(--c1);border-radius:18px;padding:6px 16px;min-height:66px}
.numdisp .suf{font-size:22px;color:#64748b;margin-left:8px}
.keys{display:grid;grid-template-columns:repeat(5,70px);gap:8px}
.keys button{height:62px;font:inherit;font-size:28px;font-weight:900;border:none;border-radius:14px;background:#e0e7ff;color:#3730a3;cursor:pointer;box-shadow:0 4px 0 #a5b4fc}
.keys button.go{background:var(--ok);color:#fff;box-shadow:0 4px 0 #166534;grid-column:span 2}
.keys button.del{background:#fee2e2;color:#b91c1c;box-shadow:0 4px 0 #fca5a5}
.endcard{text-align:center;padding:30px}
.endcard .stars{font-size:80px;letter-spacing:10px}
.shake{animation:shake .4s}
/* pen ui */
#penBtn{position:fixed;left:16px;bottom:16px;z-index:70;border:none;font:inherit;font-weight:900;font-size:20px;padding:14px 20px;border-radius:999px;background:#334155;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3)}
body.pen-on #penBtn{background:#e11d48}
#toolbox{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:70;background:#fff;border-radius:22px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;flex-direction:column;gap:6px;align-items:center;max-height:92vh;overflow:auto;width:78px}
body.pen-on #toolbox{display:flex}
#toolbox button{width:54px;height:46px;border:none;border-radius:12px;background:#f1f5f9;font-size:22px;cursor:pointer;flex:none}
#toolbox button.on{background:#fde68a;outline:3px solid #f59e0b}
#toolbox .sw{width:26px!important;height:26px!important;border-radius:50%!important;border:3px solid #fff!important;box-shadow:0 0 0 2px #cbd5e1}
#toolbox .sw.on{box-shadow:0 0 0 3px #111}
#toolbox .swatches{display:grid;grid-template-columns:repeat(2,26px);gap:6px}
#toolbox hr{width:80%;border:none;border-top:2px solid #e2e8f0;margin:2px 0}
#toolbox .lbl{font-size:11px;font-weight:800;color:#64748b}
#bgTools{display:none;flex-direction:column;gap:6px;align-items:center}
body.on-chalk #bgTools{display:flex}
/* chalkboard */
.board{height:76vh;border-radius:20px;position:relative;border:16px solid #92400e;box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 8px 0 #78350f}
.board.chalk{background:#1f4d3a radial-gradient(circle at 30% 30%,rgba(255,255,255,.06),transparent 60%)}
.board.white{background:#fff;border-color:#94a3b8;box-shadow:0 8px 0 #64748b}
.board.grid{background-color:#fff;background-image:linear-gradient(#93c5fd 1px,transparent 1px),linear-gradient(90deg,#93c5fd 1px,transparent 1px);background-size:40px 40px;border-color:#94a3b8;box-shadow:0 8px 0 #64748b}
.board.dots{background-color:#fff;background-image:radial-gradient(#64748b 2px,transparent 2.5px);background-size:40px 40px;border-color:#94a3b8;box-shadow:0 8px 0 #64748b}
.board-prompt{position:absolute;left:20px;top:14px;right:20px;font-size:30px;font-weight:800;color:#fde68a;text-shadow:1px 1px 0 #000}
.board.white .board-prompt,.board.grid .board-prompt,.board.dots .board-prompt{color:#1e3a8a;text-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:none;font:inherit;font-weight:700;font-size:16px;padding:8px 14px;border-radius:999px;background:#fff;box-shadow:0 3px 0 #cbd5e1;cursor:pointer}
/* book */
.book figure{margin:0 auto 26px;max-width:1000px;background:#fff;padding:10px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.book img{width:100%;display:block;border-radius:6px;user-select:none;-webkit-user-drag:none}
.book figcaption{text-align:center;font-weight:800;color:#475569;padding-top:6px}
.pagejump{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
/* picture graph */
.pg{display:inline-block;background:#fff;border:4px solid #0f172a;border-radius:14px;overflow:hidden;min-width:320px;max-width:100%}
.pg-title{background:#0f172a;color:#fff;font-weight:900;text-align:center;padding:8px 12px;font-size:20px}
.pg table{border-collapse:collapse;width:100%}
.pg th{text-align:left;padding:8px 12px;font-size:19px;border-bottom:2px solid #e2e8f0;border-right:2px solid #e2e8f0;white-space:nowrap;background:#f8fafc}
.pg td{padding:6px 10px;font-size:30px;border-bottom:2px solid #e2e8f0;white-space:nowrap;letter-spacing:4px}
.pg tr.clk{cursor:pointer}.pg tr.clk:hover td,.pg tr.clk:hover th{background:#fef9c3}
.pg-key{padding:8px 12px;font-size:17px;font-weight:700;background:#fff7ed}
.half{display:inline-block;clip-path:inset(0 50% 0 0)}
.flip{perspective:800px;display:inline-block;width:230px;height:150px;margin:6px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:.5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.flip .f{background:var(--c1);color:#fff;font-size:26px}
.flip .b{background:#fff;border:4px solid var(--c1);transform:rotateY(180deg);font-size:17px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (max-width:700px){.keys{grid-template-columns:repeat(5,54px)}.keys button{height:54px}header .sig{margin-left:0}}
</style>

<header>
 <div class="badge">7-1</div>
 <div><h1>Lesson 7-1: Read Picture Graphs and Bar Graphs</h1><div class="sub">enVision Math Grade 3 · Topic 7 · I can use picture graphs and bar graphs to answer questions about data.</div></div>
 <div class="sig">✨ T.Rana Elsisi</div>
</header>

 </div>

<canvas id="confetti"></canvas>

<script>
/* ===== helpers ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function opts(ans,cands,n=4,fmt=x=>x){const out=[ans];for(const c of cands){if(out.length>=n)break;if(c>0&&Number.isInteger(c)&&!out.includes(c))out.push(c)}let k=1;while(out.length<n){for(const c of [ans+k,ans-k]){if(out.length<n&&c>0&&!out.includes(c))out.push(c)}k++}return shuffle(out).map(fmt)}
const B=s=>`<span class="blank">${s}</span>`;

/* ===== sound ===== */
let AC=null,muted=false;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type='triangle',g=.16){try{const a=ac(),o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;const t0=a.currentTime+t;v.gain.setValueAtTime(0,t0);v.gain.linearRampToValueAtTime(g,t0+.02);v.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(v).connect(a.destination);o.start(t0);o.stop(t0+d+.05)}catch(e){}}
function clap(t){try{const a=ac(),len=Math.floor(a.sampleRate*.1),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1000+Math.random()*900;f.Q.value=.7;const g=a.createGain();g.gain.value=.55;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t)}catch(e){}}
function cheer(t,d){try{const a=ac(),len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++){const env=Math.sin(Math.PI*i/len);x[i]=(Math.random()*2-1)*env*.5}const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.4;const g=a.createGain();g.gain.value=.22;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t)}catch(e){}}
function sCorrect(){if(muted)return;[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.3));cheer(.2,1.3);for(let i=0;i<12;i++)clap(.3+i*.09+Math.random()*.05)}
function sWrong(){if(muted)return;tone(330,0,.18,'square',.06);tone(247,.15,.3,'square',.06)}
function sClick(){if(muted)return;tone(900,0,.07,'sine',.07)}
function sWin(){if(muted)return;[523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.14,.35,'triangle',.18));cheer(.3,2.2);for(let i=0;i<24;i++)clap(.4+i*.08+Math.random()*.05)}

/* ===== confetti ===== */
const cf=$('#confetti'),cx=cf.getContext('2d');let parts=[],cfOn=false;
function confetti(n=110){cf.width=innerWidth;cf.height=innerHeight;const cols=['#f43f5e','#f59e0b','#22c55e','#3b82f6','#a855f7','#facc15'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,life:120});if(!cfOn){cfOn=true;requestAnimationFrame(cfLoop)}}
function cfLoop(){cx.clearRect(0,0,cf.width,cf.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});parts=parts.filter(p=>p.life>0&&p.y<cf.height+20);if(parts.length)requestAnimationFrame(cfLoop);else{cfOn=false;cx.clearRect(0,0,cf.width,cf.height)}}

/* ===== drawings: SVG builders ===== */
function rectSVG(o){
 const R=o.rows,C=o.cols,u=o.unit||Math.max(16,Math.min(36,Math.floor(340/Math.max(R,C))));
 if(o.center&&C*u<140)o=Object.assign({},o,{bottom:'Area = '+o.center,center:null});
 const L=o.side!=null?78:16,T=o.top!=null||o.topParts?40:14,W=C*u,H=R*u,Bt=o.bottom?44:16;
 const VW=L+W+20,VH=T+H+Bt;
 const f1=o.fill||'#86efac',f2=o.fill2||'#fdba74',st=o.stroke||'#14532d';
 let s=`<svg class="rsvg" viewBox="0 0 ${VW} ${VH}" style="max-width:${Math.min(VW*1.5,o.maxW||640)}px">`;
 if(o.split){const a=o.split.at;if(o.split.dir==='h'){s+=`<rect x="${L}" y="${T}" width="${W}" height="${a*u}" fill="${f1}"/><rect x="${L}" y="${T+a*u}" width="${W}" height="${H-a*u}" fill="${f2}"/>`}else{s+=`<rect x="${L}" y="${T}" width="${a*u}" height="${H}" fill="${f1}"/><rect x="${L+a*u}" y="${T}" width="${W-a*u}" height="${H}" fill="${f2}"/>`}}
 else s+=`<rect x="${L}" y="${T}" width="${W}" height="${H}" fill="${f1}"/>`;
 if(o.cells){for(let r=0;r<R;r++)for(let c=0;c<C;c++)s+=`<rect class="cell" data-r="${r}" data-c="${c}" x="${L+c*u}" y="${T+r*u}" width="${u}" height="${u}" fill="transparent"/>`}
 if(o.grid){for(let c=1;c<C;c++)s+=`<line x1="${L+c*u}" y1="${T}" x2="${L+c*u}" y2="${T+H}" stroke="${st}" stroke-opacity=".45" stroke-width="1.5"/>`;for(let r=1;r<R;r++)s+=`<line x1="${L}" y1="${T+r*u}" x2="${L+W}" y2="${T+r*u}" stroke="${st}" stroke-opacity=".45" stroke-width="1.5"/>`}
 s+=`<rect x="${L}" y="${T}" width="${W}" height="${H}" fill="none" stroke="${st}" stroke-width="4" rx="2"/>`;
 if(o.split){const a=o.split.at;if(o.split.dir==='h')s+=`<line x1="${L-6}" y1="${T+a*u}" x2="${L+W+6}" y2="${T+a*u}" stroke="#111" stroke-width="5" stroke-dasharray="10 6"/>`;else s+=`<line x1="${L+a*u}" y1="${T-6}" x2="${L+a*u}" y2="${T+H+6}" stroke="#111" stroke-width="5" stroke-dasharray="10 6"/>`}
 const tx=(x,y,t,anc='middle',col='#111',sz=18)=>`<text x="${x}" y="${y}" text-anchor="${anc}" font-size="${sz}" font-weight="800" fill="${col}">${t}</text>`;
 if(o.topParts&&o.split&&o.split.dir!=='h'){const a=o.split.at;s+=tx(L+a*u/2,T-12,o.topParts[0],'middle','#b45309');s+=tx(L+a*u+(W-a*u)/2,T-12,o.topParts[1],'middle','#b45309')}

function iconRow(v,K,icon){const full=Math.floor(v/K),half=v%K?1:0;return icon.repeat(full)+(half?`<span class="half">${icon}</span>`:'')}
function pictureGraph(o){
 const K=o.key;let h=`<div class="pg"><div class="pg-title">${o.title}</div><table>`;
 o.cats.forEach((c,i)=>{h+=`<tr ${o.clickable?`class="clk" data-i="${i}"`:''}><th>${c}</th><td>${iconRow(o.vals[i],K,o.icon)}</td></tr>`});
 h+=`</table><div class="pg-key">Key: Each ${o.icon} = ${K} ${o.unit}. Each <span class="half">${o.icon}</span> = ${K/2} ${K/2===1?o.unit1||o.unit:o.unit}.</div></div>`;return h}
function barGraph(o){
 const n=o.cats.length,bw=54,gap=34,x0=70,y0=44,ph=250,pw=n*(bw+gap)+gap,max=o.max,step=o.step,le=o.labelEvery||1;
 const VW=x0+pw+16,VH=y0+ph+70,Y=v=>y0+ph-v/max*ph;
 const cols=o.colors||['#3b82f6','#ec4899','#f59e0b','#22c55e','#8b5cf6'];
 let s=`<svg class="rsvg bg" viewBox="0 0 ${VW} ${VH}" style="max-width:${VW*1.12}px"><text x="${VW/2}" y="24" text-anchor="middle" font-size="20" font-weight="900">${o.title}</text>`;
 for(let v=0,k=0;v<=max;v+=step,k++){s+=`<line x1="${x0}" y1="${Y(v)}" x2="${x0+pw}" y2="${Y(v)}" stroke="${k%le?'#e2e8f0':'#94a3b8'}" stroke-width="${k%le?1.5:2}"/>`;if(k%le===0)s+=`<text x="${x0-8}" y="${Y(v)+6}" text-anchor="end" font-size="16" font-weight="700">${v}</text>`}
 o.cats.forEach((c,i)=>{const x=x0+gap+i*(bw+gap);s+=`<rect class="bar" data-i="${i}" x="${x}" y="${Y(o.vals[i])}" width="${bw}" height="${ph-(Y(o.vals[i])-y0)}" fill="${cols[i%cols.length]}" stroke="#0f172a" stroke-width="2" style="cursor:${o.clickable?'pointer':'default'}"/><text x="${x+bw/2}" y="${y0+ph+24}" text-anchor="middle" font-size="16" font-weight="800">${c}</text>`});
 s+=`<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0+ph}" stroke="#0f172a" stroke-width="3"/><line x1="${x0}" y1="${y0+ph}" x2="${x0+pw}" y2="${y0+ph}" stroke="#0f172a" stroke-width="3"/>`;
 s+=`<text x="${x0+pw/2}" y="${y0+ph+56}" text-anchor="middle" font-size="17" font-weight="800" fill="#475569">${o.xlab||''}</text><text transform="translate(18 ${y0+ph/2}) rotate(-90)" text-anchor="middle" font-size="17" font-weight="800" fill="#475569">${o.ylab||''}</text>`;
 s+=`<g class="guide"></g></svg>`;return s}

/* ===== quiz engine ===== */
const PRAISE=['Amazing! 🎉','Super star! ⭐','You got it! 👏','Brilliant! 🧠','Fantastic! 🚀','Math hero! 🦸','Wonderful! 🌈','Excellent! 💯'];
const RETRY=['Almost! Try again 💪','Oops! Look again 👀','Not yet — you can do it! 🌟','Think again 🤔'];
let activeQuiz=null;
function Quiz(el,cfg){
 let qs,i,score,tries,val='',done=false;
 function build(){qs=[];if(cfg.list){qs=cfg.list();return}const seen=new Set();let g=0;while(qs.length<cfg.n&&g++<800){const q=cfg.gen(qs.length);const k=q.key||q.html;if(seen.has(k))continue;seen.add(k);qs.push(q)}}
 function start(){build();i=0;score=0;show()}
 function dots(){return qs.map((q,k)=>`<span class="${k===i&&!done?'cur':''} ${q.res||''}"></span>`).join('')}
 function show(){done=false;const q=qs[i];el.__q=q;tries=0;val='';
  el.innerHTML=`<div class="qwrap"><div class="qhead"><div class="title">${cfg.emoji||'🎮'} ${cfg.title}</div><div class="dots">${dots()}</div><div class="score">⭐ ${score}</div></div>
  <div class="qcard"><div class="qnum">Question ${i+1} of ${qs.length}</div><div class="qtext">${q.html}</div><div class="answers ${q.wide?'wide':''}"></div><div class="feedback"></div></div></div>`;
  const A=el.querySelector('.answers');
  if(q.type==='input'){A.className='numpad';A.innerHTML=`<div class="numdisp"><span class="v">?</span>${q.suffix?`<span class="suf">${q.suffix}</span>`:''}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-k="${d}">${d}</button>`).join('')}<button class="del" data-k="del">⌫</button><button class="go" data-k="go">✔ Check</button></div>`;
   A.querySelectorAll('button').forEach(b=>b.onclick=()=>key(b.dataset.k));}
  else{q.choices.forEach(c=>{const b=document.createElement('button');b.className='ans';b.innerHTML=c;b.onclick=()=>check(c,b);A.appendChild(b)})}
  activeQuiz=api}
 function key(k){if(done)return;const q=qs[i];if(k==='del')val=val.slice(0,-1);else if(k==='go'){if(val!=='')check(val,el.querySelector('.numdisp'));return}else if(val.length<4)val+=k;sClick();el.querySelector('.numdisp .v').textContent=val||'?'}
 function check(v,btn){if(done)return;const q=qs[i];const ok=String(v).replace(/<[^>]+>/g,'')===String(q.answer).replace(/<[^>]+>/g,'')||Number(v)===q.answer&&q.type==='input';const fb=el.querySelector('.feedback');
  if(ok){done=true;if(tries===0){score++;q.res='ok'}else q.res='mid';if(btn.classList)btn.classList.add('right');sCorrect();confetti();
   fb.innerHTML=`<div class="good"><b>${pick(PRAISE)}</b> ${q.explain||''}</div><div class="center" style="margin-top:12px"><button class="btn">${i<qs.length-1?'Next ➜':'See my stars ⭐'}</button></div>`;
   fb.querySelector('.btn').onclick=()=>{i++;i<qs.length?show():end()};el.querySelector('.score').textContent='⭐ '+score;el.querySelector('.dots').innerHTML=dots();
   if(q.type==='input')el.querySelector('.numdisp').style.borderColor='var(--ok)';}
  else{tries++;sWrong();if(q.type==='input'){const d=el.querySelector('.numdisp');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');val='';d.querySelector('.v').textContent='?'}else{btn.classList.add('wrong');btn.disabled=true}
   fb.innerHTML=`<div class="try"><b>${pick(RETRY)}</b> ${q.hint?'💡 '+q.hint:''}</div>`}}
 function end(){done=true;activeQuiz=null;const n=qs.length,st=score>=n*.9?3:score>=n*.6?2:score>=1?1:0;sWin();confetti(250);setTimeout(()=>confetti(200),700);
  el.innerHTML=`<div class="qwrap"><div class="qcard endcard"><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><h2>${st===3?'WOW! Super Mathematician! 🏆':st===2?'Great job! 🎉':'Good try! Keep practicing 💪'}</h2><p class="big">You got ${score} out of ${n} on the first try!</p><button class="btn">🔄 Play again</button></div></div>`;
  el.querySelector('.btn').onclick=start}
 const api={key,isInput:()=>qs&&qs[i]&&qs[i].type==='input'&&!done,el};start();return api}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='p'||e.key==='P'){togglePen();return}
 if(activeQuiz&&activeQuiz.isInput()&&activeQuiz.el.closest('.panel.active')){if(/^[0-9]$/.test(e.key))activeQuiz.key(e.key);else if(e.key==='Backspace')activeQuiz.key('del');else if(e.key==='Enter')activeQuiz.key('go')}});

/* ===== stepper ===== */
function Stepper(el,steps){let k=0;const seen=new Set();
 function show(){seen.add(k);el.innerHTML=`<div class="steps-nav">${steps.map((s,j)=>`<button class="${j===k?'on':seen.has(j)?'done':''}" data-j="${j}">${j+1}. ${s.title}</button>`).join('')}</div><div class="card step-body"><h2>${s0().title}</h2>${s0().html}<div class="step-foot"><button class="btn ghost" ${k===0?'style="visibility:hidden"':''} data-go="-1">⬅ Back</button><button class="btn" ${k===steps.length-1?'style="visibility:hidden"':''} data-go="1">Next ➜</button></div></div>`;
  el.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{k=+b.dataset.j;sClick();show()});el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{k+= +b.dataset.go;sClick();show();el.scrollIntoView({behavior:'smooth'})});
  if(s0().init)s0().init(el.querySelector('.step-body'))}
 const s0=()=>steps[k];show()}

/* ===== ink (write anywhere) ===== */
const Pen={on:false,tool:'pen',color:'#e11d48',size:6};
const COLORS=['#111827','#ffffff','#e11d48','#2563eb','#16a34a','#f59e0b','#9333ea','#facc15'];
const inks=[];
function setupInk(panel){const cv=document.createElement('canvas');cv.className='ink';panel.appendChild(cv);const o={panel,cv,ctx:cv.getContext('2d'),strokes:[],W:1,cur:null};inks.push(o);
 new ResizeObserver(()=>fitInk(o)).observe(panel);
 cv.addEventListener('pointerdown',e=>{if(!Pen.on)return;e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(o,e);o.cur={tool:Pen.tool,color:Pen.color,size:Pen.size/o.W,pts:[p,p]};o.strokes.push(o.cur);draw(o)});
 cv.addEventListener('pointermove',e=>{if(!o.cur)return;e.preventDefault();const p=pt(o,e);if(['line','rect','circle'].includes(o.cur.tool))o.cur.pts[1]=p;else o.cur.pts.push(p);if(!o.raf)o.raf=requestAnimationFrame(()=>{o.raf=0;draw(o)})});
 const up=()=>{o.cur=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);return o}
function pt(o,e){const r=o.cv.getBoundingClientRect();return[(e.clientX-r.left)/o.W,(e.clientY-r.top)/o.W]}
function fitInk(o){const w=o.panel.offsetWidth,h=o.panel.offsetHeight;if(!w)return;const d=window.devicePixelRatio||1;o.cv.style.width=w+'px';o.cv.style.height=h+'px';o.cv.width=Math.round(w*d);o.cv.height=Math.round(h*d);o.W=w;o.ctx.setTransform(d,0,0,d,0,0);draw(o)}
function draw(o){const c=o.ctx,W=o.W;c.clearRect(0,0,o.cv.width,o.cv.height);for(const s of o.strokes){c.save();c.lineCap='round';c.lineJoin='round';
 let lw=s.size*W;if(s.tool==='eraser'){c.globalCompositeOperation='destination-out';c.strokeStyle='#000';lw*=4}else{c.strokeStyle=s.color;if(s.tool==='hl'){c.globalAlpha=.35;lw*=3.5}}
 c.lineWidth=lw;c.beginPath();const P=s.pts.map(p=>[p[0]*W,p[1]*W]);
 if(s.tool==='line'){c.moveTo(...P[0]);c.lineTo(...P[1])}
 else if(s.tool==='rect'){c.rect(P[0][0],P[0][1],P[1][0]-P[0][0],P[1][1]-P[0][1])}
 else if(s.tool==='circle'){c.ellipse((P[0][0]+P[1][0])/2,(P[0][1]+P[1][1])/2,Math.abs(P[1][0]-P[0][0])/2+.1,Math.abs(P[1][1]-P[0][1])/2+.1,0,0,7)}
 else{c.moveTo(...P[0]);for(let i=1;i<P.length-1;i++){const m=[(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2];c.quadraticCurveTo(P[i][0],P[i][1],m[0],m[1])}c.lineTo(...P[P.length-1])}

 {title:'Read the Key',html:`<p>How many teams are in each hockey league? First, read the <b>key</b>! 🔑</p><div class="row"><div style="flex:1;min-width:300px" id="pg1"></div><div style="flex:1;min-width:260px"><p class="big">👆 Tap a row!</p><div id="pgx"></div></div></div>`,
  init(r){const T={title:'Number of Hockey Teams in Each League',cats:['East Falls','North Falls','South Falls','West Falls'],vals:[7,6,4,9],icon:'🏆',key:2,unit:'teams',unit1:'team',clickable:true};r.querySelector('#pg1').innerHTML=pictureGraph(T);
   r.querySelectorAll('tr.clk').forEach(tr=>tr.onclick=()=>{const i=+tr.dataset.i,v=T.vals[i],f=Math.floor(v/2),h=v%2;const sk=[];for(let k=1;k<=f;k++)sk.push(k*2);sCorrect();
    r.querySelector('#pgx').innerHTML=`<h3>${T.cats[i]}</h3><p>${f} whole 🏆 → count by 2s: <b>${sk.join(', ')}</b></p>${h?'<p>1 half <span class="half">🏆</span> → <b>+1</b></p>':''}<div class="eq">${f} × 2${h?' + 1':''} = ${v}</div><p>There are <b>${v} teams</b> in ${T.cats[i]}.</p>`})}},
 {title:'Compare Rows',html:`<p>How many <b>more</b> teams does East Falls have than South Falls?</p><div class="row"><div style="flex:1;min-width:300px">${pictureGraph({title:'Number of Hockey Teams in Each League',cats:['East Falls','North Falls','South Falls','West Falls'],vals:[7,6,4,9],icon:'🏆',key:2,unit:'teams',unit1:'team'})}</div><div style="flex:1;min-width:260px"><button class="btn alt" id="c1">Step 1: East Falls</button> <button class="btn alt" id="c2">Step 2: South Falls</button> <button class="btn" id="c3">Step 3: Compare</button><div id="co"></div></div></div>`,
  init(r){const o=r.querySelector('#co');const add=h=>{o.innerHTML+=h;sClick()};r.querySelector('#c1').onclick=()=>add('<div class="eq">East: 3 × 2 + 1 = 7</div>');r.querySelector('#c2').onclick=()=>add('<div class="eq">South: 2 × 2 = 4</div>');r.querySelector('#c3').onclick=()=>{add('<div class="eq">7 − 4 = 3</div><p>East Falls has <b>3 more teams</b> than South Falls! 🎉</p>');sCorrect()}}},
 {title:'Read a Bar Graph',html:`<p>A <b>bar graph</b> uses bars. Each grid line here = <b>2 goals</b>. Only every other line has a number (0, 4, 8 …).</p><div class="row"><div style="flex:1;min-width:320px" id="bg1"></div><div style="flex:1;min-width:240px"><p class="big">👆 Tap a bar!</p><div id="bgx"></div></div></div>`,
  init(r){const V=[18,6,10,14],C=['Alex','Cindi','Jack','Reggie'];r.querySelector('#bg1').innerHTML=barGraph({title:'Hockey Goals Scored by Players',cats:C,vals:V,step:2,max:20,labelEvery:2,ylab:'Number of Goals',xlab:'Name of Player',clickable:true});
   const svg=r.querySelector('svg');r.querySelectorAll('.bar').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,y=+b.getAttribute('y'),x=+b.getAttribute('x');svg.querySelector('.guide').innerHTML=`<line x1="70" y1="${y}" x2="${x}" y2="${y}" stroke="#e11d48" stroke-width="3" stroke-dasharray="8 5"/><circle cx="70" cy="${y}" r="7" fill="#e11d48"/>`;sCorrect();
    const v=V[i],lab=v%4===0;r.querySelector('#bgx').innerHTML=`<h3>${C[i]}</h3><p>${lab?`The bar ends right on the <b>${v}</b> line.`:`The bar ends on the line <b>halfway</b> between ${v-2} and ${v+2}.`}</p><p class="big">${C[i]} scored <b style="color:#e11d48">${v} goals</b>.</p>`})}},
 {title:'Solve with Graphs',html:`<p>Use the bar graph: Alex 18, Cindi 6, Jack 10, Reggie 14.</p><div class="row"><div class="card" style="flex:1;min-width:260px;margin:0"><p><b>1.</b> How many goals did Alex and Reggie score <b>in all</b>?</p><button class="btn alt" data-a="1">Show</button><div id="a1"></div></div><div class="card" style="flex:1;min-width:260px;margin:0"><p><b>2.</b> How many <b>fewer</b> goals did Cindi score than Alex?</p><button class="btn alt" data-a="2">Show</button><div id="a2"></div></div></div><div class="tip">🔑 <b>in all / combined</b> → add &nbsp; | &nbsp; <b>how many more / fewer</b> → subtract</div>`,
  init(r){const A={1:'<div class="eq">18 + 14 = 32 goals</div>',2:'<div class="eq">18 − 6 = 12 fewer goals</div>'};r.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{r.querySelector('#a'+b.dataset.a).innerHTML=A[b.dataset.a];sCorrect()})}},
 {title:'Remember!',html:`<div class="row" style="align-items:stretch"><div class="note" style="flex:1;min-width:250px">🖼️ <b>Picture graph</b><br>Read the <b>key</b> first! A half picture is worth half.</div><div class="note" style="flex:1;min-width:250px;background:#fff7ed;border-color:#f97316">📶 <b>Bar graph</b><br>Read the <b>scale</b>. Look where the bar ends.</div><div class="note" style="flex:1;min-width:250px;background:#f0fdf4;border-color:#22c55e">➕ ➖ <b>Compare</b><br>In all → add.<br>More / fewer → subtract.</div></div>`}
],
chalk:[
 {label:'Key: each = 2',text:'Each ⚽ = 2 goals. ⚽⚽⚽⚽ + half ⚽ = ?'},
 {label:'Key: each = 10',text:'Each 💡 = 10 hours. 💡💡💡💡💡 = ?'},
 {label:'More than',text:'How many more ___ than ___ ?'},
 {label:'Combined',text:'How many ___ and ___ combined?'},
 {label:'Football 9 × 7',text:'Which days can you use 9 × 7 to find the points?'},
 {label:'Draw a bar graph',text:'Draw a bar graph: scale goes up by 5.'}
],
g1:{tab:'🖼️ Game 1: Picture Graphs',title:'Picture Graph Detective',emoji:'🖼️',n:10,gen(i){
 const T=pick(PGT),K=pick([2,2,4,10]),h=K/2,vals=distinctVals(4,()=>rnd(1,12)*h),G=pictureGraph(Object.assign({},T,{vals,key:K}));
 const t=i%5,[x,y]=shuffle([0,1,2,3]);let q,ans,c,hint;const big=vals[x]>=vals[y]?x:y,sm=big===x?y:x;
 const icons=v=>Math.ceil(v/K);
 if(t===0||t===3){const k=t===0?x:y;q=`How many ${T.unit} for <b>${T.cats[k]}</b>?`;ans=vals[k];c=[icons(ans),ans+h,ans-h,ans+K];hint=`Each ${T.icon} = ${K}. A half = ${h}.`}
 else if(t===1){q=`How many <b>more</b> ${T.unit} for <b>${T.cats[big]}</b> than for <b>${T.cats[sm]}</b>?`;ans=vals[big]-vals[sm];if(ans===0)ans=0;c=[icons(vals[big])-icons(vals[sm]),ans+K,ans+h,vals[big]];hint='Find both numbers, then subtract.'}
 else if(t===2){q=`How many ${T.unit} for <b>${T.cats[x]}</b> and <b>${T.cats[y]}</b> combined?`;ans=vals[x]+vals[y];c=[icons(vals[x])+icons(vals[y]),ans-K,ans+K,ans-h];hint='Find both numbers, then add.'}
 else{const k=x;q=`Which row shows exactly <b>${vals[k]}</b> ${T.unit}?`;return{type:'mcq',key:G+q,html:`${G}<p>${q}</p>`,choices:shuffle(T.cats.slice()),answer:T.cats[k],hint:`Use the key: each ${T.icon} = ${K}.`,explain:`${T.cats[k]} has ${vals[k]} ${T.unit}.`}}
 return{type:'mcq',key:G+q,html:`${G}<p>${q}</p>`,choices:opts(ans,c),answer:ans,hint,explain:t===1?`${vals[big]} − ${vals[sm]} = <b>${ans}</b>`:t===2?`${vals[x]} + ${vals[y]} = <b>${ans}</b>`:`The answer is <b>${ans}</b> ${T.unit}.`}}},
g2:{tab:'📶 Game 2: Bar Graphs',title:'Bar Graph Ace',emoji:'📶',n:10,gen(i){
 const T=pick(BGT),step=pick([2,5,10]),max=step*10,vals=distinctVals(4,()=>rnd(1,10)*step),G=barGraph({title:T.title,cats:T.cats,vals,step,max,labelEvery:step===2?2:1,ylab:T.ylab,xlab:T.xlab});
 const t=i%4,[x,y,z]=shuffle([0,1,2,3]);const big=vals[x]>=vals[y]?x:y,sm=big===x?y:x;let q,ans,ex;
 if(t===0){q=`How many ${T.u} for <b>${T.cats[x]}</b>?`;ans=vals[x];ex=`The bar for ${T.cats[x]} ends at <b>${ans}</b>.`}
 else if(t===1){q=`How many <b>more</b> ${T.u} for <b>${T.cats[big]}</b> than for <b>${T.cats[sm]}</b>?`;ans=vals[big]-vals[sm];ex=`${vals[big]} − ${vals[sm]} = <b>${ans}</b>`}
 else if(t===2){q=`How many ${T.u} for <b>${T.cats[x]}</b> and <b>${T.cats[y]}</b> combined?`;ans=vals[x]+vals[y];ex=`${vals[x]} + ${vals[y]} = <b>${ans}</b>`}
 else{const s=vals[y]+vals[z];if(s>vals[x]){q=`How many <b>fewer</b> ${T.u} for <b>${T.cats[x]}</b> than for <b>${T.cats[y]}</b> and <b>${T.cats[z]}</b> combined?`;ans=s-vals[x];ex=`${vals[y]} + ${vals[z]} = ${s}, and ${s} − ${vals[x]} = <b>${ans}</b>`}else{q=`How many <b>more</b> ${T.u} for <b>${T.cats[x]}</b> than for <b>${T.cats[y]}</b> and <b>${T.cats[z]}</b> combined?`;ans=vals[x]-s;ex=`${vals[y]} + ${vals[z]} = ${s}, and ${vals[x]} − ${s} = <b>${ans}</b>`}}
 return{type:'input',key:G+q,html:`${G}<p>${q}</p><p style="font-size:18px;color:#64748b">Each grid line = ${step} ${T.u}.</p>`,answer:ans,suffix:T.u,hint:t===0?'Follow the top of the bar across to the numbers.':t===3?'Two steps: first add the two bars, then compare.':'Find each bar\'s number first.',explain:ex}}}
};
