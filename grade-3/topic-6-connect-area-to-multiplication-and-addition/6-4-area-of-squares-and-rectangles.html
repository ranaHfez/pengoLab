<script>
/* ===== helpers ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function opts(ans,cands,n=4,fmt=x=>x){const out=[ans];for(const c of cands){if(out.length>=n)break;if(c>0&&Number.isInteger(c)&&!out.includes(c))out.push(c)}let k=1;while(out.length<n){for(const c of [ans+k,ans-k]){if(out.length<n&&c>0&&!out.includes(c))out.push(c)}k++}return shuffle(out).map(fmt)}
const B=s=>`<span class="blank">${s}</span>`;

/* ===== sound ===== */
let AC=null,muted=false;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type='triangle',g=.16){try{const a=ac(),o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;const t0=a.currentTime+t;v.gain.setValueAtTime(0,t0);v.gain.linearRampToValueAtTime(g,t0+.02);v.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(v).connect(a.destination);o.start(t0);o.stop(t0+d+.05)}catch(e){}}
function clap(t){try{const a=ac(),len=Math.floor(a.sampleRate*.1),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1000+Math.random()*900;f.Q.value=.7;const g=a.createGain();g.gain.value=.55;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t)}catch(e){}}
function cheer(t,d){try{const a=ac(),len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++){const env=Math.sin(Math.PI*i/len);x[i]=(Math.random()*2-1)*env*.5}const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.4;const g=a.createGain();g.gain.value=.22;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t)}catch(e){}}
function sCorrect(){if(muted)return;[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.3));cheer(.2,1.3);for(let i=0;i<12;i++)clap(.3+i*.09+Math.random()*.05)}
function sWrong(){if(muted)return;tone(330,0,.18,'square',.06);tone(247,.15,.3,'square',.06)}
function sClick(){if(muted)return;tone(900,0,.07,'sine',.07)}
function sWin(){if(muted)return;[523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.14,.35,'triangle',.18));cheer(.3,2.2);for(let i=0;i<24;i++)clap(.4+i*.08+Math.random()*.05)}

/* ===== confetti ===== */
const cf=$('#confetti'),cx=cf.getContext('2d');let parts=[],cfOn=false;
function confetti(n=110){cf.width=innerWidth;cf.height=innerHeight;const cols=['#f43f5e','#f59e0b','#22c55e','#3b82f6','#a855f7','#facc15'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,life:120});if(!cfOn){cfOn=true;requestAnimationFrame(cfLoop)}}
function cfLoop(){cx.clearRect(0,0,cf.width,cf.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});parts=parts.filter(p=>p.life>0&&p.y<cf.height+20);if(parts.length)requestAnimationFrame(cfLoop);else{cfOn=false;cx.clearRect(0,0,cf.width,cf.height)}}

/* ===== drawings: SVG builders ===== */
function rectSVG(o){
 const R=o.rows,C=o.cols,u=o.unit||Math.max(16,Math.min(36,Math.floor(340/Math.max(R,C))));
 if(o.center&&C*u<140)o=Object.assign({},o,{bottom:'Area = '+o.center,center:null});
 const L=o.side!=null?78:16,T=o.top!=null||o.topParts?40:14,W=C*u,H=R*u,Bt=o.bottom?44:16;
 const VW=L+W+20,VH=T+H+Bt;
 const f1=o.fill||'#86efac',f2=o.fill2||'#fdba74',st=o.stroke||'#14532d';
 let s=`<svg class="rsvg" viewBox="0 0 ${VW} ${VH}" style="max-width:${Math.min(VW*1.5,o.maxW||640)}px">`;
 if(o.split){const a=o.split.at;if(o.split.dir==='h'){s+=`<rect x="${L}" y="${T}" width="${W}" height="${a*u}" fill="${f1}"/><rect x="${L}" y="${T+a*u}" width="${W}" height="${H-a*u}" fill="${f2}"/>`}else{s+=`<rect x="${L}" y="${T}" width="${a*u}" height="${H}" fill="${f1}"/><rect x="${L+a*u}" y="${T}" width="${W-a*u}" height="${H}" fill="${f2}"/>`}}
 else s+=`<rect x="${L}" y="${T}" width="${W}" height="${H}" fill="${f1}"/>`;
 if(o.cells){for(let r=0;r<R;r++)for(let c=0;c<C;c++)s+=`<rect class="cell" data-r="${r}" data-c="${c}" x="${L+c*u}" y="${T+r*u}" width="${u}" height="${u}" fill="transparent"/>`}
 if(o.grid){for(let c=1;c<C;c++)s+=`<line x1="${L+c*u}" y1="${T}" x2="${L+c*u}" y2="${T+H}" stroke="${st}" stroke-opacity=".45" stroke-width="1.5"/>`;for(let r=1;r<R;r++)s+=`<line x1="${L}" y1="${T+r*u}" x2="${L+W}" y2="${T+r*u}" stroke="${st}" stroke-opacity=".45" stroke-width="1.5"/>`}
 s+=`<rect x="${L}" y="${T}" width="${W}" height="${H}" fill="none" stroke="${st}" stroke-width="4" rx="2"/>`;
 if(o.split){const a=o.split.at;if(o.split.dir==='h')s+=`<line x1="${L-6}" y1="${T+a*u}" x2="${L+W+6}" y2="${T+a*u}" stroke="#111" stroke-width="5" stroke-dasharray="10 6"/>`;else s+=`<line x1="${L+a*u}" y1="${T-6}" x2="${L+a*u}" y2="${T+H+6}" stroke="#111" stroke-width="5" stroke-dasharray="10 6"/>`}
 const tx=(x,y,t,anc='middle',col='#111',sz=18)=>`<text x="${x}" y="${y}" text-anchor="${anc}" font-size="${sz}" font-weight="800" fill="${col}">${t}</text>`;
 if(o.topParts&&o.split&&o.split.dir!=='h'){const a=o.split.at;s+=tx(L+a*u/2,T-12,o.topParts[0],'middle','#b45309');s+=tx(L+a*u+(W-a*u)/2,T-12,o.topParts[1],'middle','#b45309')}

function iconRow(v,K,icon){const full=Math.floor(v/K),half=v%K?1:0;return icon.repeat(full)+(half?`<span class="half">${icon}</span>`:'')}
function pictureGraph(o){
 const K=o.key;let h=`<div class="pg"><div class="pg-title">${o.title}</div><table>`;
 o.cats.forEach((c,i)=>{h+=`<tr ${o.clickable?`class="clk" data-i="${i}"`:''}><th>${c}</th><td>${iconRow(o.vals[i],K,o.icon)}</td></tr>`});
 h+=`</table><div class="pg-key">Key: Each ${o.icon} = ${K} ${o.unit}. Each <span class="half">${o.icon}</span> = ${K/2} ${K/2===1?o.unit1||o.unit:o.unit}.</div></div>`;return h}
function barGraph(o){
 const n=o.cats.length,bw=54,gap=34,x0=70,y0=44,ph=250,pw=n*(bw+gap)+gap,max=o.max,step=o.step,le=o.labelEvery||1;
 const VW=x0+pw+16,VH=y0+ph+70,Y=v=>y0+ph-v/max*ph;
 const cols=o.colors||['#3b82f6','#ec4899','#f59e0b','#22c55e','#8b5cf6'];
 let s=`<svg class="rsvg bg" viewBox="0 0 ${VW} ${VH}" style="max-width:${VW*1.12}px"><text x="${VW/2}" y="24" text-anchor="middle" font-size="20" font-weight="900">${o.title}</text>`;
 for(let v=0,k=0;v<=max;v+=step,k++){s+=`<line x1="${x0}" y1="${Y(v)}" x2="${x0+pw}" y2="${Y(v)}" stroke="${k%le?'#e2e8f0':'#94a3b8'}" stroke-width="${k%le?1.5:2}"/>`;if(k%le===0)s+=`<text x="${x0-8}" y="${Y(v)+6}" text-anchor="end" font-size="16" font-weight="700">${v}</text>`}
 o.cats.forEach((c,i)=>{const x=x0+gap+i*(bw+gap);s+=`<rect class="bar" data-i="${i}" x="${x}" y="${Y(o.vals[i])}" width="${bw}" height="${ph-(Y(o.vals[i])-y0)}" fill="${cols[i%cols.length]}" stroke="#0f172a" stroke-width="2" style="cursor:${o.clickable?'pointer':'default'}"/><text x="${x+bw/2}" y="${y0+ph+24}" text-anchor="middle" font-size="16" font-weight="800">${c}</text>`});
 s+=`<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0+ph}" stroke="#0f172a" stroke-width="3"/><line x1="${x0}" y1="${y0+ph}" x2="${x0+pw}" y2="${y0+ph}" stroke="#0f172a" stroke-width="3"/>`;
 s+=`<text x="${x0+pw/2}" y="${y0+ph+56}" text-anchor="middle" font-size="17" font-weight="800" fill="#475569">${o.xlab||''}</text><text transform="translate(18 ${y0+ph/2}) rotate(-90)" text-anchor="middle" font-size="17" font-weight="800" fill="#475569">${o.ylab||''}</text>`;
 s+=`<g class="guide"></g></svg>`;return s}

/* ===== quiz engine ===== */
const PRAISE=['Amazing! 🎉','Super star! ⭐','You got it! 👏','Brilliant! 🧠','Fantastic! 🚀','Math hero! 🦸','Wonderful! 🌈','Excellent! 💯'];
const RETRY=['Almost! Try again 💪','Oops! Look again 👀','Not yet — you can do it! 🌟','Think again 🤔'];
let activeQuiz=null;
function Quiz(el,cfg){
 let qs,i,score,tries,val='',done=false;
 function build(){qs=[];if(cfg.list){qs=cfg.list();return}const seen=new Set();let g=0;while(qs.length<cfg.n&&g++<800){const q=cfg.gen(qs.length);const k=q.key||q.html;if(seen.has(k))continue;seen.add(k);qs.push(q)}}
 function start(){build();i=0;score=0;show()}
 function dots(){return qs.map((q,k)=>`<span class="${k===i&&!done?'cur':''} ${q.res||''}"></span>`).join('')}
 function show(){done=false;const q=qs[i];el.__q=q;tries=0;val='';
  el.innerHTML=`<div class="qwrap"><div class="qhead"><div class="title">${cfg.emoji||'🎮'} ${cfg.title}</div><div class="dots">${dots()}</div><div class="score">⭐ ${score}</div></div>
  <div class="qcard"><div class="qnum">Question ${i+1} of ${qs.length}</div><div class="qtext">${q.html}</div><div class="answers ${q.wide?'wide':''}"></div><div class="feedback"></div></div></div>`;
  const A=el.querySelector('.answers');
  if(q.type==='input'){A.className='numpad';A.innerHTML=`<div class="numdisp"><span class="v">?</span>${q.suffix?`<span class="suf">${q.suffix}</span>`:''}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-k="${d}">${d}</button>`).join('')}<button class="del" data-k="del">⌫</button><button class="go" data-k="go">✔ Check</button></div>`;
   A.querySelectorAll('button').forEach(b=>b.onclick=()=>key(b.dataset.k));}
  else{q.choices.forEach(c=>{const b=document.createElement('button');b.className='ans';b.innerHTML=c;b.onclick=()=>check(c,b);A.appendChild(b)})}
  activeQuiz=api}
 function key(k){if(done)return;const q=qs[i];if(k==='del')val=val.slice(0,-1);else if(k==='go'){if(val!=='')check(val,el.querySelector('.numdisp'));return}else if(val.length<4)val+=k;sClick();el.querySelector('.numdisp .v').textContent=val||'?'}
 function check(v,btn){if(done)return;const q=qs[i];const ok=String(v).replace(/<[^>]+>/g,'')===String(q.answer).replace(/<[^>]+>/g,'')||Number(v)===q.answer&&q.type==='input';const fb=el.querySelector('.feedback');
  if(ok){done=true;if(tries===0){score++;q.res='ok'}else q.res='mid';if(btn.classList)btn.classList.add('right');sCorrect();confetti();
   fb.innerHTML=`<div class="good"><b>${pick(PRAISE)}</b> ${q.explain||''}</div><div class="center" style="margin-top:12px"><button class="btn">${i<qs.length-1?'Next ➜':'See my stars ⭐'}</button></div>`;
   fb.querySelector('.btn').onclick=()=>{i++;i<qs.length?show():end()};el.querySelector('.score').textContent='⭐ '+score;el.querySelector('.dots').innerHTML=dots();
   if(q.type==='input')el.querySelector('.numdisp').style.borderColor='var(--ok)';}
  else{tries++;sWrong();if(q.type==='input'){const d=el.querySelector('.numdisp');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');val='';d.querySelector('.v').textContent='?'}else{btn.classList.add('wrong');btn.disabled=true}
   fb.innerHTML=`<div class="try"><b>${pick(RETRY)}</b> ${q.hint?'💡 '+q.hint:''}</div>`}}
 function end(){done=true;activeQuiz=null;const n=qs.length,st=score>=n*.9?3:score>=n*.6?2:score>=1?1:0;sWin();confetti(250);setTimeout(()=>confetti(200),700);
  el.innerHTML=`<div class="qwrap"><div class="qcard endcard"><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><h2>${st===3?'WOW! Super Mathematician! 🏆':st===2?'Great job! 🎉':'Good try! Keep practicing 💪'}</h2><p class="big">You got ${score} out of ${n} on the first try!</p><button class="btn">🔄 Play again</button></div></div>`;
  el.querySelector('.btn').onclick=start}
 const api={key,isInput:()=>qs&&qs[i]&&qs[i].type==='input'&&!done,el};start();return api}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='p'||e.key==='P'){togglePen();return}
 if(activeQuiz&&activeQuiz.isInput()&&activeQuiz.el.closest('.panel.active')){if(/^[0-9]$/.test(e.key))activeQuiz.key(e.key);else if(e.key==='Backspace')activeQuiz.key('del');else if(e.key==='Enter')activeQuiz.key('go')}});

/* ===== stepper ===== */
function Stepper(el,steps){let k=0;const seen=new Set();
 function show(){seen.add(k);el.innerHTML=`<div class="steps-nav">${steps.map((s,j)=>`<button class="${j===k?'on':seen.has(j)?'done':''}" data-j="${j}">${j+1}. ${s.title}</button>`).join('')}</div><div class="card step-body"><h2>${s0().title}</h2>${s0().html}<div class="step-foot"><button class="btn ghost" ${k===0?'style="visibility:hidden"':''} data-go="-1">⬅ Back</button><button class="btn" ${k===steps.length-1?'style="visibility:hidden"':''} data-go="1">Next ➜</button></div></div>`;
  el.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{k=+b.dataset.j;sClick();show()});el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{k+= +b.dataset.go;sClick();show();el.scrollIntoView({behavior:'smooth'})});
  if(s0().init)s0().init(el.querySelector('.step-body'))}
 const s0=()=>steps[k];show()}

/* ===== ink (write anywhere) ===== */
const Pen={on:false,tool:'pen',color:'#e11d48',size:6};
const COLORS=['#111827','#ffffff','#e11d48','#2563eb','#16a34a','#f59e0b','#9333ea','#facc15'];
const inks=[];
function setupInk(panel){const cv=document.createElement('canvas');cv.className='ink';panel.appendChild(cv);const o={panel,cv,ctx:cv.getContext('2d'),strokes:[],W:1,cur:null};inks.push(o);
 new ResizeObserver(()=>fitInk(o)).observe(panel);
 cv.addEventListener('pointerdown',e=>{if(!Pen.on)return;e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(o,e);o.cur={tool:Pen.tool,color:Pen.color,size:Pen.size/o.W,pts:[p,p]};o.strokes.push(o.cur);draw(o)});
 cv.addEventListener('pointermove',e=>{if(!o.cur)return;e.preventDefault();const p=pt(o,e);if(['line','rect','circle'].includes(o.cur.tool))o.cur.pts[1]=p;else o.cur.pts.push(p);if(!o.raf)o.raf=requestAnimationFrame(()=>{o.raf=0;draw(o)})});
 const up=()=>{o.cur=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);return o}
function pt(o,e){const r=o.cv.getBoundingClientRect();return[(e.clientX-r.left)/o.W,(e.clientY-r.top)/o.W]}
function fitInk(o){const w=o.panel.offsetWidth,h=o.panel.offsetHeight;if(!w)return;const d=window.devicePixelRatio||1;o.cv.style.width=w+'px';o.cv.style.height=h+'px';o.cv.width=Math.round(w*d);o.cv.height=Math.round(h*d);o.W=w;o.ctx.setTransform(d,0,0,d,0,0);draw(o)}
function draw(o){const c=o.ctx,W=o.W;c.clearRect(0,0,o.cv.width,o.cv.height);for(const s of o.strokes){c.save();c.lineCap='round';c.lineJoin='round';
 let lw=s.size*W;if(s.tool==='eraser'){c.globalCompositeOperation='destination-out';c.strokeStyle='#000';lw*=4}else{c.strokeStyle=s.color;if(s.tool==='hl'){c.globalAlpha=.35;lw*=3.5}}
 c.lineWidth=lw;c.beginPath();const P=s.pts.map(p=>[p[0]*W,p[1]*W]);
 if(s.tool==='line'){c.moveTo(...P[0]);c.lineTo(...P[1])}
 else if(s.tool==='rect'){c.rect(P[0][0],P[0][1],P[1][0]-P[0][0],P[1][1]-P[0][1])}
 else if(s.tool==='circle'){c.ellipse((P[0][0]+P[1][0])/2,(P[0][1]+P[1][1])/2,Math.abs(P[1][0]-P[0][0])/2+.1,Math.abs(P[1][1]-P[0][1])/2+.1,0,0,7)}
 else{c.moveTo(...P[0]);for(let i=1;i<P.length-1;i++){const m=[(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2];c.quadraticCurveTo(P[i][0],P[i][1],m[0],m[1])}c.lineTo(...P[P.length-1])}

<script>
const UNITS=[['ft','feet','square feet'],['in.','inches','square inches'],['m','meters','square meters'],['cm','centimeters','square centimeters'],['yd','yards','square yards']];
const NAMES=['Suji','Omar','Lina','Jen','Yousef','Mariam','Adam','Sara','Hamza','Noor'];
const THINGS=[['garden','ft'],['rug','ft'],['poster','in.'],['classroom','m'],['sticker','cm'],['playground','yd'],['table top','ft'],['photo','in.']];
function U(sym){return UNITS.find(u=>u[0]===sym)}

const LESSON={
warm:{title:'Warm-up: Remember Area!',list:()=>[
 {type:'mcq',html:`<p>Count the unit squares. What is the area?</p>${rectSVG({rows:3,cols:4,grid:true})}<p style="font-size:18px">▢ = 1 square unit</p>`,choices:shuffle(['12 square units','7 square units','14 square units','10 square units']),answer:'12 square units',hint:'Count every little square. Go row by row!',explain:'There are 12 unit squares, so the area is 12 square units.'},
 {type:'mcq',html:`<p>Monica buys a postage stamp. Which unit is best for its area?</p><p style="font-size:60px;margin:0">📮</p>`,choices:shuffle(['square inches','square meters','square miles']),answer:'square inches',hint:'A stamp is very small!',explain:'A stamp is tiny, so we use small units: square inches.'},
 {type:'mcq',html:`<p class="big">5 × 4 = ?</p>`,choices:opts(20,[9,25,16]),answer:20,hint:'Count 5 four times: 5, 10, 15, …',explain:'5 × 4 = 20'},
 {type:'mcq',html:`<p class="big">8 × 6 = ?</p>`,choices:opts(48,[14,42,56]),answer:48,hint:'8 × 5 = 40. Add one more 8.',explain:'8 × 6 = 48'},
 {type:'mcq',html:`<p>Each square is 1 square foot. What is the area?</p>${rectSVG({rows:2,cols:5,grid:true,fill:'#93c5fd',stroke:'#1e3a8a'})}`,choices:shuffle(['10 square feet','7 square feet','12 square feet','5 square feet']),answer:'10 square feet',hint:'Count the squares, then say the unit: square feet.',explain:'10 squares → 10 square feet.'}
]},
learn:[
 {title:'The Problem',html:`<div class="row"><div style="flex:1;min-width:280px"><p>Mike paints a rectangular wall in his room <b style="color:#16a34a">green</b>. The wall is <b>6 feet</b> wide and <b>8 feet</b> tall.</p><p>A small can of paint covers <b>40 square feet</b>. 🎨</p><p class="big">Does Mike need more than one can?</p><button class="btn alt" id="sg">Show unit squares ▦</button></div><div style="flex:1;min-width:260px" id="wall"></div></div>`,
  init(r){let g=false;const d=()=>r.querySelector('#wall').innerHTML=rectSVG({rows:8,cols:6,grid:g,top:'6 ft',side:'8 ft',unit:32});d();r.querySelector('#sg').onclick=()=>{g=!g;sClick();d()}}},
 {title:'One Way: Count',html:`<p>We can <b>count</b> the unit squares. Each square is 1 square foot.</p><div class="row"><div style="flex:1;min-width:260px" id="cw"></div><div style="flex:1;min-width:240px" class="center"><p class="big">Counted: <span id="cn" style="color:#e11d48;font-size:48px">0</span></p><button class="btn" id="ca">▶ Count for me</button><p class="tip">That's a lot of squares to count! 😅 Is there a faster way?</p></div></div>`,
  init(r){r.querySelector('#cw').innerHTML=rectSVG({rows:8,cols:6,grid:true,top:'6 ft',side:'8 ft',unit:32,cells:true});const cells=[...r.querySelectorAll('.cell')];let n=0,t=null;
   const mark=c=>{if(c.dataset.on)return;c.dataset.on=1;n++;c.setAttribute('fill','#facc15');r.querySelector('#cn').textContent=n;tone(400+n*12,0,.05,'sine',.05)};
   cells.forEach(c=>c.onclick=()=>mark(c));
   r.querySelector('#ca').onclick=()=>{clearInterval(t);let k=0;t=setInterval(()=>{while(k<cells.length&&cells[k].dataset.on)k++;if(k>=cells.length){clearInterval(t);sCorrect();return}mark(cells[k])},110)}}},
 {title:'Faster Way: Multiply',html:`<p>Count the <b>rows</b>. Count the <b>squares in each row</b>. Then <b>multiply</b>!</p><div class="row"><div style="flex:1;min-width:260px" id="mw"></div><div style="flex:1;min-width:260px"><p class="big" id="rowtxt">Press the button to fill the rows!</p><p class="big" id="skip" style="color:#7c3aed"></p><button class="btn" id="fr">▶ Fill row by row</button><div id="concl"></div></div></div>`,
  init(r){r.querySelector('#mw').innerHTML=rectSVG({rows:8,cols:6,grid:true,top:'6 squares in each row',side:'8 rows',unit:32,cells:true});
   r.querySelector('#fr').onclick=()=>{const cells=[...r.querySelectorAll('.cell')];cells.forEach(c=>c.setAttribute('fill','transparent'));let row=0;const sk=[];
    const t=setInterval(()=>{cells.filter(c=>+c.dataset.r===row).forEach(c=>c.setAttribute('fill',row%2?'#fde047':'#fb923c'));sk.push((row+1)*6);row++;tone(300+row*60,0,.15);
     r.querySelector('#rowtxt').textContent=`${row} row${row>1?'s':''} of 6`;r.querySelector('#skip').textContent=sk.join(', ');
     if(row===8){clearInterval(t);sCorrect();confetti();r.querySelector('#concl').innerHTML=`<div class="eq">8 × 6 = 48</div><p>The area is <b>48 square feet</b>.<br>48 is more than 40, so Mike needs <b>more than one can</b> of paint! 🎨🎨</p>`}},450)}}},
 {title:'Build a Rectangle',html:`<p>Move the sliders. Watch the area change! 🔧</p><div class="row"><div style="min-width:260px"><p><b>Rows (length):</b> <span id="rv" class="pill">4</span><br><input type="range" id="rs" min="1" max="10" value="4"></p><p><b>Squares in each row (width):</b> <span id="cv" class="pill">5</span><br><input type="range" id="cs" min="1" max="10" value="5"></p><div id="eqb"></div><div id="sq"></div></div><div style="flex:1;min-width:260px" id="bw"></div></div>`,
  init(r){const up=()=>{const R=+r.querySelector('#rs').value,C=+r.querySelector('#cs').value;r.querySelector('#rv').textContent=R;r.querySelector('#cv').textContent=C;r.querySelector('#bw').innerHTML=rectSVG({rows:R,cols:C,grid:true,top:C+' units',side:R+' units',unit:30,fill:R===C?'#c4b5fd':'#86efac'});
   r.querySelector('#eqb').innerHTML=`<div class="eq">${R} × ${C} = ${R*C}</div><p>Area = <b>${R*C} square units</b></p>`;r.querySelector('#sq').innerHTML=R===C?`<div class="tip">🎉 It's a <b>SQUARE</b>! All sides are the same.<br>Area = side × side = ${R} × ${R}</div>`:''};
   r.querySelectorAll('input').forEach(i=>i.oninput=()=>{up();sClick()});up()}},
 {title:'Squares: Side × Side',html:`<div class="row"><div style="flex:1;min-width:260px"><p>Suji's garden is <b>4 yards long</b> and <b>4 yards wide</b>. It is a <b>square</b>!</p><p>Kevin found a shortcut: for a square, multiply the length of <b>one side by itself</b>. ✅</p><button class="btn alt" id="sh">Show the area</button><div id="sa"></div></div><div style="flex:1;min-width:240px" id="sgw"></div></div>`,
  init(r){r.querySelector('#sgw').innerHTML=rectSVG({rows:4,cols:4,grid:true,top:'4 yd',side:'4 yd',unit:44,fill:'#c4b5fd',stroke:'#4c1d95'});r.querySelector('#sh').onclick=()=>{sCorrect();r.querySelector('#sa').innerHTML=`<div class="eq">4 × 4 = 16</div><p>The area is <b>16 square yards</b>.</p>`}}},
 {title:'Find a Missing Side',html:`<p>The area of another wall is <b>56 square feet</b>. The wall is <b>8 feet</b> high. How wide is it?</p><div class="row"><div style="flex:1;min-width:260px"><div class="eq">56 = 8 × ${B('?')}</div><p>Try a width: 👇</p><div class="row" id="tries"></div><div id="res"></div></div><div style="flex:1;min-width:260px" id="mw2"></div></div>`,
  init(r){const draw=w=>r.querySelector('#mw2').innerHTML=rectSVG({rows:8,cols:w||1,grid:!!w,top:w?w+' ft':'? ft',side:'8 ft',unit:28,fill:w?'#86efac':'#e2e8f0'});draw(0);
   r.querySelector('#tries').innerHTML=[5,6,7,8].map(w=>`<button class="btn ghost" data-w="${w}">${w} ft</button>`).join('');
   r.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=+b.dataset.w;draw(w);if(w*8===56){sCorrect();confetti();r.querySelector('#res').innerHTML=`<div class="good" style="background:#dcfce7;border-radius:14px;padding:10px;margin-top:10px"><b>Yes!</b> 8 × 7 = 56.<br>We can divide: <b>56 ÷ 8 = 7</b>.<br>The wall is <b>7 feet</b> wide.</div>`}else{sWrong();r.querySelector('#res').innerHTML=`<div class="try" style="background:#fee2e2;border-radius:14px;padding:10px;margin-top:10px">8 × ${w} = ${8*w}. That is ${8*w<56?'less':'more'} than 56. Try again!</div>`}})}},
 {title:'Remember!',html:`<div class="row" style="align-items:stretch"><div class="note" style="flex:1;min-width:250px">📐 <b>Rectangle</b><br>Area = length × width<br><span class="eq" style="font-size:22px">8 × 6 = 48 sq ft</span></div><div class="note" style="flex:1;min-width:250px;background:#f5f3ff;border-color:#8b5cf6">🟪 <b>Square</b><br>Area = side × side<br><span class="eq" style="font-size:22px">4 × 4 = 16 sq yd</span></div><div class="note" style="flex:1;min-width:250px;background:#fff7ed;border-color:#f97316">🔍 <b>Missing side</b><br>Area ÷ known side<br><span class="eq" style="font-size:22px">56 ÷ 8 = 7 ft</span></div></div><p class="tip">✏️ Always write the <b>square unit</b>: square feet, square inches, square meters …</p>`}
],

g1:{tab:'🧱 Game 1: Area Builder',title:'Area Builder',emoji:'🧱',n:10,gen(i){
 const t=i%5;let r,c,u,html,key;
 if(t===4){r=rnd(3,9);c=rnd(3,9);u=U('ft');html=`<p>A floor has <b>${r} rows</b> of tiles with <b>${c} tiles</b> in each row. Each tile is 1 square foot. What is the area of the floor?</p><p style="font-size:44px;margin:0">🟫🟫🟫</p>`}
 else if(t===3){const th=pick(THINGS);u=U(th[1]);r=rnd(2,9);c=rnd(2,9);const nm=pick(NAMES);html=`<p>${nm}'s ${th[0]} is <b>${r} ${u[1]}</b> long and <b>${c} ${u[1]}</b> wide. What is its area?</p>`}
 else if(t===1){u=pick(UNITS);r=c=rnd(2,9);html=`<p>This is a <b>square</b>. What is its area?</p>${rectSVG({rows:r,cols:c,grid:false,top:c+' '+u[0],side:r+' '+u[0],fill:'#c4b5fd',stroke:'#4c1d95'})}`}
 else{u=pick(UNITS);r=rnd(2,9);c=rnd(2,10);html=`<p>What is the area of this rectangle?</p>${rectSVG({rows:r,cols:c,grid:t===0,top:c+' '+u[0],side:r+' '+u[0]})}`}
 const a=r*c,f=n=>`${n} ${u[2]}`;
 return{type:'mcq',key:t+'-'+r+'x'+c,html,choices:opts(a,[r+c,a+c,a-r,2*(r+c)],4,f),answer:f(a),hint:t===4?'Rows × tiles in each row.':t===1?'A square: side × side.':'Multiply the two side lengths.',explain:`${r} × ${c} = ${a}. The area is <b>${a} ${u[2]}</b>.`}}},
g2:{tab:'🔍 Game 2: Missing Side',title:'Missing Side Detective',emoji:'🔍',n:10,gen(i){
 const u=pick(UNITS);
 if(i%3===2){const s=rnd(2,9);return{type:'input',key:'sq'+s,suffix:u[1],html:`<p>A <b>square</b> has an area of <b>${s*s} ${u[2]}</b>. How long is each side?</p>${rectSVG({rows:5,cols:5,unit:26,top:'? '+u[0],side:'? '+u[0],fill:'#c4b5fd',stroke:'#4c1d95',center:s*s+' sq '+u[0]})}`,answer:s,hint:`Which number times itself makes ${s*s}?`,explain:`${s} × ${s} = ${s*s}, so each side is <b>${s} ${u[1]}</b>.`}}
 const a=rnd(2,9),b=rnd(2,9),A=a*b,vert=Math.random()<.5;
 const svg=vert?rectSVG({rows:a,cols:b,unit:Math.min(30,Math.floor(300/Math.max(a,b))),top:'? '+u[0],side:a+' '+u[0],center:A+' sq '+u[0]}):rectSVG({rows:b,cols:a,unit:Math.min(30,Math.floor(300/Math.max(a,b))),top:a+' '+u[0],side:'? '+u[0],center:A+' sq '+u[0]});
 return{type:'input',key:a+'x'+b,suffix:u[1],html:`<p>The area is <b>${A} ${u[2]}</b>. One side is <b>${a} ${u[1]}</b>. What is the missing side?</p><p style="font-size:22px">${A} = ${a} × ${B('?')}</p>${svg}`,answer:b,hint:`Divide: ${A} ÷ ${a}. Think: ${a} × what = ${A}?`,explain:`${A} ÷ ${a} = ${b}, because ${a} × ${b} = ${A}. The missing side is <b>${b} ${u[1]}</b>.`}}}
};
