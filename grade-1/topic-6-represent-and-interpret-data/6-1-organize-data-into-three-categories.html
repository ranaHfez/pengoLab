<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 6-1 Organize Data into Three Categories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Shared template: colors, fonts, sounds, buttons, mascots. Keep this. -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/theme.js" defer></script>
<style>
:root{--teal:#0f766e;--teal2:#14b8a6;--sun:#fbbf24;--coral:#fb7185;--ink:#1f2937;--hdr:66px;--tabs:58px;--orange:#fb923c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;color:var(--ink)}
body{background:#dff7ef radial-gradient(#bfeadb 1.6px,transparent 1.6px) 0 0/22px 22px;display:flex;flex-direction:column}
header{height:var(--hdr);flex:0 0 var(--hdr);background:linear-gradient(90deg,#0f766e,#0ea5a0 60%,#22c3b4);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;box-shadow:0 4px 0 #0b5e57;position:relative;z-index:5}
.badge{background:var(--sun);color:#7c2d12;font-weight:800;border-radius:14px;padding:2px 12px;font-size:22px;box-shadow:0 3px 0 #b45309;white-space:nowrap}
.htxt h1{font-size:25px;margin:0;line-height:1.05}
.htxt .ican{font-size:16px;opacity:.95}
.htxt .ican b{color:#fde68a}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.sig{font-size:16px;opacity:.95;font-weight:700;white-space:nowrap}
.iconbtn{background:#ffffff26;border:2px solid #ffffff80;color:#fff;border-radius:12px;font-size:20px;padding:0 10px;height:38px;cursor:pointer;font-family:inherit}
nav{height:var(--tabs);flex:0 0 var(--tabs);display:flex;gap:8px;padding:9px 12px 0;overflow-x:auto;overflow-y:hidden}
nav button{flex:0 0 auto;border:none;border-radius:18px 18px 0 0;padding:4px 18px;font-family:inherit;font-weight:800;font-size:19px;cursor:pointer;background:#fff;color:#0f766e;box-shadow:inset 0 -4px 0 #0001}
nav button:hover{background:#f0fdfa}
nav button.active{background:var(--sun);color:#7c2d12;box-shadow:none}
main{flex:1;position:relative;min-height:0}
.panel{position:absolute;inset:0;overflow:auto;display:none;background:#fffdf6;border-top:6px solid var(--sun)}
.panel.active{display:block}
.stage{position:relative;min-height:100%;padding:16px 22px 40px 76px}
canvas.ink{position:absolute;left:0;top:0;pointer-events:none;z-index:60}
body.pen-on canvas.ink{pointer-events:auto;touch-action:none;cursor:crosshair}
body.pen-on .panel.active{box-shadow:inset 0 0 0 5px #fb7185}
#penMode{display:none;position:fixed;top:calc(var(--hdr) + var(--tabs) + 10px);left:50%;transform:translateX(-50%);background:#fb7185;color:#fff;font-weight:800;padding:2px 16px;border-radius:20px;z-index:300;font-size:16px;pointer-events:none}


/* pen toolbar */
#penbar{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:400;display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff;border-radius:22px;padding:5px;box-shadow:0 6px 18px #0003,0 0 0 3px #99f6e4;max-height:calc(100vh - 16px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#penbar .grip{cursor:move;font-size:14px;line-height:1;color:#94a3b8;touch-action:none;user-select:none}
#penToggle{width:44px;height:44px;border:none;border-radius:50%;font-size:22px;cursor:pointer;background:#e5e7eb;box-shadow:0 3px 0 #9ca3af;padding:0;flex:0 0 auto}
#penToggle.on{background:#fb7185;box-shadow:0 3px 0 #be123c}
#penTools{display:none;flex-direction:column;align-items:center;gap:5px}
#penTools .tb{min-width:38px;width:38px;height:38px;font-size:19px;padding:0}
#penTools .cols{display:grid;grid-template-columns:repeat(2,20px);gap:5px}
#penTools .sw{width:20px;height:20px;border-width:2px}
#penTools .sz{width:34px;height:30px}
#penTools .sep{width:30px;height:2px}
body.pen-on #penTools{display:flex}
.tb{font-family:inherit;border:none;background:#f1f5f9;border-radius:12px;min-width:42px;height:42px;font-size:21px;cursor:pointer;padding:0 8px}
.tb.sel{background:#fde68a;box-shadow:inset 0 0 0 3px #f59e0b}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cbd5e1;cursor:pointer}
.sw.sel{box-shadow:0 0 0 4px #0f766e}
.sz{width:38px;height:38px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.sz i{display:block;background:#1f2937;border-radius:50%}
.sz.sel{background:#fde68a;box-shadow:inset 0 0 0 3px #f59e0b}
.sep{width:2px;height:30px;background:#e2e8f0}

/* common */
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 #0000000f,0 0 0 3px #ccfbf1;padding:16px 20px}
.mascot{display:flex;align-items:flex-end;gap:12px;margin:4px 0 12px}
.char{flex:0 0 auto}
.char svg{width:105px;height:auto;display:block;animation:bob 2.6s ease-in-out infinite;transform-origin:bottom center}
.char.small svg{width:80px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.bubble{position:relative;background:#fff;border:4px solid #0f766e;border-radius:22px;padding:8px 16px;font-size:23px;font-weight:600;line-height:1.25;max-width:780px;margin-bottom:26px}
.bubble:before{content:"";position:absolute;left:-18px;bottom:10px;border:12px solid transparent;border-right:16px solid #0f766e}
.bubble:after{content:"";position:absolute;left:-10px;bottom:13px;border:9px solid transparent;border-right:12px solid #fff}
.bubble .say{margin-left:8px;border:none;background:#ccfbf1;border-radius:10px;cursor:pointer;font-size:18px;vertical-align:middle}
.hl{background:#fde68a;padding:0 6px;border-radius:8px}
.opt{font-family:inherit;font-size:30px;font-weight:800;padding:6px 28px;border-radius:20px;border:none;background:#fde68a;color:#78350f;box-shadow:0 6px 0 #d97706;cursor:pointer;min-width:100px;margin:6px;transition:transform .1s}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #d97706}
.opt.right{background:#86efac;color:#14532d;box-shadow:0 6px 0 #16a34a}
.opt.picked{background:#bfdbfe;box-shadow:0 6px 0 #2563eb;color:#1e3a8a}
.opt.small{font-size:22px;padding:6px 18px}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.btn{font-family:inherit;font-size:22px;font-weight:800;border:none;border-radius:18px;padding:6px 22px;cursor:pointer;background:#0f766e;color:#fff;box-shadow:0 5px 0 #0b4f49}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b4f49}
.btn.alt{background:#fb7185;box-shadow:0 5px 0 #be123c}
.btn.sun{background:#f59e0b;box-shadow:0 5px 0 #b45309}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.center{text-align:center}
.qtitle{font-size:30px;font-weight:800;color:#0f766e;margin:4px 0 10px}
.dots{display:flex;gap:7px;align-items:center}
.dots span{width:20px;height:20px;border-radius:50%;background:#e5e7eb;box-shadow:inset 0 -3px 0 #0001}
.dots span.done{background:#22c55e}
.dots span.cur{background:#fbbf24;transform:scale(1.25)}
.stars{font-size:26px;font-weight:800;color:#b45309;background:#fef3c7;border-radius:16px;padding:0 14px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.topbar .grow{flex:1}
.fb{font-size:26px;font-weight:800;min-height:40px;margin-top:6px}
.fb.good{color:#15803d}.fb.bad{color:#be123c}

/* tallies */
.tally{display:inline-flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;vertical-align:middle}
.tally svg{overflow:visible}
.tally svg.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1)}}

/* chart (book style) */
.chart{display:grid;grid-template-columns:repeat(3,1fr);max-width:860px;margin:0 auto}
.chart .col{border-left:5px solid var(--orange);text-align:center;padding:0 6px;position:relative}
.chart .col:first-child{border-left:none}
.chart .head{font-size:26px;font-weight:800;padding:2px 4px 6px;border-bottom:5px solid var(--orange)}
.chart .head .ic{display:block;height:64px;margin:0 auto}
.chart .head .ic svg{height:64px;width:64px}
.chart .head .emo{font-size:50px;line-height:64px}
.chart .head .swatch{display:inline-block;width:50px;height:50px;border-radius:50%;margin-top:6px;box-shadow:inset 0 -5px 0 #0002}
.chart .body{min-height:96px;padding:14px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.chart .num{font-size:30px;font-weight:800;color:#fff;background:#0f766e;border-radius:14px;padding:0 14px;display:none}
.shownums .chart .num{display:inline-block;animation:pop .4s}
.charttitle{text-align:center;font-size:28px;font-weight:800;margin-bottom:4px}
.bin{cursor:pointer;border-radius:0 0 16px 16px;transition:background .2s}
.bin.over{background:#fef3c7}
.bin .stack{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:60px}
.bin .stack svg{width:44px;height:44px;animation:pop .35s}

/* sorting tray */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:12px;min-height:110px;background:#f0fdfa;border:4px dashed #5eead4;border-radius:24px;margin-bottom:14px}
.item{width:74px;height:74px;cursor:grab;touch-action:none;transition:transform .15s,opacity .25s;user-select:none}
.item svg{width:100%;height:100%;pointer-events:none}
.item:hover{transform:scale(1.1)}
.item.sel{transform:scale(1.28);filter:drop-shadow(0 0 7px #f59e0b) drop-shadow(0 0 3px #f59e0b)}
.item.gone{transform:scale(0);opacity:0}
.ghost{position:fixed;pointer-events:none;z-index:999;width:86px;height:86px;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 8px 6px #0004)}
.ghost svg{width:100%;height:100%}

/* book */
.bookstage{padding:8px 12px 20px 70px;display:flex;flex-direction:column;align-items:center}
.booknav{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
.pg{font-family:inherit;font-weight:800;font-size:18px;border:none;border-radius:12px;padding:2px 14px;background:#e0f2f1;color:#0f766e;cursor:pointer}
.pg.sel{background:#0f766e;color:#fff}
.pagewrap{position:relative;display:none;line-height:0;box-shadow:0 8px 24px #0003;border-radius:8px;overflow:hidden;background:#fff}
.pagewrap.show{display:inline-block}
.pagewrap img{display:block;max-width:calc(100vw - 90px);max-height:calc(100vh - var(--hdr) - var(--tabs) - 66px);user-select:none;-webkit-user-drag:none}

/* learn */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps button{font-family:inherit;font-weight:800;font-size:16px;border:none;border-radius:14px;padding:2px 12px;background:#e0f2f1;color:#0f766e;cursor:pointer}
.steps button.sel{background:#0f766e;color:#fff}
.bundle{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;padding:8px 10px;border-radius:18px;transition:background .2s}
.bundle:hover{background:#fef3c7}
.bundle.lit{background:#bbf7d0}
.bundle .lab{font-size:34px;font-weight:800;color:#0f766e;min-height:46px}
.letters{display:flex;gap:6px;justify-content:center;font-size:76px;font-weight:800;letter-spacing:2px;margin:6px 0 14px}
.letters span{cursor:pointer;padding:0 6px;border-radius:14px;transition:transform .2s,opacity .3s;user-select:none}
.letters span:hover{background:#fef3c7}
.letters span.used{opacity:.25;transform:scale(.85)}
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.vcard{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 5px 0 #0000000f,0 0 0 3px #fde68a}
.vcard h3{margin:0;font-size:26px;color:#0f766e}
.vcard p{margin:4px 0 0;font-size:20px}
.bigcount{font-size:64px;font-weight:800;color:#0f766e;line-height:1}
.tallyboard{background:#fff;border-radius:24px;box-shadow:0 0 0 4px #bae6fd;padding:18px;min-height:120px;display:flex;align-items:center;justify-content:center}

/* finish */
.finish{text-align:center;padding:20px}
.finish .trophy{font-size:120px;animation:bob 2s infinite}
.finish h2{font-size:44px;color:#0f766e;margin:0}

/* whiteboard */
.wbwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.wbbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:#fff;border-bottom:3px solid #e2e8f0}
.wbbar select,.wbbar input[type=range]{font-family:inherit;font-size:17px}
.wbbar label{font-weight:700;font-size:16px;color:#475569}
.board{flex:1;position:relative;min-height:0;overflow:hidden}
.board canvas{position:absolute;left:0;top:0}
.board canvas.wbink{touch-action:none;cursor:crosshair}
.wbbar.items{background:#f0fdfa;border-bottom:3px solid #99f6e4}
.stk{font-size:30px;line-height:1;width:46px;height:46px;border:none;border-radius:12px;background:#fff;box-shadow:0 2px 0 #cbd5e1;cursor:pointer;padding:0}
.stk:hover{background:#fef3c7}
#stickers{position:absolute;inset:0;z-index:5;pointer-events:none}
.sticker{position:absolute;pointer-events:auto;cursor:grab;user-select:none;touch-action:none;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 2px #0003);transition:filter .15s}
.sticker.drag{cursor:grabbing;filter:drop-shadow(0 8px 6px #0005);z-index:2}
.sticker.bye{transition:transform .25s,opacity .25s;transform:translate(-50%,-50%) scale(0);opacity:0}
.wbtext{position:absolute;z-index:10;font-family:'Baloo 2','Comic Sans MS',sans-serif;font-weight:700;border:2px dashed #0f766e;background:#ffffffcc;outline:none;padding:0 4px;min-width:120px}

/* confetti */
.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:2000;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));}}
@media (max-width:900px){.htxt .ican{display:none}.sig{display:none}nav button{font-size:16px;padding:4px 12px}}
</style>
</head>
<body>
<header>
  <div class="badge">Lesson 6-1</div>
  <div class="htxt">
    <h1>Organize Data into Three Categories</h1>
    <div class="ican"><b>I can …</b> organize data into categories. &nbsp;•&nbsp; <b>I can also</b> model with math.</div>
  </div>
  <div class="hright">
    <span class="sig">✨ T.Rana Elsisi</span>
    <button class="iconbtn" id="sndBtn" title="Sound on/off">🔊</button>
  </div>
</header>
<nav id="tabs">
  <button data-tab="book" class="active">📖 Book Pages</button>
  <button data-tab="warm">🔥 Warm-Up</button>
  <button data-tab="learn">💡 Let's Learn</button>
  <button data-tab="g1">🧦 Game 1: Sort &amp; Tally</button>
  <button data-tab="g2">🔍 Game 2: Tally Detective</button>
  <button data-tab="wb">🧑‍🏫 Whiteboard</button>
</nav>
<main>
  <section class="panel active" id="p-book"><div class="stage bookstage">
    <div class="booknav" id="booknav"></div>
    <div id="pages"></div>
  </div></section>
  <section class="panel" id="p-warm"><div class="stage"><div id="warm"></div></div></section>
  <section class="panel" id="p-learn"><div class="stage"><div id="learn"></div></div></section>
  <section class="panel" id="p-g1"><div class="stage"><div id="g1"></div></div></section>
  <section class="panel" id="p-g2"><div class="stage"><div id="g2"></div></div></section>
  <section class="panel" id="p-wb"><div class="wbwrap">
    <div class="wbbar" id="wbbar"></div>
    <div class="wbbar items" id="wbitems"></div>
    <div class="board" id="board"><canvas id="wbbg"></canvas><canvas id="wbink" class="wbink"></canvas><div id="stickers"></div></div>
  </div></section>
</main>
<div id="penbar">
  <span class="grip" id="grip" title="Move">⠿</span>
  <button id="penToggle" title="Pen: OFF (tap to write)">✏️</button>
  <div id="penTools"></div>
</div>

<script>
"use strict";
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p):v+(255-v)*p)));return '#'+[n>>16,(n>>8)&255,n&255].map(f).map(x=>x.toString(16).padStart(2,'0')).join('')}
const C={blue:'#3b82f6',green:'#22c55e',orange:'#f97316',purple:'#a855f7',red:'#ef4444',yellow:'#facc15',teal:'#14b8a6',pink:'#ec4899',black:'#1f2937'};

/* ============ sounds ============ */
let soundOn=true, AC=null, NB=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}if(AC.state==='suspended')AC.resume();return AC}
function noise(){const a=ac();if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function tone(f,t0,dur,type='sine',vol=.18,f2){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.05)}
const sfx={
  pop(){if(!soundOn)return;try{const t=ac().currentTime;tone(660,t,.09,'sine',.15,990)}catch(e){}},
  ding(){if(!soundOn)return;try{const t=ac().currentTime;tone(880,t,.25,'triangle',.2);tone(1320,t+.1,.35,'triangle',.18)}catch(e){}},
  oops(){if(!soundOn)return;try{const t=ac().currentTime;tone(330,t,.18,'sine',.15,280);tone(262,t+.17,.28,'sine',.15,220)}catch(e){}},
  clap(n=8){if(!soundOn)return;try{const a=ac(),t0=a.currentTime;for(let i=0;i<n;i++){const t=t0+i*.12+Math.random()*.04;for(let k=0;k<3;k++){const s=a.createBufferSource();s.buffer=noise();const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100+Math.random()*900;bp.Q.value=.9;const g=a.createGain();const tt=t+k*.012;g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.9,tt+.003);g.gain.exponentialRampToValueAtTime(.0001,tt+.09);s.connect(bp).connect(g).connect(a.destination);s.start(tt,Math.random());s.stop(tt+.12)}}}catch(e){}},
  cheer(){if(!soundOn)return;try{const a=ac(),t=a.currentTime;const s=a.createBufferSource();s.buffer=noise();s.loop=true;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1300;bp.Q.value=.6;const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.35);g.gain.setValueAtTime(.35,t+1.1);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);s.connect(bp).connect(g).connect(a.destination);s.start(t);s.stop(t+2.3);
    [523,659,784,1047].forEach((f,i)=>tone(f,t+i*.11,.35,'triangle',.16));tone(1047,t+.5,.6,'triangle',.14);
    for(let i=0;i<4;i++)tone(500+Math.random()*300,t+.2+i*.25,.4,'sawtooth',.03,900+Math.random()*300);
    this.clap(12)}catch(e){}}
};
function speak(text){if(!soundOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,''));u.lang='en-US';u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u)}
$('#sndBtn').onclick=()=>{soundOn=!soundOn;$('#sndBtn').textContent=soundOn?'🔊':'🔇';if(!soundOn&&window.speechSynthesis)speechSynthesis.cancel()};
function confetti(n=70){const cols=['#f43f5e','#f59e0b','#22c55e','#3b82f6','#a855f7','#14b8a6','#facc15'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.setProperty('--dx',(Math.random()*240-120)+'px');d.style.setProperty('--rot',(Math.random()*900-450)+'deg');d.style.animationDuration=(1.6+Math.random()*1.4)+'s';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
function shakeEl(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

  const S=b=>`<svg viewBox="0 0 60 60" ${extra}>${b}</svg>`;
  switch(kind){
    case 'sock':return S(`<path d="M24 5h17v31c0 6-3 10-9 13l-12 6c-6 3-12 1-13-4-1-5 2-8 7-10l10-5z" fill="${c}" stroke="${d}" stroke-width="2.5" stroke-linejoin="round"/><rect x="24" y="5" width="17" height="9" fill="${d}" opacity=".45"/><path d="M24 17h17M24 21h17" stroke="${l}" stroke-width="2"/><path d="M9 48c3 4 8 4 11 2" stroke="${d}" stroke-width="2" fill="none" opacity=".6"/>`);

    case 'crayon':return S(`<g transform="rotate(-20 30 30)"><rect x="6" y="23" width="38" height="14" rx="3" fill="${c}" stroke="${d}" stroke-width="2"/><polygon points="44,23 56,30 44,37" fill="${d}"/><rect x="12" y="23" width="4" height="14" fill="${d}" opacity=".5"/><rect x="36" y="23" width="4" height="14" fill="${d}" opacity=".5"/><rect x="18" y="26" width="16" height="3" rx="1.5" fill="#fff" opacity=".6"/></g>`);
    case 'apple':return S(`<path d="M30 19c-6-5-21-4-22 10-1 13 9 26 16 26 3 0 4-2 6-2s3 2 6 2c7 0 17-13 16-26-1-14-16-15-22-10z" fill="${c}" stroke="${d}" stroke-width="2.5"/><path d="M30 19c0-5 2-9 5-12" stroke="#7c4a1e" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M33 13c5-6 13-5 15-3-3 6-10 7-15 3z" fill="#16a34a"/><ellipse cx="19" cy="30" rx="4" ry="7" fill="#fff" opacity=".45"/>`);
    case 'fish':return S(`<polygon points="42,30 57,17 55,30 57,43" fill="${d}"/><ellipse cx="27" cy="30" rx="20" ry="14" fill="${c}" stroke="${d}" stroke-width="2.5"/><path d="M27 17q6 6 0 26" stroke="${d}" stroke-width="2" fill="none" opacity=".5"/><circle cx="16" cy="27" r="4.5" fill="#fff"/><circle cx="15" cy="27" r="2.3" fill="#111"/><path d="M9 34q4 3 7 0" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round"/>`);

/* tally marks */
function tally(n,{h=46,color='#1f2937',w=3.6,popLast=false}={}){
  if(!n)return '<span class="tally" style="min-height:'+h+'px"></span>';
  const gap=10,g=Math.floor(n/5),r=n%5;
  const one=(k,full,pop)=>{const W=12+(k-1)*gap;let s=`<svg class="${pop?'pop':''}" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}">`;
    for(let i=0;i<k;i++){const x=6+i*gap;s+=`<line x1="${x}" y1="3" x2="${x+(i%2?1:-1)}" y2="${h-3}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`}
    if(full)s+=`<line x1="-1" y1="${h-9}" x2="${W+1}" y2="9" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
    return s+'</svg>'};
  let out='';for(let i=0;i<g;i++)out+=one(4,true,popLast&&!r&&i===g-1);if(r)out+=one(r,false,popLast);
  return `<span class="tally">${out}</span>`;
}

/* ============ drawing engine ============ */
class Sketch{
  constructor(canvas,o){this.c=canvas;this.ctx=canvas.getContext('2d');this.o=o;this.strokes=[];this.redoS=[];this.cur=null;this.w=1;this.h=1;this.norm=!!o.norm;this.bind()}
  size(w,h){if(!w||!h)return;const d=window.devicePixelRatio||1;this.w=w;this.h=h;this.c.width=Math.round(w*d);this.c.height=Math.round(h*d);this.c.style.width=w+'px';this.c.style.height=h+'px';this.ctx.setTransform(d,0,0,d,0,0);this.redraw()}
  pos(e){const r=this.c.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;return this.norm?[x/r.width,y/r.height]:[x,y]}
  P(p){return this.norm?[p[0]*this.w,p[1]*this.h]:p}
  bind(){
    let raf=0;const req=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;this.redraw()})};
    this.c.addEventListener('pointerdown',e=>{if(!this.o.enabled())return;e.preventDefault();const s=this.o.settings();const p=this.pos(e);
      if(s.tool==='text'){this.o.onText&&this.o.onText(p);return}
      if(s.tool==='tally'){this.tallyClick(p,s);return}
      try{this.c.setPointerCapture(e.pointerId)}catch(_){}
      this.cur={tool:s.tool,color:s.color,size:s.size,pts:[p,p]};req()});
    this.c.addEventListener('pointermove',e=>{if(!this.cur)return;const p=this.pos(e);
      if(['pen','hl','eraser'].includes(this.cur.tool))this.cur.pts.push(p);else this.cur.pts[1]=p;req()});
    const end=()=>{if(!this.cur)return;this.strokes.push(this.cur);this.redoS=[];this.cur=null;req()};
    this.c.addEventListener('pointerup',end);this.c.addEventListener('pointercancel',end);
  }
  add(s){this.strokes.push(s);this.redoS=[];this.redraw()}
  tGeom(s){const h=24+s.size*3,gap=h*.26,gw=3*gap+gap*2.4;const g=Math.floor(s.n/5),r=s.n%5;const w=g*gw+(r?(r-1)*gap:0);return {h,gap,gw,w}}
  tallyClick(p,set){const pp=this.P(p);
    for(let i=this.strokes.length-1;i>=0;i--){const t=this.strokes[i];if(t.tool!=='tally')continue;const a=this.P(t.pts[0]),G=this.tGeom(t);
      if(pp[0]>a[0]-25&&pp[0]<a[0]+G.w+G.gw+20&&pp[1]>a[1]-G.h/2-18&&pp[1]<a[1]+G.h/2+18){t.n++;this.redoS=[];this.strokes.splice(i,1);this.strokes.push(t);this.redraw();sfx.pop();return}}
    this.add({tool:'tally',color:set.color,size:set.size,pts:[p],n:1});sfx.pop()}
  draw(s){const x=this.ctx;x.save();x.lineCap='round';x.lineJoin='round';
    const pts=s.pts.map(p=>this.P(p));
    if(s.tool==='eraser'){x.globalCompositeOperation='destination-out';x.strokeStyle='#000';x.lineWidth=s.size*4+6}
    else if(s.tool==='hl'){x.globalAlpha=.35;x.strokeStyle=s.color;x.lineWidth=s.size*4+6}
    else{x.strokeStyle=s.color;x.fillStyle=s.color;x.lineWidth=s.size}
    if(['pen','hl','eraser'].includes(s.tool)){
      x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
      if(pts.length<3){x.lineTo(pts[pts.length-1][0]+.1,pts[pts.length-1][1]+.1)}
      else{for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;x.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}x.lineTo(pts[pts.length-1][0],pts[pts.length-1][1])}
      x.stroke();
    }else if(s.tool==='tally'){const G=this.tGeom(s),[x0,yc]=pts[0],top=yc-G.h/2,bot=yc+G.h/2;x.lineWidth=Math.max(3,s.size*.8);
      for(let k=0;k<s.n;k++){const g=Math.floor(k/5),j=k%5,gx=x0+g*G.gw;x.beginPath();
        if(j<4){const xx=gx+j*G.gap;x.moveTo(xx,top);x.lineTo(xx+(j%2?1.5:-1.5),bot)}else{x.moveTo(gx-G.gap*.6,bot-G.h*.18);x.lineTo(gx+3*G.gap+G.gap*.6,top+G.h*.18)}x.stroke()}
    }else if(s.tool==='text'){x.font=`700 ${s.size*5+12}px 'Baloo 2','Comic Sans MS',sans-serif`;x.textBaseline='top';s.text.split('\n').forEach((ln,i)=>x.fillText(ln,pts[0][0],pts[0][1]+i*(s.size*5+16)))}
    else{const [a,b]=[pts[0],pts[pts.length-1]];x.beginPath();
      if(s.tool==='line'||s.tool==='arrow'){x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();
        if(s.tool==='arrow'){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=12+s.size*2;x.beginPath();x.moveTo(b[0],b[1]);x.lineTo(b[0]-L*Math.cos(ang-.45),b[1]-L*Math.sin(ang-.45));x.moveTo(b[0],b[1]);x.lineTo(b[0]-L*Math.cos(ang+.45),b[1]-L*Math.sin(ang+.45));x.stroke()}}
      else if(s.tool==='rect'){x.strokeRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))}
      else if(s.tool==='circle'){x.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2+.1,Math.abs(b[1]-a[1])/2+.1,0,0,Math.PI*2);x.stroke()}}
    x.restore()}
  redraw(){this.ctx.clearRect(0,0,this.w,this.h);this.strokes.forEach(s=>this.draw(s));if(this.cur)this.draw(this.cur)}
  undo(){const L=this.strokes[this.strokes.length-1];if(L&&L.tool==='tally'&&L.n>1){L.n--;this.redoS.push({inc:L});this.redraw();return}
    if(this.strokes.length){this.redoS.push(this.strokes.pop());this.redraw()}else if(this.cleared){this.strokes=this.cleared;this.cleared=null;this.redraw()}}
  redo(){if(this.redoS.length){const r=this.redoS.pop();if(r.inc)r.inc.n++;else this.strokes.push(r);this.redraw()}}
  clear(){if(this.strokes.length){this.cleared=this.strokes;this.strokes=[];this.redoS=[];this.redraw()}}
}

/* ============ sorter (drag or tap-tap) ============ */
function makeSorter(tray,bins,{onPlace,onWrong}){
  let sel=null;
  const binAt=(x,y)=>{const el=document.elementFromPoint(x,y);const b=el&&el.closest('.bin');return b&&bins.includes(b)?b:null};
  const clearOver=()=>bins.forEach(b=>b.classList.remove('over'));
  function drop(it,b){
    if(it.dataset.cat===b.dataset.cat){sel=null;it.classList.remove('sel');it.classList.add('gone');it.style.pointerEvents='none';setTimeout(()=>it.remove(),260);onPlace(it,b)}
    else{if(sel)sel.classList.remove('sel');sel=null;shakeEl(b);sfx.oops();onWrong&&onWrong(it,b)}}
  $$('.item',tray).forEach(it=>{
    it.addEventListener('pointerdown',e=>{e.preventDefault();const sx=e.clientX,sy=e.clientY;let ghost=null;try{it.setPointerCapture(e.pointerId)}catch(_){}
      const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=it.innerHTML;document.body.appendChild(ghost);it.style.opacity=.3}
        if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const b=binAt(ev.clientX,ev.clientY);bins.forEach(x=>x.classList.toggle('over',x===b))}};
      const up=ev=>{it.removeEventListener('pointermove',mv);it.removeEventListener('pointerup',up);it.removeEventListener('pointercancel',up);
        if(ghost){ghost.remove();it.style.opacity='';clearOver();const b=binAt(ev.clientX,ev.clientY);if(b)drop(it,b)}
        else{if(sel===it){it.classList.remove('sel');sel=null}else{if(sel)sel.classList.remove('sel');sel=it;it.classList.add('sel');sfx.pop()}}};
      it.addEventListener('pointermove',mv);it.addEventListener('pointerup',up);it.addEventListener('pointercancel',up)});
  });
  bins.forEach(b=>b.addEventListener('click',()=>{if(sel&&!sel.classList.contains('gone'))drop(sel,b)}));
}

    sfx.cheer();confetti();$('#wAgain').onclick=()=>{warm.i=0;warm.stars=0;renderWarm()};$('#wLearn').onclick=()=>$('[data-tab=learn]').click();return}
  const q=WARM[warm.i];let tried=false;
  el.innerHTML=`<div class="topbar"><div class="dots">${WARM.map((_,k)=>`<span class="${k<warm.i?'done':k===warm.i?'cur':''}"></span>`).join('')}</div><div class="grow"></div><div class="stars">⭐ ${warm.stars}</div></div>

  <div class="card center"><div class="qtitle">${q.q}</div>${q.pic()}

/* ============ LET'S LEARN ============ */
const learn={s:0};
const STEP_NAMES=['1 Solve & Share','2 Tally Marks','3 Count by 5s','4 Make a Tally Chart','5 Words to Know'];
function renderLearn(){const el=$('#learn');
  el.innerHTML=`<div class="topbar"><div class="steps">${STEP_NAMES.map((n,i)=>`<button class="${i===learn.s?'sel':''}" data-s="${i}">${n}</button>`).join('')}</div><div class="grow"></div>
  <button class="btn alt" id="lBack" ${learn.s?'':'disabled'}>◀ Back</button><button class="btn" id="lNext" ${learn.s<4?'':'disabled'}>Next ▶</button></div><div id="lbody"></div>`;
  $$('.steps button',el).forEach(b=>b.onclick=()=>{learn.s=+b.dataset.s;renderLearn()});
  $('#lBack').onclick=()=>{learn.s--;renderLearn()};$('#lNext').onclick=()=>{learn.s++;renderLearn()};
  [stepCrayons,stepTally,stepFives,stepLetters,stepWords][learn.s]($('#lbody'));
}
/* step 1 */
function stepCrayons(el){
  const cats=[['green','Green',C.teal],['yellow','Yellow',C.yellow],['blue','Blue','#2563eb']];
  const items=shuffle([...Array(4).fill(0)],).map(()=>'green').concat(['yellow','yellow','blue']);
  el.innerHTML=mascot(BUNNY,'Judy wants to show a friend how many crayons she has of each color. <b>Drag</b> each crayon (or tap it, then tap a box) to sort them!')+
  `<div class="tray" id="ctray">${shuffle(items).map(c=>`<div class="item" data-cat="${c}" style="transform:rotate(${Math.random()*50-25}deg)">${obj('crayon',cats.find(x=>x[0]===c)[2])}</div>`).join('')}</div>
  <div class="card"><div class="chart">${cats.map(([k,n,col])=>`<div class="col bin" data-cat="${k}"><div class="head"><span class="ic">${obj('crayon',col)}</span>${n}</div><div class="body"><div class="stack"></div><div class="tl"></div><span class="num">0</span></div></div>`).join('')}</div></div>
  <div class="center" id="cdone" style="margin-top:12px"></div>`;
  const bins=$$('.bin',el);const cnt={green:0,yellow:0,blue:0};
  makeSorter($('#ctray',el),bins,{onPlace:(it,b)=>{const k=b.dataset.cat;cnt[k]++;$('.stack',b).insertAdjacentHTML('beforeend',obj('crayon',cats.find(x=>x[0]===k)[2]));$('.num',b).textContent=cnt[k];sfx.pop();
    if(cnt.green+cnt.yellow+cnt.blue===7){setTimeout(()=>{sfx.ding();sfx.clap();confetti(40);el.classList.add('shownums');
      $('.msg',el).innerHTML='Wonderful! We sorted the crayons into <span class="hl">3 groups</span>. Each group is called a <span class="hl">category</span>. Now it is easy to see: 4 green, 2 yellow, 1 blue!';
      $('#cdone',el).innerHTML=`<button class="btn sun" id="toTally">✨ Show it with tally marks!</button>`;
      $('#toTally').onclick=()=>{bins.forEach(b=>{$('.stack',b).style.display='none';$('.tl',b).innerHTML=tally(cnt[b.dataset.cat],{popLast:true})});sfx.ding();
        $('.msg',el).innerHTML='Instead of drawing every crayon, we can make <span class="hl">tally marks</span>. One tally mark for each crayon! Tap <b>Next ▶</b> to learn more.';$('#cdone',el).innerHTML=''}},300)}},
    onWrong:()=>{$('.msg',el).innerHTML='Oops! Look at the <b>color</b> of the crayon and find the box with the same color. 🖍️'}});
}
/* step 2 */
function stepTally(el){let n=0;
  el.innerHTML=mascot(OWL,'These are <span class="hl">tally marks</span>. Each tally mark stands for <b>1</b> piece of information. Tap <b>+1 Tally</b>!')+
  `<div class="card center"><div class="tallyboard" id="tb"></div>
   <div class="row" style="justify-content:center;margin-top:14px"><div class="bigcount" id="tn">0</div>
   <button class="btn sun" id="tplus" style="font-size:30px">➕ 1 Tally</button><button class="btn alt" id="treset">↺ Start over</button></div></div>`;
  const draw=()=>{$('#tb',el).innerHTML=tally(n,{h:90,w:6,popLast:true});$('#tn',el).textContent=n;
    const m=$('.msg',el);
    if(n===4)m.innerHTML='4 tally marks: | | | |  Now watch the next one carefully… 👀';
    else if(n===5){m.innerHTML='The <span class="hl">5th</span> tally mark goes <b>across</b> the other 4! This bundle stands for <b>5</b>.';sfx.ding();sfx.clap(5)}
    else if(n===10){m.innerHTML='Two bundles! 5, 10. There are <b>10</b> tally marks. 🎉';sfx.ding()}
    else if(n>0&&n%5===0){m.innerHTML=`Another bundle! Count by 5s: ${Array.from({length:n/5},(_,i)=>(i+1)*5).join(', ')}.`;sfx.ding()}
    else if(n>0)m.innerHTML=`${n} tally mark${n>1?'s':''}. Each one stands for 1.`;};
  draw();$('#tplus',el).onclick=()=>{if(n<20){n++;sfx.pop();draw()}};$('#treset',el).onclick=()=>{n=0;draw();$('.msg',el).innerHTML='Let’s start again! Tap <b>+1 Tally</b>.'};
}
/* step 3 */
function stepFives(el){let k=0;
  el.innerHTML=mascot(BUNNY,'Count the tally marks by <span class="hl">5s</span>! Tap each bundle to count.')+
  `<div class="card center"><div class="row" style="justify-content:center;gap:20px">${[1,2,3,4].map(i=>`<div class="bundle" data-i="${i}">${tally(5,{h:96,w:6})}<div class="lab"></div></div>`).join('')}</div>
  <div class="fb good" id="ffb"></div><button class="btn alt" id="fr">↺ Count again</button></div>`;
  $$('.bundle',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i!==k+1){shakeEl($$('.bundle',el)[k]);return}k=i;b.classList.add('lit');$('.lab',b).textContent=k*5;speak(String(k*5));sfx.pop();
    if(k===4){$('#ffb',el).textContent='5, 10, 15, 20 — there are 20 tally marks! 🎉';$('.msg',el).innerHTML='There are <b>20</b>. Each bundle stands for <b>5</b> pieces of information.';sfx.ding();sfx.clap();confetti(40)}});
  $('#fr',el).onclick=()=>stepFives(el);
}
/* step 4 */
function stepLetters(el){
  const word=[['m','black'],['a','red'],['t','black'],['h','black'],['e','blue'],['m','black'],['a','red'],['t','black'],['i','blue'],['c','red'],['s','black']];
  const col={black:'#1f2937',red:'#ef4444',blue:'#2563eb'};const cnt={black:0,red:0,blue:0};let left=word.length;
  el.innerHTML=mascot(OWL,'Let’s collect <span class="hl">data</span>! Tap each letter. A tally mark goes in the chart under its color.')+
  `<div class="card"><div class="letters">${word.map(([ch,c],i)=>`<span data-c="${c}" style="color:${col[c]}">${ch}</span>`).join('')}</div>
   <div class="charttitle">Letter Colors</div>
   <div class="chart">${['black','red','blue'].map(c=>`<div class="col" data-c="${c}"><div class="head"><span class="swatch" style="background:${col[c]}"></span><br>${c[0].toUpperCase()+c.slice(1)}</div><div class="body"><div class="tl">${tally(0)}</div><span class="num"></span></div></div>`).join('')}</div>
   <div class="center" id="lq" style="margin-top:10px"></div></div>`;
  $$('.letters span',el).forEach(s=>s.onclick=()=>{if(s.classList.contains('used'))return;s.classList.add('used');const c=s.dataset.c;cnt[c]++;left--;sfx.pop();
    const colEl=$(`.col[data-c="${c}"]`,el);$('.tl',colEl).innerHTML=tally(cnt[c],{popLast:true});$('.num',colEl).textContent=cnt[c];
    if(!left){$('.msg',el).innerHTML='We put the data in a <span class="hl">tally chart</span>! Now answer the question. 👇';
      $('#lq',el).innerHTML=`<div class="qtitle">Which color has the MOST letters?</div>${['Black','Red','Blue'].map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}<div class="fb" id="lfb"></div>`;
      $$('#lq .opt',el).forEach(b=>b.onclick=()=>{if(b.dataset.o==='Black'){b.classList.add('right');el.classList.add('shownums');$('#lfb',el).className='fb good';$('#lfb',el).textContent='Yes! 6 black letters, 3 red, 2 blue. 🎉';sfx.cheer();confetti()}else{shakeEl(b);sfx.oops();$('#lfb',el).className='fb bad';$('#lfb',el).textContent='Count the tally marks again! 🔍'}})}});
}
/* step 5 */
function stepWords(el){
  el.innerHTML=mascot(BUNNY,'Words to know! Tap 🔊 to hear me read.')+
  `<div class="vocab">
   <div class="vcard"><h3>📋 Data</h3><p>Information we collect, like how many socks of each color.</p></div>
   <div class="vcard"><h3>🗂️ Category</h3><p>A group of things that are alike. (Green, Orange, Blue)</p></div>
   <div class="vcard"><h3>✏️ Tally mark</h3><p>${tally(1,{h:34})} stands for <b>1</b>.<br>${tally(5,{h:34})} stands for <b>5</b>.</p></div>
   <div class="vcard"><h3>📊 Tally chart</h3><p>A chart that uses tally marks to show data.</p></div></div>
   <div class="card" style="margin-top:16px"><div class="qtitle">💬 Convince Me! How can a tally chart help you with data you collect?</div>
   <button class="btn sun" id="cm">💡 Show an idea</button><div id="cmA" class="fb good"></div></div>`;

renderLearn();

/* ============ GAME 2: TALLY DETECTIVE ============ */
const closet={title:"Saul's Closet",cats:[['👕','Shirts',7],['🩳','Shorts',4],['👟','Shoes',2]]};
const fruit={title:'Favorite Fruit',cats:[['🍎','Apple',6],['🍌','Banana',3],['🍇','Grapes',8]]};
const G2=[
  {...closet,q:'How many shorts does Saul have?',opts:['2','4','7'],ans:'4'},
  {...closet,q:'Which item does Saul have the MOST of?',opts:['Shirts','Shorts','Shoes'],ans:'Shirts'},
  {title:'Number of Months (until the shoe wore out)',cats:[['👟','Sneakers',4],['🩴','Sandals',2],['👞','Loafers',5]],q:'Which type of shoe lasted the LONGEST?',opts:['Sneakers','Sandals','Loafers'],ans:'Loafers'},
  {...fruit,q:'How many children chose banana?',opts:['3','6','8'],ans:'3'},
  {...fruit,q:'Which fruit got the FEWEST votes?',opts:['Apple','Banana','Grapes'],ans:'Banana'},
  {title:'Our Pets',cats:[['🐶','Dogs',5],['🐱','Cats',9],['🐟','Fish',2]],q:'How many pets are there in all?',opts:['14','16','18'],ans:'16'},
  {title:'Weather This Month',cats:[['☀️','Sunny',10],['🌧️','Rainy',3],['☁️','Cloudy',6]],q:'How many sunny days? Count by 5s!',opts:['5','10','15'],ans:'10'},
  {title:'Favorite Toy',cats:[['⚽','Ball',7],['🚗','Car',7],['🧸','Teddy',4]],q:'Which two toys got the SAME number of votes?',opts:['Ball and Car','Car and Teddy','Ball and Teddy'],ans:'Ball and Car'},
  {title:'Caps',svg:'cap',cats:[['blue','Blue',12],['green','Green',5],['purple','Purple',3]],q:'Which TWO sentences are true? Pick 2, then press Check.',multi:true,opts:['There are 12 blue caps.','There are 7 green caps.','There are 3 purple caps.','There are 12 caps in all.'],ans:['There are 12 blue caps.','There are 3 purple caps.']},
  {title:'Favorite Color',swatch:true,cats:[['red','Red',5],['blue','Blue',9],['yellow','Yellow',6]],q:'Which color has 6 tally marks?',opts:['Red','Blue','Yellow'],ans:'Yellow'}
];
const g2={i:0,stars:0};
function icon(Q,c){if(Q.svg)return `<span class="ic">${obj(Q.svg,C[c[0]])}</span>`;if(Q.swatch)return `<span class="swatch" style="background:${C[c[0]]}"></span><br>`;return `<span class="emo">${c[0]}</span><br>`}
function renderG2(){const el=$('#g2');el.classList.remove('shownums');
  if(g2.i>=G2.length){el.innerHTML=`<div class="finish card"><div class="trophy">🕵️</div><h2>Top Tally Detective!</h2><p style="font-size:28px">You solved all ${G2.length} cases and earned <b>${g2.stars}</b> ⭐</p><button class="btn" id="g2a">🔄 Play again</button></div>`;sfx.cheer();confetti(120);$('#g2a').onclick=()=>{g2.i=0;g2.stars=0;renderG2()};return}
  const Q=G2[g2.i];let tried=false,done=false;const picked=new Set();
  el.innerHTML=`<div class="topbar"><div class="dots">${G2.map((_,k)=>`<span class="${k<g2.i?'done':k===g2.i?'cur':''}"></span>`).join('')}</div><b style="font-size:22px">Case ${g2.i+1} of ${G2.length}</b><div class="grow"></div><div class="stars">⭐ ${g2.stars}</div></div>
  ${mascot(BUNNY,'Detective, read the tally chart and solve the case! 🔍',true)}
  <div class="card"><div class="charttitle">${Q.title}</div><div class="chart">${Q.cats.map(c=>`<div class="col"><div class="head">${icon(Q,c)}${c[1]}</div><div class="body">${tally(c[2])}<span class="num">${c[2]}</span></div></div>`).join('')}</div>
  <div class="center" style="margin-top:8px"><div class="qtitle">${Q.q}</div>
  <div ${Q.multi?'style="display:flex;flex-direction:column;align-items:center"':''}>${Q.opts.map(o=>`<button class="opt ${Q.multi?'small':''}" data-o="${o}">${Q.multi?'☐ ':''}${o}</button>`).join('')}</div>
  ${Q.multi?'<button class="btn sun" id="chk" style="margin-top:6px">✔ Check</button>':''}
  <div class="fb" id="g2fb"></div><div id="g2n"></div></div></div>`;
  const win=()=>{done=true;if(!tried)g2.stars++;$('.stars',el).textContent='⭐ '+g2.stars;el.classList.add('shownums');$('#g2fb',el).className='fb good';$('#g2fb',el).textContent=['Case solved! 🕵️‍♀️','Brilliant detective! 🌟','You cracked it! 🎉'][Math.random()*3|0];sfx.cheer();confetti();
    $('#g2n',el).innerHTML=`<button class="btn">Next case ➜</button>`;$('#g2n button',el).onclick=()=>{g2.i++;renderG2()}};
  const miss=(b,msg)=>{tried=true;if(b)shakeEl(b);sfx.oops();$('#g2fb',el).className='fb bad';$('#g2fb',el).textContent=msg};
  $$('.opt',el).forEach(b=>b.onclick=()=>{if(done)return;const o=b.dataset.o;
    if(Q.multi){if(picked.has(o)){picked.delete(o);b.classList.remove('picked');b.textContent='☐ '+o}else{if(picked.size>=2){miss(b,'Pick only 2 sentences!');return}picked.add(o);b.classList.add('picked');b.textContent='☑ '+o}sfx.pop();return}
    if(o===Q.ans){b.classList.add('right');win()}else miss(b,'Look again! Count the tally marks carefully. 🔍')});
  if(Q.multi)$('#chk',el).onclick=()=>{if(done)return;if(picked.size!==2){miss($('#chk',el),'Pick 2 sentences first!');return}
    if(Q.ans.every(a=>picked.has(a))){$$('.opt',el).forEach(b=>{if(picked.has(b.dataset.o))b.classList.add('right')});win()}else miss($('#chk',el),'Not quite! Count each color again. 🔍')};
}
renderG2();

/* ============ WHITEBOARD ============ */
const wb={tool:'pen',color:'#111827',size:5,bg:'grid',bgc:'#ffffff'};
const wbInk=$('#wbink'),wbBg=$('#wbbg'),board=$('#board');
const wbSk=new Sketch(wbInk,{settings:()=>wb,enabled:()=>true,onText:p=>{
  const inp=document.createElement('input');inp.className='wbtext';inp.style.left=p[0]+'px';inp.style.top=(p[1]-4)+'px';inp.style.fontSize=(wb.size*5+12)+'px';inp.style.color=wb.color;board.appendChild(inp);setTimeout(()=>inp.focus(),0);
  const commit=()=>{if(!inp.isConnected)return;const v=inp.value.trim();inp.remove();if(v)wbSk.add({tool:'text',color:wb.color,size:wb.size,pts:[[p[0]+5,p[1]]],text:v})};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){inp.value='';commit()}});inp.addEventListener('blur',commit)}});
function drawBg(){const w=board.clientWidth,h=board.clientHeight;if(!w)return;const d=window.devicePixelRatio||1;wbBg.width=w*d;wbBg.height=h*d;wbBg.style.width=w+'px';wbBg.style.height=h+'px';const x=wbBg.getContext('2d');x.setTransform(d,0,0,d,0,0);
  x.fillStyle=wb.bgc;x.fillRect(0,0,w,h);x.lineWidth=1;
  if(wb.bg==='grid'){x.strokeStyle='#cbd5e1';for(let i=0;i<w;i+=40){x.beginPath();x.moveTo(i+.5,0);x.lineTo(i+.5,h);x.stroke()}for(let j=0;j<h;j+=40){x.beginPath();x.moveTo(0,j+.5);x.lineTo(w,j+.5);x.stroke()}}
  if(wb.bg==='lines'){x.strokeStyle='#93c5fd';for(let j=70;j<h;j+=56){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke();x.setLineDash([6,6]);x.strokeStyle='#bfdbfe';x.beginPath();x.moveTo(0,j-28);x.lineTo(w,j-28);x.stroke();x.setLineDash([]);x.strokeStyle='#93c5fd'}x.strokeStyle='#fca5a5';x.lineWidth=2;x.beginPath();x.moveTo(70,0);x.lineTo(70,h);x.stroke()}
  if(wb.bg==='dots'){x.fillStyle='#94a3b8';for(let i=20;i<w;i+=40)for(let j=20;j<h;j+=40){x.beginPath();x.arc(i,j,2,0,7);x.fill()}}
  if(wb.bg==='tally'){const L=Math.max(40,w*.08),R=w-L,top=Math.max(70,h*.18),head=top+Math.min(140,h*.28),bottom=Math.min(h-30,head+Math.max(160,h*.38));
    x.strokeStyle='#fb923c';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(L,head);x.lineTo(R,head);x.stroke();
    const cw=(R-L)/3;for(let k=1;k<3;k++){x.beginPath();x.moveTo(L+cw*k,top);x.lineTo(L+cw*k,bottom);x.stroke()}
    x.fillStyle='#cbd5e1';x.font="700 22px 'Baloo 2',sans-serif";x.textAlign='center';x.fillText('Title: ________________',w/2,top-22);}
}
function wbResize(){const w=board.clientWidth,h=board.clientHeight;if(!w)return;drawBg();wbSk.size(w,h)}
new ResizeObserver(wbResize).observe(board);
(()=>{const bar=$('#wbbar');const tools=[['pen','✏️ Pen'],['hl','🖍️ Highlighter'],['eraser','🧽 Eraser'],['tally',TALLY_ICON+' Tally'],['line','📏 Line'],['arrow','➡️ Arrow'],['rect','⬜ Box'],['circle','⭕ Circle'],['text','🔤 Text']];
  const cols=['#111827','#ef4444','#f97316','#eab308','#16a34a','#2563eb','#7c3aed','#ec4899'];
  bar.innerHTML=tools.map(([k,n],i)=>`<button class="tb ${i?'':'sel'}" data-wt="${k}" style="font-size:16px">${n}</button>`).join('')+`<div class="sep"></div>`+
   cols.map((c,i)=>`<span class="sw ${i?'':'sel'}" data-wc="${c}" style="background:${c}"></span>`).join('')+`<input type="color" id="wcPick" value="#0f766e" title="More colors" style="width:36px;height:34px;border:none;background:none">`+
   `<div class="sep"></div><label>Size <input type="range" id="wSize" min="2" max="20" value="5"></label><div class="sep"></div>
   <label>Page <select id="wBg"><option value="grid">Grid</option><option value="lines">Lines</option><option value="dots">Dots</option><option value="plain">Plain</option><option value="tally">Tally chart</option></select></label>
   <label>Color <select id="wBgc"><option value="#ffffff">White</option><option value="#fefce8">Cream</option><option value="#f0fdf4">Mint</option><option value="#1e3a2f">Chalkboard</option></select></label>
   <span style="font-size:14px;color:#64748b">Tally: tap to add a mark • tap the same tally to add more</span>
   <div class="sep"></div><button class="tb" id="wU" title="Undo">↶</button><button class="tb" id="wR" title="Redo">↷</button><button class="tb" id="wC" title="Clear">🗑️</button>`;
  $$('[data-wt]',bar).forEach(b=>b.onclick=()=>{wb.tool=b.dataset.wt;$$('[data-wt]',bar).forEach(x=>x.classList.toggle('sel',x===b));wbInk.style.cursor=wb.tool==='text'?'text':wb.tool==='tally'?'cell':'crosshair'});
  const setCol=c=>{wb.color=c;if(wb.tool==='eraser'){wb.tool='pen';$$('[data-wt]',bar).forEach(x=>x.classList.toggle('sel',x.dataset.wt==='pen'))}};
  $$('[data-wc]',bar).forEach(b=>b.onclick=()=>{setCol(b.dataset.wc);$$('[data-wc]',bar).forEach(x=>x.classList.toggle('sel',x===b))});
  $('#wcPick').oninput=e=>{setCol(e.target.value);$$('[data-wc]',bar).forEach(x=>x.classList.remove('sel'))};
  $('#wSize').oninput=e=>wb.size=+e.target.value;
  $('#wBg').onchange=e=>{wb.bg=e.target.value;drawBg()};
  $('#wBgc').onchange=e=>{wb.bgc=e.target.value;if(wb.bgc==='#1e3a2f'&&wb.color==='#111827'){wb.color='#ffffff'}drawBg()};
  $('#wU').onclick=()=>wbSk.undo();$('#wR').onclick=()=>wbSk.redo();$('#wC').onclick=()=>wbSk.clear();
})();

/* whiteboard items to classify */
(()=>{const bar=$('#wbitems'),layer=$('#stickers');
  const FRUITS=['🍎','🍌','🍇'],ANIMALS=['🐱','🐶','🐟'];let big=56;
  bar.innerHTML=`<label>🧺 Items to sort:</label> <b style="color:#0f766e">Fruits</b> ${FRUITS.map(e=>`<button class="stk" data-e="${e}" title="Add one">${e}</button>`).join('')}
   <div class="sep"></div><b style="color:#0f766e">Animals</b> ${ANIMALS.map(e=>`<button class="stk" data-e="${e}" title="Add one">${e}</button>`).join('')}
   <div class="sep"></div><button class="tb" data-set="f" style="font-size:16px">🎲 Fruit set</button><button class="tb" data-set="a" style="font-size:16px">🎲 Animal set</button><button class="tb" data-set="m" style="font-size:16px">🎲 Mixed set</button>
   <div class="sep"></div><label>Item size <select id="stkSize"><option value="44">Small</option><option value="56" selected>Medium</option><option value="76">Big</option></select></label>
   <button class="tb" id="stkClear" style="font-size:16px">🧹 Remove items</button>
   <span style="font-size:15px;color:#64748b">Drag items to move • double-tap to remove</span>`;
  function add(e,x,y){const w=layer.clientWidth,h=layer.clientHeight;const d=document.createElement('div');d.className='sticker';d.textContent=e;d.style.fontSize=big+'px';
    d.style.left=(x??(w*.15+Math.random()*w*.7))+'px';d.style.top=(y??(h*.12+Math.random()*h*.3))+'px';layer.appendChild(d);
    let sx,sy,ox,oy,last=0,drag=false;
    d.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();const now=Date.now();if(now-last<350){d.classList.add('bye');setTimeout(()=>d.remove(),260);sfx.pop();return}last=now;
      drag=true;d.classList.add('drag');layer.appendChild(d);try{d.setPointerCapture(ev.pointerId)}catch(_){}sx=ev.clientX;sy=ev.clientY;ox=parseFloat(d.style.left);oy=parseFloat(d.style.top)});
    d.addEventListener('pointermove',ev=>{if(!drag)return;d.style.left=Math.max(0,Math.min(layer.clientWidth,ox+ev.clientX-sx))+'px';d.style.top=Math.max(0,Math.min(layer.clientHeight,oy+ev.clientY-sy))+'px'});
    const end=()=>{if(drag){drag=false;d.classList.remove('drag')}};d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);
    return d}
  function scatter(list){const w=layer.clientWidth,h=layer.clientHeight;const items=shuffle(list.flatMap(e=>Array(2+(Math.random()*5|0)).fill(e)));
    const cols=Math.ceil(items.length/2),cw=(w*.8)/cols;items.forEach((e,i)=>add(e,w*.1+cw*(i%cols)+cw/2+(Math.random()*16-8),h*.1+(i<cols?0:big*1.4)+big/2+(Math.random()*12-6)));sfx.ding()}
  $$('.stk',bar).forEach(b=>b.onclick=()=>{add(b.dataset.e);sfx.pop()});
  $$('[data-set]',bar).forEach(b=>b.onclick=()=>{const t=b.dataset.set;scatter(t==='f'?FRUITS:t==='a'?ANIMALS:shuffle([...FRUITS,...ANIMALS]).slice(0,3))});
  $('#stkSize').onchange=e=>{big=+e.target.value;$$('.sticker',layer).forEach(d=>d.style.fontSize=big+'px')};
  $('#stkClear').onclick=()=>{$$('.sticker',layer).forEach(d=>{d.classList.add('bye');setTimeout(()=>d.remove(),260)})};
})();
</script>
