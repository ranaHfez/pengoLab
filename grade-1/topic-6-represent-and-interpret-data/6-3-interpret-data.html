<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 6-3 Interpret Data</title>
<!-- Shared template: colors, fonts, sounds, buttons, mascots. Keep this. -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/theme.js" defer></script>

<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Comic Sans MS","Chalkboard SE","Baloo 2","Segoe UI Rounded","Trebuchet MS",sans-serif;background:var(--bg);color:#1f2937;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none}
:root{--main:#16a34a;--main2:#f59e0b;--bg:#f0fdf4;--card:#fff;--ink:#1f2937}
/* header */
header{position:relative;z-index:1000;height:66px;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--main);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.badge{background:#fff;color:var(--main);border-radius:14px;padding:4px 10px;font-weight:900;font-size:15px;line-height:1.05;text-align:center;white-space:nowrap}
.badge small{display:block;font-size:11px;color:#6b7280}
.htitle{font-weight:900;font-size:19px;line-height:1.1;max-width:230px}
.htitle small{display:block;font-size:11px;opacity:.9;font-weight:700}
nav.tabs{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:nowrap;overflow-x:auto}
nav.tabs button{background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:14px;padding:8px 11px;border-radius:12px;white-space:nowrap;border:2px solid transparent}
nav.tabs button.on{background:#fff;color:var(--main);border-color:var(--main2)}
.hbtn{background:rgba(255,255,255,.2);color:#fff;font-size:20px;width:40px;height:40px;border-radius:12px}
/* pen bar */
#penbar{display:flex;align-items:center;gap:5px}
#penToggle{font-weight:900;font-size:14px;padding:8px 12px;border-radius:12px;background:#fff;color:#374151;border:3px solid #d1d5db;white-space:nowrap}
body.pen-on #penToggle{background:#ef4444;color:#fff;border-color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,255,255,.35)}}
#penTools{display:none;align-items:center;gap:4px;background:rgba(255,255,255,.95);padding:4px 6px;border-radius:12px}
body.pen-on #penTools{display:flex}
.sw{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #9ca3af}
.sw.on{box-shadow:0 0 0 3px #111}
.ptool{background:#f3f4f6;border-radius:8px;padding:4px 7px;font-size:16px;font-weight:800;color:#374151}
.ptool.on{background:#fde68a;outline:2px solid #f59e0b}
body.pen-on::after{content:"";position:fixed;inset:66px 0 0 0;border:5px dashed #ef4444;pointer-events:none;z-index:901}
#ink{position:fixed;left:0;top:66px;z-index:900;pointer-events:none;touch-action:none}
body.pen-on #ink{pointer-events:auto;cursor:crosshair}
/* panels */
main{position:relative;height:calc(100% - 66px)}
.panel{position:absolute;inset:0;display:none;overflow:auto;padding:12px}
.panel.on{display:block}
.sign{position:fixed;right:10px;bottom:6px;font-size:12px;color:#6b7280;z-index:5;font-weight:700}
/* book */
#book{padding:0;display:none;flex-direction:column}
#book.on{display:flex}
.bookbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;background:#fff;border-bottom:2px solid #e5e7eb}
.bookbar button{background:var(--main);color:#fff;font-weight:900;padding:6px 14px;border-radius:10px;font-size:15px}
.bookbar .thumb{background:#f3f4f6;color:#374151;padding:4px 10px}
.bookbar .thumb.on{background:var(--main2);color:#fff}
.bookview{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px;background:#e5e7eb}
.bookview img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 4px 16px rgba(0,0,0,.25);border-radius:6px;background:#fff}
.bookview.two img{max-width:50%}
/* cards */
.card{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 rgba(0,0,0,.08);border:3px solid #e5e7eb}
.big{font-size:22px;font-weight:800}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.btn{background:var(--main);color:#fff;font-weight:900;font-size:19px;padding:10px 20px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.alt{background:var(--main2)}
.btn.gray{background:#9ca3af}
.choice{background:#fff;border:4px solid var(--main);color:#111;font-size:26px;font-weight:900;min-width:76px;padding:8px 16px;border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.choice.right{background:#22c55e;color:#fff;border-color:#15803d}
.choice.wrong{background:#fecaca;border-color:#ef4444;animation:shake .4s}
.choice:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.popin{animation:pop .35s ease-out}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:bob 2s ease-in-out infinite}
/* game */
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.gtitle{font-size:22px;font-weight:900;color:var(--main)}
.prog{display:flex;gap:3px;flex-wrap:wrap}
.prog span{width:22px;height:22px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#6b7280}
.prog span.cur{background:var(--main2);color:#fff;transform:scale(1.2)}
.prog span.ok{background:#22c55e;color:#fff}
.prog span.meh{background:#fbbf24;color:#fff}
.wbbtn{margin-left:auto;background:#0ea5e9;color:#fff;font-weight:900;padding:8px 12px;border-radius:12px;font-size:15px}
.qwrap{display:flex;gap:12px;align-items:flex-start}
.charbox{width:120px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.bubble{background:#fff;border:3px solid var(--main);border-radius:16px;padding:8px 10px;font-weight:800;font-size:15px;text-align:center;position:relative;min-height:40px}
.qbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.qtext{font-size:23px;font-weight:900;line-height:1.3}
.step{background:#fff;border-radius:18px;border:3px dashed #d1d5db;padding:10px 12px;position:relative}
.step.cur{border:3px solid var(--main2);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
.step.done{border:3px solid #22c55e;opacity:.92}
.step .sn{display:inline-block;background:var(--main2);color:#fff;font-weight:900;border-radius:10px;padding:2px 9px;margin-right:6px;font-size:15px}
.step.done .sn{background:#22c55e}
.step .sl{font-weight:900;font-size:18px}
.step .sbody{margin-top:8px}
.nextbar{display:flex;justify-content:center;gap:10px;margin-top:4px}
/* drag */
.dcard{display:inline-flex;align-items:center;justify-content:center;min-width:60px;min-height:52px;padding:6px 12px;border-radius:14px;background:#fef3c7;border:3px solid #f59e0b;font-size:24px;font-weight:900;cursor:grab;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.dcard.sel{outline:4px solid #0ea5e9}
.dcard.used{visibility:hidden}
.dghost{position:fixed;z-index:2000;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.9}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:50px;border:3px dashed #9ca3af;border-radius:12px;background:#f9fafb;font-size:24px;font-weight:900;vertical-align:middle;padding:0 6px}
.slot.hot{background:#e0f2fe;border-color:#0ea5e9}
.slot.filled{border:3px solid #22c55e;background:#dcfce7;color:#166534}
.dpool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:8px;background:#f8fafc;border-radius:14px;min-height:60px}
/* tables */
table.tc{border-collapse:collapse;background:#fff;font-weight:800;font-size:19px}
table.tc td,table.tc th{border:3px solid var(--main);padding:4px 8px;height:48px;text-align:center}
table.tc th{background:var(--main);color:#fff;font-size:18px}
table.pg td.box{width:46px;min-width:46px;font-size:30px;padding:0;cursor:default}
table.pg td.lab{text-align:left;white-space:nowrap}
.tally{display:inline-block;vertical-align:middle}
/* end */
.endscreen{text-align:center;padding:20px}
.endscreen .stars{font-size:58px;letter-spacing:6px}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:3000;pointer-events:none;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* whiteboard */
#board{padding:0;display:none;flex-direction:column;background:#fff}
#board.on{display:flex}
#board.modal{display:flex;position:fixed;inset:66px 0 0 0;z-index:850;box-shadow:0 0 0 9999px rgba(0,0,0,.4)}
.wbtools{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 8px;background:#f1f5f9;border-bottom:2px solid #cbd5e1}
.wbtools .t{background:#fff;border:2px solid #cbd5e1;border-radius:10px;padding:5px 8px;font-size:15px;font-weight:800;color:#334155;min-width:38px}
.wbtools .t.on{background:#fde68a;border-color:#f59e0b}
.wbtools .sep{width:2px;height:30px;background:#cbd5e1;margin:0 2px}
.wbtools input[type=range]{width:80px}
.wbclose{display:none;background:#ef4444!important;color:#fff!important;border-color:#ef4444!important}
#board.modal .wbclose{display:inline-block}
.wbwrap{flex:1;position:relative;min-height:0}
.wbwrap canvas{position:absolute;inset:0;touch-action:none}
.wbtext{position:absolute;z-index:5;font-size:28px;border:2px dashed #0ea5e9;background:rgba(255,255,255,.8);outline:none;min-width:60px;padding:2px 4px;font-family:inherit}
/* learn scenes */
.scene{display:none}
.scene.on{display:block}
.sceneNav{display:flex;justify-content:center;gap:8px;margin:10px 0}
.sceneNav button{width:40px;height:40px;border-radius:50%;background:#e5e7eb;font-weight:900;font-size:17px}
.sceneNav button.on{background:var(--main);color:#fff}
.vocab{background:#fef9c3;border:3px solid #facc15;border-radius:16px;padding:8px 12px;font-weight:800;font-size:17px}
.vocab b{color:#b45309}
.tap{cursor:pointer}
.hl{background:#fde68a!important}
@media (max-width:800px){.charbox{width:80px}.htitle{display:none}.qtext{font-size:19px}}

:root{--main:#7c3aed;--main2:#14b8a6;--bg:#f5f3ff}</style></head>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==='style'&&typeof attrs[k]==='object')Object.assign(e.style,attrs[k]);else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function numChoices(ans,count=3,min=0,max=200,spread=3){const s=new Set([ans]);let g=0;while(s.size<count&&g++<200){const v=ans+rnd(-spread,spread);if(v>=min&&v<=max)s.add(v);}return shuffle([...s]);}

const Snd={on:true,ctx:null,noise:null,
 ac(){if(!this.ctx){this.ctx=new (window.AudioContext||window.webkitAudioContext)();const n=this.ctx.sampleRate*0.3,b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.noise=b;}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
 tone(f,t,d,type='sine',v=.18){const c=this.ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+t);g.gain.linearRampToValueAtTime(v,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+d+.05);},
 clap(n=16,len=1.3){if(!this.on)return;const c=this.ac();for(let i=0;i<n;i++){const t=c.currentTime+Math.random()*len,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;f.type='bandpass';f.frequency.value=900+Math.random()*1400;f.Q.value=1.2;g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+.12);}},
 pop(){if(this.on)this.tone(660,0,.08,'triangle',.15);},
 tick(i=0){if(this.on)this.tone(500+i*40,0,.12,'triangle',.15);},
 good(){if(!this.on)return;[523,659,784].forEach((f,i)=>this.tone(f,i*.08,.25,'triangle'));this.clap(14,1);},
 bad(){if(!this.on)return;this.tone(220,0,.18,'sawtooth',.08);this.tone(180,.12,.25,'sawtooth',.08);},
 cheer(){if(!this.on)return;[523,659,784,1046,784,1046].forEach((f,i)=>this.tone(f,i*.13,.3,'square',.08));this.clap(45,2.6);this.say('Hooray! Amazing work!');},

function picGraph(set,counts,{max=8,filled=true,tapFill=false}={}){const t=h('table',{class:'tc pg'});t.append(h('tr',{},h('th',{colspan:max+1},set.t)));const rows=[];

/* tappable tally for counting: every mark lights up when tapped */
function tallyTap(n,onAll){const w=Math.floor(n/5)*60+(n%5)*16+20,H=70;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',w);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${w} ${H}`);let x=10,marks=[];

 for(let gI=0;gI<Math.floor(n/5);gI++){for(let i=0;i<4;i++)add(x+i*14,6,x+i*14,H-6);add(x-8,H-12,x+50,12);x+=60;}for(let i=0;i<n%5;i++)add(x+i*16,6,x+i*16,H-6);

// ---------- Learn ----------
function learn(el){const set=SETS[7],counts=[6,1,3];Scenes(el,[
 (s,next)=>{const pg=picGraph(set,counts,{max:8});s.append(h('div',{class:'row',style:{alignItems:'flex-start'}},h('div',{class:'bob',html:charSVG('owl','#8b5cf6',100)}),h('div',{style:{flex:1}},h('div',{class:'card big'},'The picture graph shows how many students like milk, water, or juice with lunch. What does the graph tell us?'),h('div',{class:'vocab',style:{marginTop:'8px'}},'🔍 I can ',h('b',{},'count'),' and ',h('b',{},'compare'),' what drinks students like. 👉 Tap each drink name to count its row.'))),h('div',{class:'row',style:{justifyContent:'center'}},pg.table));
  const out=h('div',{class:'big center',style:{marginTop:'8px',color:'#7c3aed'}});s.append(out);let seen=new Set();

   if(seen.size===3&&!s.dataset.d){s.dataset.d=1;s.append(h('div',{class:'card center',style:{marginTop:'8px'}},h('div',{class:'big'},'So, the graph tells me that students like 🥛 milk better than juice or water with lunch!'),h('button',{class:'btn alt',style:{marginTop:'8px'},onclick:next},'Next: more and fewer ▶')));}},counts[i]*200+300);};});},
 (s,next)=>{s.append(h('div',{class:'vocab'},'⚖️ To compare, ',h('b',{},'match'),' the pictures 1 to 1. The extra pictures tell ',h('b',{},'how many more'),'. The shorter row has that many ',h('b',{},'fewer'),'.'));

  const show=([a,b])=>{area.innerHTML='';const sub={t:'Lunch Drinks',c:[set.c[a],set.c[b]]};const pg=picGraph(sub,[counts[a],counts[b]],{max:8});area.append(h('div',{class:'row',style:{justifyContent:'center'}},pg.table));const res=h('div',{class:'big center',style:{marginTop:'8px'}});
   area.append(h('div',{class:'center',style:{marginTop:'8px'}},h('button',{class:'btn',onclick:e=>{e.target.remove();const t=matchRows(pg,0,1);setTimeout(()=>{const d=counts[a]-counts[b];res.innerHTML=`${set.c[a][1]} ${set.c[a][0]} has <b style="color:#f97316">${d} more</b> than ${set.c[b][0].toLowerCase()}.<br>${set.c[b][1]} ${set.c[b][0]} has <b style="color:#f97316">${d} fewer</b> than ${set.c[a][0].toLowerCase()}.<br><span style="color:#7c3aed">${counts[b]} + ${d} = ${counts[a]} &nbsp; or &nbsp; ${counts[a]} − ${counts[b]} = ${d}</span>`;Snd.good();},t);}},'🔍 Match them up!'),res));};
  pairs.forEach(p=>btns.append(h('button',{class:'btn alt',onclick:()=>show(p)},`${set.c[p[0]][1]} vs ${set.c[p[1]][1]}`)));
  s.append(btns,area);show(pairs[0]);s.append(h('div',{class:'center',style:{marginTop:'10px'}},h('button',{class:'btn gray',onclick:next},'Next: what can the graph tell? ▶')));},
 (s)=>{const pg=picGraph(set,counts,{max:8});s.append(h('div',{class:'row',style:{justifyContent:'center'}},pg.table),h('div',{class:'big',style:{textAlign:'center',margin:'8px'}},'True 👍 or not true 👎?'));

]);}
// ---------- Game 1: Compare Detective ----------
function g1Qs(){return [...Array(8)].map((_,qi)=>g=>{const set=pick(SETS);let counts;do{counts=distinctCounts(3,1,8);}while(Math.max(...counts)-Math.min(...counts)<2);const pg=picGraph(set,counts,{max:8});
 let [a,b]=shuffle([0,1,2]).slice(0,2);if(counts[a]<counts[b])[a,b]=[b,a];const d=counts[a]-counts[b];const more=qi%2===0;
 g.q(more?`🔍 How many <b>more</b> students like ${set.c[a][1]} ${set.c[a][0]} than ${set.c[b][1]} ${set.c[b][0]}?`:`🔍 How many <b>fewer</b> students like ${set.c[b][1]} ${set.c[b][0]} than ${set.c[a][1]} ${set.c[a][0]}?`);g.say('Think about the meaning of more and fewer.');
 const s1=g.step('Press the magnifier to match the two rows.');s1.append(h('div',{class:'row',style:{justifyContent:'center'}},pg.table));
 s1.append(h('div',{class:'center',style:{marginTop:'6px'}},h('button',{class:'btn',onclick:e=>{e.target.remove();const t=matchRows(pg,a,b);setTimeout(()=>{g.say('Count the extra pictures!');const s2=g.step(more?'How many more?':'How many fewer?');g.choices(s2,numChoices(d,3,1,8,2),d,()=>{
   if(qi%4<2)return g.next();const s3=g.step('Finish the equation. Drag the number.');const sl=h('div',{class:'slot','data-ans':d});s3.append(h('div',{class:'row',style:{justifyContent:'center',fontSize:'30px',fontWeight:900}},String(counts[b]),'+',sl,'=',String(counts[a])));g.drag(s3,[sl],shuffle(numChoices(d,3,1,9,2)),()=>g.next());});},t);}},'🔍 Match them up!')));});}
// ---------- Game 2: Survey Sorter ----------
function g2Qs(){return [...Array(6)].map((_,qi)=>g=>{const base=qi===0?{t:'Favorite Lunchtime Vegetable',c:[['Corn','🌽'],['Peas','🟢']]}:pick(SETS);const k=base.c.length;
 let counts;do{counts=distinctCounts(k,1,k===2?8:6);}while(k===2&&counts[0]+counts[1]!==12&&qi===0);const total=counts.reduce((x,y)=>x+y,0);const votes=shuffle(counts.flatMap((c,i)=>Array(c).fill(i)));const cur=Array(k).fill(0);
 g.q(`📝 ${total} students answered: <b>${base.t}</b>. Sort their answers!`);g.say('Drag each answer to the tally chart.');
 const s1=g.step('Drag each answer into the tally chart.');const tt=tallyTable(base,cur,{slots:true,show:false});s1.append(h('div',{class:'row',style:{justifyContent:'center'}},tt.table));
 g.drag(s1,tt.cells,votes.map(v=>({v,html:`<span style="font-size:17px">${base.c[v][1]} ${base.c[v][0]}</span>`})),()=>{
  const pg=picGraph(base,counts,{max:Math.max(8,...counts)});const s2=g.step('Here is the picture graph of your data. Answer the question.');s2.append(h('div',{class:'row',style:{justifyContent:'center'}},pg.table));
  const type=qi===5?'cant':['most','more','total','fewer','most'][qi];const hi=counts.indexOf(Math.max(...counts)),lo=counts.indexOf(Math.min(...counts));
  const ask=(txt,opts,c,f)=>{s2.append(h('div',{class:'big',style:{margin:'8px 0',textAlign:'center'},html:txt}));g.choices(s2,opts,c,()=>g.next(),f);};
  if(type==='most')ask('Which is the favorite of the <b>most</b> students?',base.c.map((_,i)=>i),hi,i=>lab(base,i));
  if(type==='more')ask(`How many more chose ${base.c[hi][1]} than ${base.c[lo][1]}?`,numChoices(counts[hi]-counts[lo],3,1,9,2),counts[hi]-counts[lo]);
  if(type==='fewer')ask(`How many fewer chose ${base.c[lo][1]} than ${base.c[hi][1]}?`,numChoices(counts[hi]-counts[lo],3,1,9,2),counts[hi]-counts[lo]);
  if(type==='total')ask(`How many students answered <b>in all</b>? (${counts.join(' + ')} = ?)`,numChoices(total,3,2,30,2),total);
  if(type==='cant'){const other=pick(SETS.filter(x=>x!==base)).c[0];ask('Which question <b>CANNOT</b> be answered by the graph?',['a','b','c'],'c',x=>textChoice({a:`How many chose ${base.c[0][1]} ${base.c[0][0]}?`,b:`How many more chose ${base.c[hi][0]} than ${base.c[lo][0]}?`,c:`How many chose ${other[1]} ${other[0]}?`}[x]));}
 },{reuse:true,count:votes.length,onDrop:(slot,v)=>{cur[v]++;slot.innerHTML=tallySVG(cur[v]);}});});}
