<style>
/* Layout: one-screen classroom board. Header strip with tabs, a stage that fills the rest, a floating pen rail on the right. Single bright look by choice. */
:root{
  --sky:#dff3ff; --sky2:#bfe6ff;
  --berry:#e8364f; --berry-d:#b91f37;
  --leaf:#2fa84f; --leaf-d:#1f7a37;
  --sun:#ffc531; --sun-d:#e09a00;
  --plum:#7b4ce0; --orange:#ff8a1f; --pink:#ff5fa8; --teal:#14b3b3;
  --ink:#24304a; --ink2:#5a6680; --paper:#ffffff; --cream:#fff8e8;
  --line:#cfe0ef;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--berry)}
*{box-sizing:border-box}
button{font-family:var(--display);cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid var(--plum);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
/* header */
.top{background:var(--berry);color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 4px 0 var(--berry-d);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(18px,2vw,26px);line-height:1;margin:0;text-wrap:balance}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:12px;opacity:.9;letter-spacing:.04em;margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:clamp(14px,1.3vw,17px);padding:7px 14px;border-radius:999px;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:#fff;color:var(--berry-d);box-shadow:0 3px 0 var(--berry-d)}
.tab .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sun);color:var(--ink);font-size:13px}
.icobtn{border:0;background:rgba(255,255,255,.18);color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px}
/* stage */
.stage{position:relative;overflow:hidden;min-height:0}
.panel{position:absolute;inset:0;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 74px);display:flex;flex-direction:column;gap:12px;min-height:0}
.panel[hidden]{display:none!important}
.bgdeco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgdeco::before{content:"";position:absolute;left:-5%;right:-5%;bottom:-60px;height:140px;background:#9fdc8c;border-radius:50% 50% 0 0}
.panel>*{position:relative;z-index:1}
.card{background:var(--paper);border-radius:26px;box-shadow:0 6px 0 var(--line);}
.h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.6vw,34px);margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--ink2);font-weight:700;margin:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-height:0;min-width:0}
.big-btn{border:0;border-radius:18px;padding:10px 22px;font-size:clamp(17px,1.6vw,22px);font-weight:800;background:var(--sun);box-shadow:0 5px 0 var(--sun-d);transition:transform .1s}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-d)}
.big-btn.green{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d)}
.big-btn.red{background:var(--berry);color:#fff;box-shadow:0 5px 0 var(--berry-d)}
.big-btn.ghost{background:#fff;box-shadow:0 5px 0 var(--line)}
.big-btn[disabled]{opacity:.4;cursor:default}
/* progress */
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog i{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:13px;color:var(--ink2)}
.prog i.on{border-color:var(--plum);color:var(--plum)}
.prog i.done{background:var(--sun);border-color:var(--sun-d);color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-family:var(--display);font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px;background:#eef4fa;color:var(--ink2)}
.steps span.on{background:var(--plum);color:#fff}
.steps span.ok{background:#d6f5dc;color:var(--leaf-d)}
/* choices */
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choice{border:0;min-width:96px;height:84px;padding:0 18px;border-radius:24px;font-size:clamp(30px,3.4vw,46px);font-weight:800;background:#fff;box-shadow:0 6px 0 var(--line), inset 0 0 0 4px var(--sky2)}
.choice:hover{transform:translateY(-2px)}
.choice.right{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-d)}
.choice.wrong{background:#ffe0e4;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* cubes */
.tower{display:flex;flex-direction:column-reverse;gap:3px;align-items:center}
.cube{width:var(--c,34px);height:var(--c,34px);border-radius:7px;background:var(--col,var(--orange));box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);position:relative;animation:drop .35s ease-out both}
.cube::after{content:"";position:absolute;inset:30%;border-radius:50%;background:rgba(0,0,0,.18)}
.cube.ghost{background:transparent;border:3px dashed var(--leaf);box-shadow:none;animation:pulse 1s infinite;cursor:pointer}
.cube.ghost::after{display:none}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
.towers{display:flex;gap:26px;align-items:flex-end;justify-content:center}
.tlabel{font-family:var(--display);font-weight:800;font-size:24px;text-align:center;margin-top:4px}
/* math */
.eq{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.6vw,64px);line-height:1;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
.eq .q{color:var(--berry)}
.eq .hl{background:var(--sun);border-radius:14px;padding:0 .2em}
.vert{font-family:var(--display);font-weight:800;font-size:clamp(34px,4vw,58px);line-height:1.05;text-align:right;display:inline-block}
.vert .bar{border-top:5px solid var(--ink);margin-top:4px;padding-top:4px}
.bubble{background:#fff;border:4px solid var(--leaf);border-radius:26px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:clamp(17px,1.7vw,24px);line-height:1.25;position:relative}
.bubble.say::after{content:"";position:absolute;left:-18px;bottom:20px;border:12px solid transparent;border-right:14px solid var(--leaf)}
.mascot{width:clamp(90px,11vw,150px);flex:none}
.flex-center{display:flex;align-items:center;justify-content:center}
/* book: page fills the whole stage, controls float on top */
#p-book{padding-block:4px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:calc(max(4px,env(safe-area-inset-right,0px)) + 68px);gap:0}
.book{position:relative;flex:1;min-height:0}
.book-frame{position:absolute;inset:0}
.book-frame img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));user-select:none;-webkit-user-drag:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;border:0;width:46px;height:46px;border-radius:50%;background:var(--sun);font-size:26px;font-weight:800;box-shadow:0 4px 0 var(--sun-d);opacity:.8}
.arrow:hover{opacity:1}
#bPrev{left:2px} #bNext{right:2px}
.pdots{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);z-index:3;display:flex;gap:4px;background:rgba(255,255,255,.85);padding:4px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap}
.pdots button{border:0;padding:3px 10px;border-radius:999px;background:transparent;font-weight:700;font-size:13px}
.pdots button.on{background:var(--plum);color:#fff}
body.focus .top{display:none}
/* baskets */
.baskets{display:flex;gap:30px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.basket{width:clamp(150px,18vw,230px);position:relative;cursor:pointer}
.basket .fruit{position:absolute;inset:6% 12% 46% 12%;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-end;justify-content:center}
.basket .fruit svg{width:30%;max-width:42px;animation:drop .4s both}
.basket .cnt{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;border-radius:999px;padding:0 14px}
/* drag */
.slot{display:inline-grid;place-items:center;min-width:1.4em;height:1.3em;border-radius:16px;border:4px dashed var(--plum);background:#f3edff;color:var(--plum)}
.slot.op{border-radius:50%;min-width:1.3em}
.slot.filled{border-style:solid;background:#fff;color:var(--ink)}
.slot.bad{border-color:var(--berry);background:#ffe0e4;animation:shake .4s}
.slot.good{border-color:var(--leaf);background:#d6f5dc}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tile{width:70px;height:70px;border-radius:20px;background:var(--sun);box-shadow:0 5px 0 var(--sun-d);font-family:var(--display);font-weight:800;font-size:36px;display:grid;place-items:center;touch-action:none;user-select:none;cursor:grab}
.tile.op{background:var(--teal);color:#fff;box-shadow:0 5px 0 #0c8585}
.tile.sel{outline:4px solid var(--plum)}
.tile.drag{position:fixed;z-index:60;pointer-events:none;transform:scale(1.1) rotate(-4deg)}
.story{display:flex;gap:16px;align-items:center}
.story .txt{font-family:var(--display);font-weight:700;font-size:clamp(19px,2vw,28px);line-height:1.3}
.groups{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.group{background:var(--cream);border-radius:20px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:2px;max-width:230px;justify-content:center;font-size:30px;line-height:1.1;border:3px solid #f1dfb4}
.group .extra{filter:drop-shadow(0 0 4px var(--sun));animation:pulse 1s infinite}
.group .who{width:100%;text-align:center;font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink2)}
/* pen rail */
.rail{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-38%);z-index:40;background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line),0 10px 30px rgba(0,0,0,.12);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;width:60px}
.rail button{border:0;width:44px;height:40px;border-radius:12px;background:#f2f6fb;display:grid;place-items:center;font-size:19px}
.rail button.on{background:var(--plum);color:#fff}
.rail .sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.rail .sw.on{box-shadow:0 0 0 3px var(--ink)}
.rail .sep{height:2px;width:36px;background:var(--line);border-radius:2px}
.rail .sizes{display:flex;flex-direction:column;gap:4px}
.rail .sizes button{height:30px}
.rail .sizes b{display:block;border-radius:50%;background:var(--ink)}
.rail.min>*:not(.toggle){display:none}
.rail .lbl{font-size:10px;font-weight:800;color:var(--ink2);letter-spacing:.06em}
#ink,#live{position:fixed;inset:0;z-index:30;pointer-events:none;touch-action:none}
#live{z-index:31}
body.drawing #ink{pointer-events:auto;cursor:crosshair}
#board{position:fixed;inset:0;z-index:29;background:
  linear-gradient(#fff,#fff) padding-box;background-color:#fff;
  background-image:repeating-linear-gradient(to bottom,transparent 0 58px,#dbe9f6 58px 60px);}
#board .bt{position:absolute;left:24px;top:calc(env(safe-area-inset-top,0px) + 16px);font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink2)}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%) scale(.6);opacity:0;z-index:55;font-family:var(--display);font-weight:800;font-size:clamp(36px,6vw,80px);color:#fff;-webkit-text-stroke:3px var(--berry-d);text-shadow:0 6px 0 var(--berry-d);pointer-events:none;transition:all .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.mini{font-size:14px;color:var(--ink2);font-weight:700}
.feedback{font-family:var(--display);font-weight:800;font-size:clamp(18px,1.8vw,24px);min-height:1.4em;text-align:center}
.feedback.good{color:var(--leaf-d)} .feedback.bad{color:var(--berry)}
.chip{border:0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;background:#fff;box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--plum);color:#fff;box-shadow:0 3px 0 #5530a8}
.done-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.stars{font-size:46px;letter-spacing:6px}
.sign{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-family:var(--display);font-weight:700;font-size:13px;color:var(--leaf-d);z-index:2;opacity:.85}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .stage{min-height:calc(100vh - 120px)}
  .panel{position:relative;inset:auto;padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:90px}
  .rail{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:none;flex-direction:row;width:auto;max-width:calc(100vw - 20px);overflow-x:auto;right:10px}
  .rail .sizes{flex-direction:row}
  .rail .sep{width:2px;height:30px}
  .tabs{margin-left:0}
  .mascot{width:80px}
  .book{min-height:72vh}
}

@media (max-width:760px){.h2{font-size:22px}.eq{font-size:34px!important}.choice{height:64px;min-width:72px;font-size:28px}.tile{width:56px;height:56px;font-size:28px}.story .txt{font-size:18px}.bubble{font-size:16px!important}.mascot{width:70px}.basket{width:130px}.big-btn{font-size:17px}.feedback{font-size:17px}}

.rail{top:50%!important;transform:translateY(-50%)!important;max-height:calc(100% - 16px);overflow-y:auto;gap:min(6px,.7vh);padding:min(8px,1vh) 6px}

@media (max-width:760px){.rail{top:auto!important;transform:none!important;max-height:none}.rail .sws{display:flex}}

@media (min-width:761px){.top{flex-wrap:nowrap}.brand{flex:1 1 auto;min-width:0}.brand>div{min-width:0}.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand h1{white-space:nowrap}.tabs{flex-wrap:nowrap;flex:none}.tab{padding:6px 11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Sound ---------- */
let AC=null, soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,d,type='triangle',v=.18){const a=ac();if(!a||!soundOn)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05);}
function clap(n=10){const a=ac();if(!a||!soundOn)return;const len=a.sampleRate*.12;const buf=a.createBuffer(1,len,a.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  for(let i=0;i<n;i++){const t=a.currentTime+i*.13+Math.random()*.05;for(let k=0;k<3;k++){const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1000+Math.random()*900;f.Q.value=.9;const g=a.createGain();g.gain.value=.5;s.connect(f).connect(g).connect(a.destination);s.start(t+k*.012);}}}
function cheer(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.1,.35));tone(1318,.42,.5,'sine',.12);}
function oops(){tone(330,0,.18,'sine',.2);tone(247,.18,.28,'sine',.2);}
function pop(){tone(880+Math.random()*200,0,.08,'square',.06);}
function say(t){if(!soundOn)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.95;u.pitch=1.3;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const PRAISE=['Great job!','Super star!','Awesome!','You did it!','Fantastic!','Well done!','Brilliant!'];
function celebrate(big=false){cheer();clap(big?16:8);confetti(big?220:90);const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];showToast(p);say(p);}
function tryAgain(){oops();const t=['Try again!','Almost! Try again','Think about the double!'][Math.floor(Math.random()*3)];say(t);}
let toastT;function showToast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1300);}
$('#sndBtn').onclick=()=>{soundOn=!soundOn;$('#sndBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)pop();};

/* ---------- Confetti ---------- */
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false;
function confetti(n){const W=innerWidth,H=innerHeight;const cols=['#e8364f','#ffc531','#2fa84f','#7b4ce0','#14b3b3','#ff5fa8','#ff8a1f'];for(let i=0;i<n;i++)parts.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+Math.random()*60});if(!fxRun){fxRun=true;requestAnimationFrame(fxStep);}}
function fxStep(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0);for(const p of parts){p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;p.life--;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);fctx.restore();}if(parts.length)requestAnimationFrame(fxStep);else{fxRun=false;fctx.clearRect(0,0,fx.width,fx.height);}}

/* ---------- Drawing layer (works on every tab) ---------- */
const ink=$('#ink'),ictx=ink.getContext('2d'),live=$('#live'),lctx=live.getContext('2d');
let tool='pointer',color='#24304a',size=8,curKey='book:0',store={},undo=[],boardOn=false;
const DPR=Math.min(2,window.devicePixelRatio||1);
function sizeCanvases(){const W=innerWidth,H=innerHeight;let snap=null;if(ink.width){snap=document.createElement('canvas');snap.width=ink.width;snap.height=ink.height;snap.getContext('2d').drawImage(ink,0,0);}
  for(const c of [ink,live,fx]){c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';}
  ictx.setTransform(1,0,0,1,0,0);lctx.setTransform(DPR,0,0,DPR,0,0);fctx.setTransform(DPR,0,0,DPR,0,0);
  if(snap)ictx.drawImage(snap,0,0,snap.width,snap.height,0,0,ink.width,ink.height);}
sizeCanvases();addEventListener('resize',sizeCanvases);
function snapshot(){const c=document.createElement('canvas');c.width=ink.width;c.height=ink.height;c.getContext('2d').drawImage(ink,0,0);return c;}
function setKey(k){if(boardOn)k='board';if(k===curKey)return;store[curKey]=snapshot();ictx.clearRect(0,0,ink.width,ink.height);if(store[k])ictx.drawImage(store[k],0,0,store[k].width,store[k].height,0,0,ink.width,ink.height);curKey=k;undo=[];}
let viewKey='book:0';function view(k){viewKey=k;setKey(k);}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));document.body.classList.toggle('drawing',t!=='pointer');}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{color=b.dataset.col;document.querySelectorAll('[data-col]').forEach(x=>x.classList.toggle('on',x===b));if(tool==='pointer'||tool==='eraser')setTool('pen');});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=+b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('on',x===b));});
$('#undoBtn').onclick=()=>{const s=undo.pop();if(!s)return;ictx.clearRect(0,0,ink.width,ink.height);ictx.drawImage(s,0,0);};
$('#clearBtn').onclick=()=>{undo.push(snapshot());ictx.clearRect(0,0,ink.width,ink.height);};
$('#boardBtn').onclick=()=>{boardOn=!boardOn;$('#board').hidden=!boardOn;$('#boardBtn').classList.toggle('on',boardOn);if(boardOn){setKey('board');if(tool==='pointer')setTool('pen');}else{boardOn=false;setKey(viewKey);}};
$('#railToggle').onclick=()=>$('#rail').classList.toggle('min');
let pts=null;
ink.addEventListener('pointerdown',e=>{if(tool==='pointer')return;e.preventDefault();ink.setPointerCapture(e.pointerId);undo.push(snapshot());if(undo.length>25)undo.shift();pts=[[e.clientX,e.clientY]];if(tool==='eraser')eraseAt(e.clientX,e.clientY,null);else drawLive();});
ink.addEventListener('pointermove',e=>{if(!pts)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const p=[ev.clientX,ev.clientY];if(tool==='eraser')eraseAt(p[0],p[1],pts[pts.length-1]);pts.push(p);}if(tool!=='eraser')drawLive();});
const endStroke=()=>{if(!pts)return;if(tool!=='eraser'){ictx.save();ictx.globalAlpha=tool==='hl'?.38:1;ictx.drawImage(live,0,0);ictx.restore();lctx.clearRect(0,0,live.width,live.height);}pts=null;};
ink.addEventListener('pointerup',endStroke);ink.addEventListener('pointercancel',endStroke);
function drawLive(){lctx.clearRect(0,0,innerWidth,innerHeight);lctx.lineCap='round';lctx.lineJoin='round';lctx.strokeStyle=color;lctx.lineWidth=tool==='hl'?size*3.2:size;lctx.beginPath();lctx.moveTo(pts[0][0],pts[0][1]);if(pts.length===1)lctx.lineTo(pts[0][0]+.1,pts[0][1]);for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];lctx.quadraticCurveTo(x0,y0,(x0+x1)/2,(y0+y1)/2);}lctx.stroke();}
function eraseAt(x,y,prev){ictx.save();ictx.setTransform(DPR,0,0,DPR,0,0);ictx.globalCompositeOperation='destination-out';ictx.lineCap='round';ictx.lineWidth=size*4;ictx.beginPath();ictx.moveTo(prev?prev[0]:x,prev?prev[1]:y);ictx.lineTo(x+.1,y);ictx.stroke();ictx.restore();}
addEventListener('keydown',e=>{if(e.key==='Escape')setTool('pointer');});

(function(){const P=$('#p-warm');const Q=[2,5,3,4,6];let qi=0,filled=[0,0],stepN=0,score=0;
  function render(){
    if(qi>=Q.length){P.innerHTML=`<div class="done-card card">${PIP()}<h2 class="h2">Warm-up done! You know your doubles!</h2><div class="stars">⭐⭐⭐⭐⭐</div><p class="sub">Doubles are our helpers for today's lesson.</p><div class="row" style="justify-content:center"><button class="big-btn ghost" id="wAgain">Play again</button><button class="big-btn green" id="wGo">Go to Learn ›</button></div></div>`;
      $('#wAgain').onclick=()=>{qi=0;render();};$('#wGo').onclick=()=>showTab('learn');celebrate(true);setSub('warm',99);return;}
    const n=Q[qi];filled=[0,0];stepN=0;setSub('warm',qi);
    P.innerHTML=`<div class="row"><h2 class="h2 grow">Warm-up: Twin Baskets</h2><div class="prog">${Q.map((_,k)=>`<i class="${k<qi?'done':k===qi?'on':''}">${k+1}</i>`).join('')}</div></div>
    <div class="steps" id="wSteps"><span class="on">Step 1 · Fill both baskets</span><span>Step 2 · Find the double</span></div>

      <div class="row" style="justify-content:center;flex-wrap:nowrap">${PIP()}<div class="bubble say" id="wSay">Pip and Pop are twins! They each pick <b>${n}</b> strawberries. Tap each basket to fill it.</div></div>
      <div class="baskets"><div class="basket" data-b="0">${basketSVG}<div class="fruit"></div><span class="cnt">0</span></div><div class="eq" style="font-size:54px">+</div><div class="basket" data-b="1">${basketSVG}<div class="fruit"></div><span class="cnt">0</span></div></div>
      <div id="wAsk" hidden><div class="eq" style="margin-bottom:12px">${n} + ${n} = <span class="q">?</span></div><div class="choices" id="wCh"></div></div>
      <div class="feedback" id="wFb"></div>
    </div>`;
    P.querySelectorAll('.basket').forEach(b=>b.onclick=()=>{const k=+b.dataset.b;if(filled[k]>=n)return;filled[k]++;pop();b.querySelector('.fruit').insertAdjacentHTML('beforeend',strawberry);b.querySelector('.cnt').textContent=filled[k];if(filled[0]===n&&filled[1]===n)step2();});

      const opts=shuffle([n*2,n*2+1,Math.max(2,n*2-2)]);const ch=$('#wCh');opts.forEach(o=>ch.appendChild(el('button',{class:'choice',onclick:e=>{if(o===n*2){e.target.classList.add('right');$('#wFb').className='feedback good';$('#wFb').textContent=`Yes! ${n} + ${n} = ${n*2}`;celebrate();ch.querySelectorAll('button').forEach(b=>b.disabled=true);setTimeout(()=>{qi++;render();},1700);}else{e.target.classList.add('wrong');setTimeout(()=>e.target.classList.remove('wrong'),400);$('#wFb').className='feedback bad';$('#wFb').textContent='Count all the strawberries again.';tryAgain();}}},String(o))));}
  }

/* ---------- LEARN ---------- */
(function(){const P=$('#p-learn');let scene=0;
  const scenes=['Story','Cube Towers','Convince Me!'];
  function frame(inner){P.innerHTML=`<div class="row"><h2 class="h2 grow">Learn: Doubles Plus</h2><div class="row" id="lNav">${scenes.map((s,k)=>`<button class="chip ${k===scene?'on':''}" data-s="${k}">${k+1}. ${s}</button>`).join('')}</div></div>${inner}`;P.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{scene=+b.dataset.s;render();});setSub('learn',scene+(scene===1?'-'+fact.join('+'):''));}
  let fact=[6,7];
  function render(){if(scene===0)story();else if(scene===1)cubes();else convince();}
  /* Scene 1: Solve & Share story */
  function story(){let a=0,b=0,st=0;
    frame(`<div class="card grow" style="display:flex;flex-direction:column;padding:14px;gap:10px;justify-content:space-between">
      <div class="steps" id="sSteps"><span class="on">1 · Each picks 5</span><span>2 · Doubles fact</span><span>3 · Pick 1 more</span><span>4 · Doubles plus 1</span></div>
      <div class="row" style="flex-wrap:nowrap;gap:10px">${POP()}<div class="bubble say grow" id="sSay">Pip and Pop each pick <b>5</b> strawberries. Tap <b>Pick!</b> to fill the baskets.</div><div id="sChick" style="visibility:hidden">${CHICK()}</div></div>
      <div class="baskets" id="sB"><div class="basket">${basketSVG}<div class="fruit"></div><span class="cnt">0</span></div><div class="basket">${basketSVG}<div class="fruit"></div><span class="cnt">0</span></div></div>
      <div class="eq" id="sEq">&nbsp;</div>
      <div class="row" style="justify-content:center"><button class="big-btn red" id="sBtn">Pick!</button><button class="big-btn ghost" id="sReset">Start over</button></div></div>`);
    const bs=P.querySelectorAll('#sB .basket');const steps=()=>$('#sSteps').children;
    function add(k){bs[k].querySelector('.fruit').insertAdjacentHTML('beforeend',strawberry);bs[k].querySelector('.cnt').textContent=k?++b:++a;pop();}
    $('#sReset').onclick=story;
    $('#sBtn').onclick=()=>{const btn=$('#sBtn');
      if(st===0){btn.disabled=true;let i=0;const t=setInterval(()=>{add(i%2);i++;if(i>=10){clearInterval(t);btn.disabled=false;st=1;steps()[0].className='ok';steps()[1].className='on';$('#sSay').innerHTML='Same in each basket! Which <b>doubles fact</b> shows how many?';btn.textContent='Show the double';}},220);}
      else if(st===1){$('#sEq').innerHTML='5 + 5 = <span class="hl">10</span>';cheer();st=2;steps()[1].className='ok';steps()[2].className='on';$('#sSay').innerHTML='Now Chick brings Pop <b>1 more</b> strawberry!';btn.textContent='Pick 1 more!';$('#sChick').style.visibility='visible';}
      else if(st===2){add(1);bs[1].querySelector('.fruit').lastElementChild.style.filter='drop-shadow(0 0 6px #ffc531)';$('#sEq').innerHTML='5 + 6 = <span class="q">?</span>';st=3;steps()[2].className='ok';steps()[3].className='on';$('#sSay').innerHTML='5 + 6 is <b>5 + 5</b> and <b>1 more</b>. Think: 10 and 1 more is…';btn.textContent='Show the answer';}
      else if(st===3){$('#sEq').innerHTML='5 + 5 = 10 <span style="color:var(--ink2);font-size:.6em">and 1 more</span> → 5 + 6 = <span class="hl">11</span>';steps()[3].className='ok';$('#sSay').innerHTML='<b>5 + 6 = 11.</b> A doubles fact helped us! This is a <b>doubles-plus fact</b>.';celebrate();btn.textContent='Next: Cube Towers ›';st=4;}
      else{scene=1;render();}
    };}
  /* Scene 2: Visual learning bridge with cubes */
  function cubes(){let st=0;const [s,big]=[Math.min(...fact),Math.max(...fact)];const e=big-s;
    const facts=[[6,7],[5,6],[7,8],[8,9],[4,5],[5,7],[9,10]];
    frame(`<div class="row"><span class="mini">Choose a fact:</span>${facts.map(f=>`<button class="chip ${f[0]===fact[0]&&f[1]===fact[1]?'on':''}" data-f="${f}">${f[0]} + ${f[1]}</button>`).join('')}</div>

      <div class="flex-center" style="flex-direction:column;gap:8px"><div class="vert" id="cV">${s}<br>+ ${big}<div class="bar"><span class="q" style="color:var(--berry)">?</span></div></div></div>
      <div style="display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0;height:100%;justify-content:space-between">
        <div class="steps" id="cSteps"><span class="on">1 · Find the double</span><span>2 · Add the double</span><span>3 · Add ${e} more</span><span>4 · Answer</span></div>
        <div class="towers" id="cT" style="--c:clamp(20px,3.6vh,36px)"></div>
        <div class="eq" id="cEq" style="font-size:clamp(26px,3.4vw,46px)">You already know <span class="hl">${s} + ${s}</span>!</div>
        <button class="big-btn green" id="cBtn">Build ${s} + ${s}</button>
      </div>
      <div class="flex-center" style="flex-direction:column">${POP()}<div class="bubble" id="cSay" style="max-width:220px;font-size:18px">Doubles-plus facts are also called <b>near doubles</b>.</div></div>
     </div>`);
    P.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{fact=b.dataset.f.split(',').map(Number);cubes();});
    const T=$('#cT'),steps=()=>$('#cSteps').children;
    function tower(n,col,lbl){const w=el('div');const t=el('div',{class:'tower'});for(let i=0;i<n;i++){const c=el('div',{class:'cube'});c.style.setProperty('--col',col);c.style.animationDelay=(i*.07)+'s';t.appendChild(c);}w.appendChild(t);w.appendChild(el('div',{class:'tlabel'},String(lbl)));return w;}
    $('#cBtn').onclick=()=>{const btn=$('#cBtn');
      if(st===0){T.innerHTML='';T.appendChild(tower(s,'var(--orange)',s));T.appendChild(tower(s,'var(--pink)',s));pop();st=1;steps()[0].className='ok';steps()[1].className='on';$('#cEq').innerHTML=`${s} + ${s} = <span class="q">?</span>`;btn.textContent='Add the double';$('#cSay').innerHTML=`Two towers, the same size. That's a double!`;}
      else if(st===1){$('#cEq').innerHTML=`${s} + ${s} = <span class="hl">${2*s}</span>`;cheer();st=2;steps()[1].className='ok';steps()[2].className='on';btn.textContent=`Add ${e} more cube${e>1?'s':''}`;$('#cSay').innerHTML=`${s} + ${big} is ${s} + ${s} and <b>${e} more</b>.`;}
      else if(st===2){const t2=T.children[1].querySelector('.tower');for(let i=0;i<e;i++){const c=el('div',{class:'cube'});c.style.setProperty('--col','var(--leaf)');c.style.animationDelay=(i*.25)+'s';t2.appendChild(c);}T.children[1].querySelector('.tlabel').textContent=big;pop();st=3;steps()[2].className='ok';steps()[3].className='on';$('#cEq').innerHTML=`${2*s} and ${e} more is <span class="q">?</span>`;btn.textContent='Show the answer';}
      else if(st===3){$('#cEq').innerHTML=`${2*s} and ${e} more is <span class="hl">${2*s+e}</span>`;$('#cV').innerHTML=`${s}<br>+ ${big}<div class="bar">${2*s+e}</div>`;steps()[3].className='ok';$('#cSay').innerHTML=`So <b>${s} + ${big} = ${2*s+e}</b>`;celebrate();btn.textContent='Try another fact';st=4;}
      else{const i=facts.findIndex(f=>f[0]===fact[0]&&f[1]===fact[1]);fact=facts[(i+1)%facts.length];cubes();}
    };}
  /* Scene 3: Convince me */
  function convince(){let st=0;
    frame(`<div class="card grow" style="display:flex;flex-direction:column;padding:16px;gap:12px;justify-content:space-between">
      <div class="row" style="flex-wrap:nowrap">${PIP()}<div class="bubble say grow"><b style="color:var(--plum)">Convince Me!</b> How does knowing <b>7 + 7</b> help you find <b>7 + 8</b>?</div></div>
      <div class="row" style="justify-content:center;gap:40px;align-items:flex-end">
        <div class="towers" id="vT" style="--c:clamp(16px,3vh,30px)"></div>
        <div style="display:flex;flex-direction:column;gap:10px"><div class="eq" id="v1" style="font-size:clamp(28px,3.6vw,50px);justify-content:flex-start">7 + 7 = <span class="q">?</span></div><div class="eq" id="v2" style="font-size:clamp(28px,3.6vw,50px);justify-content:flex-start;visibility:hidden">7 + 8 = 7 + 7 + 1</div><div class="eq" id="v3" style="font-size:clamp(28px,3.6vw,50px);justify-content:flex-start;visibility:hidden">14 + 1 = <span class="hl">15</span></div></div>
      </div>
      <div class="bubble" style="border-color:var(--sun);background:var(--cream)"><b>Remember:</b> To solve a doubles-plus fact, think of the <b>double</b> of the smaller number, then add the <b>extra</b>.</div>
      <div class="row" style="justify-content:center"><button class="big-btn green" id="vBtn">Show 7 + 7</button></div></div>`);
    const T=$('#vT');const mk=(n,col,extra=0)=>{const w=el('div');const t=el('div',{class:'tower'});for(let i=0;i<n+extra;i++){const c=el('div',{class:'cube'});c.style.setProperty('--col',i>=n?'var(--leaf)':col);c.style.animationDelay=(i*.05)+'s';t.appendChild(c);}w.appendChild(t);return w;};
    T.appendChild(mk(7,'var(--orange)'));T.appendChild(mk(7,'var(--pink)'));
    $('#vBtn').onclick=()=>{const b=$('#vBtn');
      if(st===0){$('#v1').innerHTML='7 + 7 = <span class="hl">14</span>';cheer();b.textContent='Add 1 more';st=1;}
      else if(st===1){T.children[1].replaceWith(mk(7,'var(--pink)',1));$('#v2').style.visibility='visible';pop();b.textContent='Find 7 + 8';st=2;}
      else if(st===2){$('#v3').style.visibility='visible';celebrate();b.textContent='Play Game 1 ›';st=3;}
      else showTab('g1');};}
  render();})();

/* ---------- GAME 1: Tower Builder (step by step) ---------- */
(function(){const P=$('#p-g1');
  const Q=[[3,4],[5,6],[8,7],[4,5],[8,9],[6,7],[9,10],[4,6],[5,7],[9,7]];
  let qi=0,score=0;
  function render(){
    if(qi>=Q.length){setSub('g1',99);P.innerHTML=`<div class="done-card card">${CHICK()}<h2 class="h2">Tower Builder champion!</h2><div class="stars">${'⭐'.repeat(Math.max(1,Math.round(score/2)))}</div><p class="sub">You solved ${Q.length} doubles-plus facts. First try: ${score} of ${Q.length}.</p><div class="row" style="justify-content:center"><button class="big-btn ghost" id="gA">Play again</button><button class="big-btn green" id="gB">Go to Game 2 ›</button></div></div>`;$('#gA').onclick=()=>{qi=0;score=0;render();};$('#gB').onclick=()=>showTab('g2');celebrate(true);return;}
    setSub('g1',qi);
    const [x,y]=Q[qi],s=Math.min(x,y),e=Math.abs(x-y),tot=x+y;let st=0,miss=false,placed=0;
    P.innerHTML=`<div class="row"><h2 class="h2 grow">Game 1: Tower Builder</h2><div class="prog">${Q.map((_,k)=>`<i class="${k<qi?'done':k===qi?'on':''}">${k+1}</i>`).join('')}</div></div>
      <div class="steps" id="gS"><span class="on">1 · Pick the double</span><span>2 · Add the double</span><span>3 · Add the extra</span><span>4 · Solve</span></div>
      <div class="card grow" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;padding:14px;align-items:center">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0">
          <div class="vert" id="gV">${x}<br>+ ${y}<div class="bar"><span style="color:var(--berry)">?</span></div></div>
          <div class="row" style="flex-wrap:nowrap">${CHICK()}<div class="bubble" id="gSay" style="font-size:19px">Which <b>double</b> helps you solve ${x} + ${y}?</div></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;height:100%;justify-content:center;min-width:0">
          <div class="towers" id="gT" style="--c:clamp(16px,3.1vh,30px);min-height:40px"></div>
          <div class="eq" id="gEq" style="font-size:clamp(26px,3.2vw,44px)"></div>
          <div class="choices" id="gC"></div>
          <div class="feedback" id="gF"></div>
        </div>
      </div>`;
    const S=()=>$('#gS').children,C=$('#gC'),F=$('#gF');
    function ask(opts,correct,ok){C.innerHTML='';F.textContent='';shuffle(opts).forEach(o=>C.appendChild(el('button',{class:'choice',onclick:ev=>{if(String(o)===String(correct)){ev.target.classList.add('right');C.querySelectorAll('button').forEach(b=>b.disabled=true);pop();setTimeout(ok,500);}else{miss=true;ev.target.classList.add('wrong');setTimeout(()=>ev.target.classList.remove('wrong'),400);tryAgain();F.className='feedback bad';F.textContent=st===0?`Look for the smaller number. Double it!`:st===1?`Count the cubes in both towers.`:`Start at ${2*s} and count on ${e}.`;}}},String(o))));}
    function next(i){S()[i].className='ok';if(S()[i+1])S()[i+1].className='on';}
    const tw=(n,col)=>{const w=el('div');const t=el('div',{class:'tower'});for(let i=0;i<n;i++){const c=el('div',{class:'cube'});c.style.setProperty('--col',col);c.style.animationDelay=(i*.06)+'s';t.appendChild(c);}w.appendChild(t);w.appendChild(el('div',{class:'tlabel'},String(n)));return w;};
    // step 1
    const d1=s>=2?s-1:s+3,d2=Math.max(x,y)+1;
    ask([`${s} + ${s}`,`${d1} + ${d1}`,`${d2} + ${d2}`],`${s} + ${s}`,()=>{
      st=1;next(0);$('#gT').append(tw(s,'var(--orange)'),tw(s,'var(--pink)'));$('#gEq').innerHTML=`${s} + ${s} = <span class="q">?</span>`;$('#gSay').innerHTML=`Great! ${x} + ${y} is <b>${s} + ${s}</b> and <b>${e} more</b>.`;
      ask([2*s,2*s+1,2*s-1],2*s,()=>{
        st=2;next(1);cheer();$('#gEq').innerHTML=`${s} + ${s} = <span class="hl">${2*s}</span>`;C.innerHTML='';
        const t2=$('#gT').children[1].querySelector('.tower');$('#gSay').innerHTML=`Tap the dashed cube${e>1?'s':''} to add <b>${e} more</b>!`;
        for(let i=0;i<e;i++){const g=el('div',{class:'cube ghost'});g.style.animation='pulse 1s infinite';g.onclick=()=>{if(!g.classList.contains('ghost'))return;g.className='cube';g.style.setProperty('--col','var(--leaf)');g.style.animation='drop .3s both';pop();placed++;$('#gT').children[1].querySelector('.tlabel').textContent=s+placed;$('#gEq').innerHTML=`${2*s} and ${placed} more`;if(placed===e)step4();};t2.appendChild(g);}
      });});
    function step4(){st=3;next(2);$('#gEq').innerHTML=`${2*s} and ${e} more is <span class="q">?</span>`;$('#gSay').innerHTML=`So, ${x} + ${y} = ?`;
      ask(shuffle([tot,tot-1,tot+1]),tot,()=>{next(3);$('#gV').innerHTML=`${x}<br>+ ${y}<div class="bar">${tot}</div>`;$('#gEq').innerHTML=`${x} + ${y} = <span class="hl">${tot}</span>`;F.className='feedback good';F.textContent=`${2*s} and ${e} more is ${tot}!`;if(!miss)score++;celebrate();setTimeout(()=>{qi++;render();},2000);});}
  }
  render();})();

/* ---------- GAME 2: Fruit Stand Stories (drag & drop) ---------- */
(function(){const P=$('#p-g2');
  const Q=[
    {t:'Carrie and Pete each pick <b>7</b> cherries. Then Pete picks <b>1 more</b>. How many cherries do they have in all?',a:7,b:8,f:'🍒',u:'cherries',n:['Carrie','Pete']},
    {t:'Manny and Pam each buy <b>5</b> apples. Then Pam buys <b>2 more</b>. How many apples do they have in all?',a:5,b:7,f:'🍎',u:'apples',n:['Manny','Pam']},
    {t:'Pip and Pop each pick <b>6</b> strawberries. Then Pop picks <b>1 more</b>. How many strawberries in all?',a:6,b:7,f:'🍓',u:'strawberries',n:['Pip','Pop']},
    {m:true,a:8,sum:17,ans:9,opts:[8,9,7],t:'Use a doubles fact to find the missing number.'},
    {t:'Max has <b>4</b> blue marbles. Tom has <b>2 more</b> marbles than Max. How many marbles do they have in all?',a:4,b:6,f:'🔵',f2:'🔴',u:'marbles',n:['Max','Tom']},
    {t:'Ana and Omar each bake <b>3</b> cupcakes. Then Omar bakes <b>1 more</b>. How many cupcakes in all?',a:3,b:4,f:'🧁',u:'cupcakes',n:['Ana','Omar']},
    {m:true,a:6,sum:13,ans:7,opts:[6,7,8],t:'Use a doubles fact to find the missing number.'},
    {t:'Two bunnies each eat <b>9</b> carrots. Then one bunny eats <b>1 more</b>. How many carrots in all?',a:9,b:10,f:'🥕',u:'carrots',n:['Bunny 1','Bunny 2']},
    {t:'Nora picks <b>8</b> lemons. Zaid picks <b>1 more</b> lemon than Nora. How many lemons do they have in all?',a:8,b:9,f:'🍋',u:'lemons',n:['Nora','Zaid']},
    {m:true,a:5,sum:11,ans:6,opts:[5,6,4],t:'Use a doubles fact to find the missing number.'}
  ];
  let qi=0,score=0;
  function render(){
    if(qi>=Q.length){setSub('g2',99);P.innerHTML=`<div class="done-card card"><div class="row" style="justify-content:center">${PIP()}${CHICK()}${POP()}</div><h2 class="h2">Fruit Stand superstar!</h2><div class="stars">${'⭐'.repeat(Math.max(1,Math.round(score/2)))}</div><p class="sub">First try: ${score} of ${Q.length}. You can use doubles to solve doubles-plus facts!</p><button class="big-btn ghost" id="hA">Play again</button></div>`;$('#hA').onclick=()=>{qi=0;score=0;render();};celebrate(true);return;}
    setSub('g2',qi);const q=Q[qi];let miss=false;
    const head=`<div class="row"><h2 class="h2 grow">Game 2: Fruit Stand Stories</h2><div class="prog">${Q.map((_,k)=>`<i class="${k<qi?'done':k===qi?'on':''}">${k+1}</i>`).join('')}</div></div>`;
    if(q.m){ // missing addend
      P.innerHTML=head+`<div class="steps"><span class="on">Drag the missing number</span></div>
      <div class="card grow" style="display:flex;flex-direction:column;justify-content:space-around;padding:14px;gap:10px">
        <div class="row" style="flex-wrap:nowrap">${PIP()}<div class="bubble say grow">${q.t} <button class="chip" id="hint">💡 Hint</button><div id="hintT" class="mini" style="margin-top:6px" hidden>${q.a} + ${q.a} = ${2*q.a}. ${q.sum} is ${q.sum-2*q.a} more than ${2*q.a}. So add ${q.a} + ${q.sum-2*q.a}…</div></div></div>
        <div class="eq">${q.a} + <span class="slot" data-k="0">?</span> = ${q.sum}</div>
        <div class="tiles" id="tiles">${shuffle(q.opts).map(o=>`<div class="tile" data-v="${o}">${o}</div>`).join('')}</div>
        <div class="row" style="justify-content:center"><button class="big-btn green" id="chk">Check</button></div>
        <div class="feedback" id="hF"></div></div>`;
      $('#hint').onclick=()=>{$('#hintT').hidden=false;pop();};
      dnd();
      $('#chk').onclick=()=>{const sl=P.querySelector('.slot');const v=sl.dataset.v;if(v===undefined){$('#hF').className='feedback bad';$('#hF').textContent='Drag a number into the box first.';return;}
        if(+v===q.ans){sl.classList.add('good');$('#hF').className='feedback good';$('#hF').textContent=`Yes! ${q.a} + ${q.ans} = ${q.sum}`;if(!miss)score++;celebrate();setTimeout(()=>{qi++;render();},2000);}
        else{miss=true;sl.classList.add('bad');setTimeout(()=>{sl.classList.remove('bad','filled');sl.textContent='?';delete sl.dataset.v;},600);$('#hF').className='feedback bad';$('#hF').textContent=`${q.a} + ${v} = ${q.a+ +v}. Try again!`;tryAgain();}};
      return;}
    const tot=q.a+q.b,e=q.b-q.a;
    const grp=(name,n,extra,f)=>`<div class="group"><span class="who">${name}</span>${Array.from({length:n},(_,i)=>`<span class="${i>=n-extra?'extra':''}">${f}</span>`).join('')}</div>`;
    const addN=shuffle([q.a,q.b,q.b+1]),ansN=shuffle([tot,tot-1,tot+1]);
    P.innerHTML=head+`<div class="steps" id="hS"><span class="on">1 · Read & look</span><span>2 · Build the equation</span><span>3 · Answer</span></div>
      <div class="card grow" style="display:flex;flex-direction:column;justify-content:space-between;padding:14px;gap:8px">
        <div class="story">${POP()}<div class="txt grow">${q.t}</div></div>
        <div class="groups">${grp(q.n[0],q.a,0,q.f)}${grp(q.n[1],q.b,e,q.f2||q.f)}</div>
        <div class="eq" style="font-size:clamp(30px,4vw,56px)"><span class="slot" data-k="0">?</span><span class="slot op" data-k="op">○</span><span class="slot" data-k="1">?</span> = <span class="slot" data-k="2">?</span></div>
        <div class="row" style="justify-content:center;gap:22px"><div style="text-align:center"><div class="mini">Numbers</div><div class="tiles">${addN.map(o=>`<div class="tile" data-v="${o}">${o}</div>`).join('')}</div></div><div style="text-align:center"><div class="mini">Sign</div><div class="tiles"><div class="tile op" data-v="+">+</div><div class="tile op" data-v="−">−</div></div></div><div style="text-align:center"><div class="mini">Answer</div><div class="tiles">${ansN.map(o=>`<div class="tile" data-v="${o}" style="background:#ffd9e0;box-shadow:0 5px 0 #f0a3b2">${o}</div>`).join('')}</div></div></div>
        <div class="row" style="justify-content:center"><button class="chip" id="hint">💡 Doubles hint</button><button class="big-btn green" id="chk">Check</button></div>
        <div class="feedback" id="hF"><span id="hintT" hidden style="color:var(--plum)">Think: ${q.a} + ${q.a} = ${2*q.a}, and ${e} more.</span></div></div>`;
    $('#hint').onclick=()=>{$('#hintT').hidden=false;pop();};
    dnd(()=>{const s=$('#hS').children;s[0].className='ok';s[1].className='on';});
    $('#chk').onclick=()=>{const sl=[...P.querySelectorAll('.slot')];const g=k=>P.querySelector(`.slot[data-k="${k}"]`).dataset.v;
      if(sl.some(s=>s.dataset.v===undefined)){$('#hF').className='feedback bad';$('#hF').textContent='Fill every box with a tile.';return;}
      const n1=+g(0),n2=+g(1),op=g('op'),r=+g(2);
      const okAdd=((n1===q.a&&n2===q.b)||(n1===q.b&&n2===q.a)),ok=okAdd&&op==='+'&&r===tot;
      if(ok){sl.forEach(s=>s.classList.add('good'));const s=$('#hS').children;s[1].className='ok';s[2].className='ok';$('#hF').className='feedback good';$('#hF').innerHTML=`${q.a} + ${q.b} = ${tot} → <b>${tot} ${q.u}</b>! (${2*q.a} and ${e} more)`;if(!miss)score++;celebrate();setTimeout(()=>{qi++;render();},2600);}
      else{miss=true;const bad=[];if(!okAdd){bad.push('0','1');}if(op!=='+')bad.push('op');if(r!==tot)bad.push('2');bad.forEach(k=>{const s=P.querySelector(`.slot[data-k="${k}"]`);s.classList.add('bad');setTimeout(()=>{s.classList.remove('bad','filled');s.textContent=k==='op'?'○':'?';delete s.dataset.v;},700);});
        $('#hF').className='feedback bad';$('#hF').textContent=op!=='+'?'We put the fruit together. Use +.':!okAdd?`Count each group: ${q.n[0]} and ${q.n[1]}.`:`Try the double: ${q.a} + ${q.a} = ${2*q.a}, then ${e} more.`;tryAgain();}};
  }
  /* drag & drop + tap-to-place */
  function dnd(onFirst){let sel=null,first=false;const fire=()=>{if(!first&&onFirst){first=true;onFirst();}};
    const place=(slot,v)=>{const isOp=slot.dataset.k==='op',tOp=(v==='+'||v==='−');if(isOp!==tOp){slot.classList.add('bad');setTimeout(()=>slot.classList.remove('bad'),400);oops();return;}slot.textContent=v;slot.dataset.v=v;slot.classList.add('filled');pop();fire();};
    P.querySelectorAll('.slot').forEach(s=>s.addEventListener('click',()=>{if(sel){place(s,sel.dataset.v);sel.classList.remove('sel');sel=null;}}));
    P.querySelectorAll('.tile').forEach(t=>{
      t.addEventListener('pointerdown',e=>{if(tool!=='pointer')return;e.preventDefault();const r=t.getBoundingClientRect();const g=t.cloneNode(true);g.classList.add('drag');g.style.left=r.left+'px';g.style.top=r.top+'px';document.body.appendChild(g);const ox=e.clientX-r.left,oy=e.clientY-r.top;let moved=false;const sx=e.clientX,sy=e.clientY;
        const mv=ev=>{if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>6)moved=true;g.style.left=(ev.clientX-ox)+'px';g.style.top=(ev.clientY-oy)+'px';};
        const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);g.remove();
          if(!moved){if(sel)sel.classList.remove('sel');sel=(sel===t)?null:t;if(sel)sel.classList.add('sel');return;}
          const tgt=document.elementFromPoint(ev.clientX,ev.clientY);const slot=tgt&&tgt.closest('.slot');if(slot&&P.contains(slot))place(slot,t.dataset.v);};
        addEventListener('pointermove',mv);addEventListener('pointerup',up);});});}
  render();})();

/* start */
let start='book';try{const s=localStorage.getItem('dp-tab');if(s&&$('#p-'+s))start=s;}catch(e){}
showTab(start);
})();
</script>
