<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Quest: Topics 4 & 5</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Shared template: colors, fonts, sounds, buttons, mascots. Keep this. -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/theme.js" defer></script>
<style>
:root{
  --sky1:#bdeaff; --sky2:#e9fbff; --grass:#7ccf5b; --grass2:#5bb441;
  --ink:#24324a; --card:#ffffff; --orange:#ff9f1c; --pink:#ff5d8f; --purple:#8e5cf7;
  --blue:#2e9bff; --green:#2fbf71; --red:#ff4d4d; --yellow:#ffd23f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,#fffbe6);
  min-height:100vh;overflow-x:hidden;user-select:none}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;font-size:70px;opacity:.85;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-weight:700;font-size:26px;color:#1f5fbf;text-shadow:0 2px 0 #fff}
.brand small{display:block;font-size:14px;color:#5a6b85;font-weight:500;text-shadow:none}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:20px;box-shadow:0 4px 0 #d6e6f5}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:18px;padding:12px 22px;font-size:20px;
  background:var(--blue);color:#fff;box-shadow:0 6px 0 #1b6fc0;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1b6fc0}
.btn.green{background:var(--green);box-shadow:0 6px 0 #1f8a51}
.btn.orange{background:var(--orange);box-shadow:0 6px 0 #c97300}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 #cfdcea}
.btn.small{font-size:16px;padding:8px 14px;border-radius:14px}

/* MAP */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:8px}
.island{position:relative;background:var(--card);border-radius:26px;padding:16px 14px 14px;text-align:center;cursor:pointer;
  box-shadow:0 8px 0 rgba(0,0,0,.08);border:4px solid transparent;transition:transform .15s}
.island:hover{transform:translateY(-4px) rotate(-1deg)}
.island .ico{font-size:54px;line-height:1.1}
.island h3{margin:6px 0 2px;font-size:21px}
.island p{margin:0;font-size:15px;color:#5a6b85}
.island .stars{font-size:24px;margin-top:6px;letter-spacing:2px}
.island .tag{position:absolute;top:10px;left:12px;font-size:13px;font-weight:700;color:#fff;border-radius:10px;padding:2px 8px}
.island.done{border-color:var(--green)}
.hero{display:flex;align-items:center;gap:16px;background:#fff;border-radius:26px;padding:14px 18px;box-shadow:0 8px 0 rgba(0,0,0,.06)}
.hero .big{font-size:64px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hero h1{margin:0;font-size:30px}
.hero p{margin:4px 0 0;font-size:18px;color:#5a6b85}

/* PLAY */
.stage{background:var(--card);border-radius:30px;padding:18px 18px 22px;box-shadow:0 10px 0 rgba(0,0,0,.07);position:relative;min-height:440px}
.stagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lvltitle{font-size:24px;font-weight:700}
.progress{flex:1;min-width:140px;height:18px;background:#eef3f9;border-radius:999px;overflow:hidden;margin:0 6px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .4s}
.qtext{font-size:30px;font-weight:600;text-align:center;margin:18px 6px 10px;line-height:1.35}
.eq{font-size:52px;font-weight:700;text-align:center;letter-spacing:2px;margin:6px 0 4px}
.box{display:inline-block;min-width:66px;height:62px;border:4px dashed #8aa3c2;border-radius:16px;vertical-align:middle;line-height:54px;color:var(--purple);background:#f6f9ff}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:20px}
.choice{min-width:120px;font-size:40px;font-weight:700;padding:14px 22px;border-radius:24px;border:none;cursor:pointer;font-family:inherit;color:#fff;
  box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .1s}
.choice:active{transform:translateY(4px)}
.choice.wide{font-size:30px}
.c0{background:var(--pink)} .c1{background:var(--purple)} .c2{background:var(--blue)} .c3{background:var(--orange)} .c4{background:var(--green)} .c5{background:#14b8a6}
.choice.wrong{animation:shake .4s;opacity:.35;pointer-events:none}
.choice.right{background:var(--green)!important;transform:scale(1.12)}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.balloon{width:120px;height:146px;border-radius:50% 50% 48% 48%;position:relative;font-size:38px;padding:0;display:flex;align-items:center;justify-content:center;
  animation:float 3s ease-in-out infinite}
.balloon:after{content:"";position:absolute;bottom:-22px;left:50%;width:2px;height:24px;background:#888}
.balloon:nth-child(2){animation-delay:.5s}.balloon:nth-child(3){animation-delay:1s}
@keyframes float{50%{transform:translateY(-12px)}}
.balloon.pop{animation:pop .35s forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.feedback{text-align:center;font-size:28px;font-weight:700;min-height:42px;margin-top:16px}
.feedback.good{color:var(--green)} .feedback.bad{color:var(--red)}
.hint{text-align:center;font-size:20px;color:#6b5a00;background:#fff6c7;border-radius:14px;padding:8px 12px;margin:10px auto 0;max-width:640px;display:none}
.mascot{position:absolute;right:16px;bottom:12px;font-size:56px;transition:transform .3s}
.mascot.happy{animation:jump .6s}
@keyframes jump{40%{transform:translateY(-30px) rotate(-10deg)}}

/* number line */
.nlwrap{overflow-x:auto;padding:6px 0}
.nl{position:relative;height:150px;min-width:760px;margin:0 auto}
.nl .line{position:absolute;left:20px;right:20px;top:104px;height:6px;background:#2f8f3a;border-radius:3px}
.nl .tick{position:absolute;top:96px;width:4px;height:22px;background:#2f8f3a;border-radius:2px;transform:translateX(-2px)}
.nl .lab{position:absolute;top:124px;font-size:20px;font-weight:700;transform:translateX(-50%)}
.nl .frog{position:absolute;top:44px;font-size:48px;transform:translateX(-50%);transition:left .45s cubic-bezier(.3,1.6,.5,1)}
.nl svg{position:absolute;left:0;top:0;pointer-events:none}
.hopbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.hopcount{font-size:22px;font-weight:700;align-self:center}

/* fact family */
.counters{text-align:center;font-size:34px;letter-spacing:4px;margin:8px 0}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:16px}
.fcard{font-size:30px;font-weight:700;background:#fff;border:4px solid #c9d7ea;border-radius:20px;padding:12px 18px;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:0 5px 0 #c9d7ea}
.fcard.sel{border-color:var(--green);background:#e7fbef;box-shadow:0 5px 0 var(--green)}
.fcard.bad{animation:shake .4s;border-color:var(--red)}
.house{width:260px;margin:4px auto 0;position:relative}
.roof{width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-bottom:90px solid #ff7a59;margin:0 auto;position:relative}
.roof span{position:absolute;top:34px;left:-60px;width:120px;text-align:center;font-size:30px;font-weight:700;color:#fff}
.tri{display:block;margin:0 auto}
/* ppw */
.ppw{margin:10px auto;border-collapse:collapse;font-size:40px;font-weight:700;text-align:center}
.ppw td{border:5px solid var(--blue);width:130px;height:78px;background:#fff}
.ppw td.whole{background:#dff0ff}
/* add three */
.three{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.num{font-size:52px;font-weight:700;width:96px;height:96px;border-radius:50%;background:#fff3c4;border:5px solid var(--yellow);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;color:var(--ink)}
.num.sel{background:var(--green);border-color:#1f8a51;color:#fff;transform:scale(1.08)}
.plus{font-size:44px;font-weight:700}
.fruits{font-size:46px;text-align:center;letter-spacing:3px;line-height:1.3}
.story{font-size:28px;line-height:1.5;text-align:center;background:#f3f9ff;border-radius:20px;padding:14px 18px;margin:12px auto 0;max-width:760px}
.story b{color:var(--purple)}

/* end of level */
.overlay{position:fixed;inset:0;background:rgba(20,40,70,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:#fff;border-radius:30px;padding:26px 26px 22px;text-align:center;max-width:460px;width:100%;animation:popin .35s}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.modal .bigstars{font-size:58px;letter-spacing:6px}
.modal h2{margin:6px 0;font-size:32px}
.modal p{font-size:20px;color:#5a6b85;margin:6px 0 16px}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hidden{display:none!important}
@media (max-width:600px){
  .qtext{font-size:23px}.eq{font-size:40px}.choice{min-width:90px;font-size:32px}.balloon{width:96px;height:118px}
  .story{font-size:22px}.brand{font-size:21px}.mascot{font-size:40px}
}
</style>
</head>
<body>
<div class="clouds" id="clouds"></div>
<div id="app">
  <div class="top">
    <div class="brand">⭐ Math Quest <small>Grade 1 · Topics 4 &amp; 5</small></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn ghost small" id="soundBtn">🔊</button>
      <div class="pill" id="totalStars">⭐ 0</div>
    </div>
  </div>

  <!-- MAP -->
  <div id="mapView">
    <div class="hero">
      <div class="big">🐸</div>
      <div>
        <h1>Hi, Math Explorer!</h1>
        <p>Pick an island and win stars. Can you get ⭐⭐⭐ on every island?</p>
      </div>
    </div>
    <div class="map" id="map"></div>
  </div>

  <!-- PLAY -->
  <div id="playView" class="hidden">
    <div class="stage">
      <div class="stagehead">
        <button class="btn ghost small" id="homeBtn">🏠 Map</button>
        <div class="lvltitle" id="lvlTitle"></div>
        <div class="progress"><div id="prog" style="width:0%"></div></div>
        <div class="pill" id="qCount">1/5</div>
      </div>
      <div id="qArea"></div>
      <div class="hint" id="hint"></div>
      <div class="feedback" id="fb"></div>
      <div class="mascot" id="mascot">🐸</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="bigstars" id="mStars">⭐⭐⭐</div>
    <h2 id="mTitle">Amazing!</h2>
    <p id="mText"></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn ghost" id="mAgain">🔁 Play again</button>
      <button class="btn green" id="mNext">Next ➜</button>
    </div>
  </div>
</div>

<script>
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function opts(ans, extra = [], n = 3) {
  const set = new Set([ans]);
  extra.forEach(e => { if (set.size < n && e >= 0 && e !== ans) set.add(e); });
  const d = [1, -1, 2, -2, 3, 10, -10];
  for (const k of d) { if (set.size >= n) break; const v = ans + k; if (v >= 0) set.add(v); }
  return shuffle([...set]);
}
const praise = ['Great job! 🎉', 'Super! ⭐', 'You got it! 🙌', 'Awesome! 🚀', 'Fantastic! 🌈', 'Wow, smart! 🧠', 'Yes! Well done! 👏'];
const tryMsg = ['Try again! 💪', 'Almost! Try again 🙂', 'Keep going, you can do it! 🌟'];
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------------- sound ---------------- */
let soundOn = true, actx = null;
function tone(freqs, dur = .12, type = 'triangle', vol = .18) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * .85;
    });
  } catch (e) {}
}
const sGood = () => tone([523, 659, 784], .13);
const sBad = () => tone([300, 220], .16, 'sawtooth', .08);
const sHop = () => tone([440, 660], .07, 'square', .06);
const sWin = () => tone([523, 659, 784, 1046, 784, 1046], .14);
$('#soundBtn').onclick = () => { soundOn = !soundOn; $('#soundBtn').textContent = soundOn ? '🔊' : '🔇'; };

/* ---------------- clouds ---------------- */
(function () {
  const c = $('#clouds');
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('div'); d.className = 'cloud'; d.textContent = '☁️';
    d.style.top = (5 + i * 18) + '%'; d.style.animationDuration = (40 + i * 12) + 's'; d.style.animationDelay = (-i * 11) + 's';
    c.appendChild(d);
  }
})();

/* ---------------- levels ---------------- */
const LEVELS = [
  { id: 'frog', ico: '🐸', name: 'Frog Hops', sub: 'Count back to subtract', tag: '4-1', color: '#ff9f1c', mascot: '🐸',
    qs: [[14, 5], [12, 3], [17, 8], [15, 6]].map(([a, b]) => ({ type: 'hop', a, b })) },
  { id: 'balloon', ico: '🎈', name: 'Balloon Pop', sub: 'Subtract and add', tag: '4-1', color: '#ff5d8f', mascot: '🎈',
    qs: [['15 − 9', 6, [5, 7]], ['13 − 7', 6, [5, 7]], ['11 − 8', 3, [4, 2]], ['12 + 5', 17, [16, 18]], ['16 + 3', 19, [18, 20]], ['9 + 6', 15, [14, 16]]]
      .map(([e, ans, ex]) => ({ type: 'balloon', e, ans, ex })) },
  { id: 'family', ico: '🏠', name: 'Fact Family House', sub: 'Same 3 numbers', tag: '4-4', color: '#8e5cf7', mascot: '🏠',
    qs: [
      { type: 'family', nums: [7, 6, 13], red: 7, yellow: 6, good: ['7 + 6 = 13', '6 + 7 = 13', '13 − 7 = 6', '13 − 6 = 7'], bad: ['13 + 6 = 19', '7 − 6 = 1'] },
      { type: 'tri', top: 16, l: 9, r: null, ans: 7 },
      { type: 'tri', top: null, l: 5, r: 8, ans: 13 },
      { type: 'tri', top: 12, l: null, r: 6, ans: 6 },
      { type: 'odd', nums: '5, 9, 14', items: ['5 + 9 = 14', '14 − 9 = 5', '9 − 5 = 4'], ans: '9 − 5 = 4' }
    ] },
  { id: 'detective', ico: '🕵️', name: 'Number Detective', sub: 'Find the missing number', tag: '5-1', color: '#2e9bff', mascot: '🕵️',
    qs: [['8 + ', ' = 12', 4], ['15 − ', ' = 9', 6], ['', ' − 6 = 8', 14], ['', ' + 7 = 13', 6], ['9 + ', ' = 17', 8]]
      .map(([pre, post, ans]) => ({ type: 'missing', pre, post, ans })) },
  { id: 'ppw', ico: '🧩', name: 'Part-Part-Whole', sub: 'Find the missing part', tag: '5-1', color: '#14b8a6', mascot: '🧩',
    qs: [{ w: 16, p: 9, q: null, ans: 7 }, { w: 11, p: null, q: 4, ans: 7 }, { w: null, p: 6, q: 7, ans: 13 }, { w: 14, p: 8, q: null, ans: 6 }]
      .map(o => Object.assign({ type: 'ppw' }, o)) },
  { id: 'three', ico: '🍓', name: 'Add Three Numbers', sub: 'Make 10 or a double first', tag: '5-4', color: '#2fbf71', mascot: '🍓',
    qs: [[3, 7, 6], [5, 5, 8], [2, 9, 8], [4, 4, 7]].map(n => ({ type: 'three', n }))
      .concat([{ type: 'fruit' }]) },
  { id: 'words', ico: '📖', name: 'Story Problems', sub: 'Read and solve', tag: 'Boss', color: '#ef4444', mascot: '🦉',
    qs: [
      { type: 'word', text: 'Sara has <b>15</b> balloons 🎈. <b>6</b> balloons fly away. How many balloons does Sara have now?', ans: 9, ex: [21, 8], line: true },
      { type: 'word', text: 'There are <b>8</b> cats 🐱 and <b>7</b> dogs 🐶 at the pet shop. How many pets are there in all?', ans: 15, ex: [1, 14] },
      { type: 'word', text: 'Lina had some stickers ⭐. Her teacher gave her <b>6</b> more. Now Lina has <b>13</b> stickers. How many stickers did Lina have at first?', ans: 7, ex: [19, 6] },
      { type: 'word', text: 'Yusuf picks <b>3</b> strawberries 🍓. Mona picks <b>7</b>. Ali picks <b>5</b>. How many strawberries do they pick in all?', ans: 15, ex: [10, 14] }
    ] }
];

let starsWon = {};
try { starsWon = JSON.parse(localStorage.getItem('mq45_stars') || '{}'); } catch (e) {}
function saveStars() { try { localStorage.setItem('mq45_stars', JSON.stringify(starsWon)); } catch (e) {} }

function renderMap() {
  const m = $('#map'); m.innerHTML = '';
  let total = 0;
  LEVELS.forEach((L, i) => {
    const s = starsWon[L.id] || 0; total += s;
    const d = document.createElement('div');
    d.className = 'island' + (s ? ' done' : '');
    d.innerHTML = `<span class="tag" style="background:${L.color}">${L.tag}</span>
      <div class="ico">${L.ico}</div><h3>${i + 1}. ${L.name}</h3><p>${L.sub}</p>
      <div class="stars">${'⭐'.repeat(s)}${'<span style="opacity:.25">⭐</span>'.repeat(3 - s)}</div>`;
    d.onclick = () => startLevel(i);
    m.appendChild(d);
  });
  $('#totalStars').textContent = '⭐ ' + total + ' / ' + LEVELS.length * 3;
}

/* ---------------- play engine ---------------- */
let cur = 0, qi = 0, mistakes = 0, qMiss = 0, locked = false;
function startLevel(i) {
  cur = i; qi = 0; mistakes = 0;
  $('#mapView').classList.add('hidden'); $('#playView').classList.remove('hidden');
  $('#lvlTitle').textContent = LEVELS[i].ico + ' ' + LEVELS[i].name;
  $('#mascot').textContent = LEVELS[i].mascot;
  showQ();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goHome() { $('#playView').classList.add('hidden'); $('#mapView').classList.remove('hidden'); renderMap(); }
$('#homeBtn').onclick = goHome;

function setProgress() {
  const L = LEVELS[cur];
  $('#prog').style.width = (qi / L.qs.length * 100) + '%';
  $('#qCount').textContent = Math.min(qi + 1, L.qs.length) + '/' + L.qs.length;
}
function showQ() {
  locked = false; qMiss = 0;
  setProgress();
  $('#fb').textContent = ''; $('#fb').className = 'feedback';
  $('#hint').style.display = 'none';
  const q = LEVELS[cur].qs[qi];
  const A = $('#qArea'); A.innerHTML = '';
  RENDER[q.type](q, A);
}
function correct() {
  if (locked) return; locked = true;
  sGood();
  $('#fb').textContent = pick(praise); $('#fb').className = 'feedback good';
  const m = $('#mascot'); m.classList.remove('happy'); void m.offsetWidth; m.classList.add('happy');
  burst(14);
  setTimeout(() => { qi++; if (qi >= LEVELS[cur].qs.length) endLevel(); else showQ(); }, 1300);
}
function wrong(hint) {
  sBad(); mistakes++; qMiss++;
  $('#fb').textContent = pick(tryMsg); $('#fb').className = 'feedback bad';
  if (qMiss >= 2 && hint) { $('#hint').textContent = '💡 ' + hint; $('#hint').style.display = 'block'; }
}
function endLevel() {
  $('#prog').style.width = '100%';
  const s = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
  starsWon[LEVELS[cur].id] = Math.max(starsWon[LEVELS[cur].id] || 0, s); saveStars();
  sWin(); burst(70);
  const last = cur === LEVELS.length - 1;
  const allDone = LEVELS.every(L => starsWon[L.id]);
  $('#mStars').innerHTML = '⭐'.repeat(s) + '<span style="opacity:.25">⭐</span>'.repeat(3 - s);
  $('#mTitle').textContent = s === 3 ? 'Perfect! 🏆' : s === 2 ? 'Great work! 🎉' : 'Well done! 👍';
  $('#mText').textContent = allDone && last ? 'You finished every island! You are a Super Mathematician! 🦸' :
    (mistakes === 0 ? 'No mistakes at all!' : 'Play again to win more stars!');
  $('#mNext').textContent = last ? '🏠 Map' : 'Next island ➜';
  $('#overlay').style.display = 'flex';
}
$('#mAgain').onclick = () => { $('#overlay').style.display = 'none'; startLevel(cur); };
$('#mNext').onclick = () => { $('#overlay').style.display = 'none'; if (cur < LEVELS.length - 1) startLevel(cur + 1); else goHome(); };

function choiceRow(values, ans, A, hint, opt = {}) {
  const row = document.createElement('div'); row.className = 'choices';
  values.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = (opt.balloon ? 'choice balloon ' : 'choice ') + 'c' + (i % 6) + (opt.wide ? ' wide' : '');
    b.textContent = v;
    b.onclick = () => {
      if (locked) return;
      if (v === ans) { b.classList.add(opt.balloon ? 'pop' : 'right'); correct(); }
      else { b.classList.add('wrong'); wrong(hint); }
    };
    row.appendChild(b);
  });
  A.appendChild(row);
  return row;
}
function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild || d; }

/* number line builder */
function numberLine(A, start, onReady) {
  const wrap = el('<div class="nlwrap"><div class="nl"></div></div>'); A.appendChild(wrap);
  const nl = wrap.firstChild;
  nl.innerHTML = '<div class="line"></div><svg width="100%" height="110"></svg>';
  const W = () => nl.clientWidth - 40;
  const xOf = v => 20 + v / 20 * W();
  for (let v = 0; v <= 20; v++) {
    const t = document.createElement('div'); t.className = 'tick'; t.style.left = xOf(v) + 'px'; nl.appendChild(t);
    const l = document.createElement('div'); l.className = 'lab'; l.textContent = v; l.style.left = xOf(v) + 'px'; nl.appendChild(l);
  }
  const frog = document.createElement('div'); frog.className = 'frog'; frog.textContent = '🐸'; nl.appendChild(frog);
  if (start == null) frog.style.display = 'none'; else frog.style.left = xOf(start) + 'px';
  const svg = nl.querySelector('svg');
  return {
    move(from, to) {
      frog.style.left = xOf(to) + 'px';
      const x1 = xOf(from), x2 = xOf(to), mx = (x1 + x2) / 2;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M${x1},100 Q${mx},40 ${x2},100`); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#ff7a00'); p.setAttribute('stroke-width', '4');
      svg.appendChild(p);
    }
  };
}

/* ---------------- renderers ---------------- */
const RENDER = {
  hop(q, A) {
    A.appendChild(el(`<div class="qtext">Help the frog count back! Start at <b>${q.a}</b> and hop back <b>${q.b}</b>.</div>`));
    A.appendChild(el(`<div class="eq">${q.a} − ${q.b} = <span class="box">?</span></div>`));
    let pos = q.a, hops = 0;
    const NL = numberLine(A, q.a);
    const bar = el(`<div class="hopbar"><button class="btn orange" id="hopB">🐸 Hop back</button><div class="hopcount" id="hc">Hops: 0</div></div>`);
    A.appendChild(bar);
    const ask = el('<div></div>'); A.appendChild(ask);
    $('#hopB').onclick = () => {
      if (hops >= q.b) return;
      NL.move(pos, pos - 1); pos--; hops++; sHop();
      $('#hc').textContent = 'Hops: ' + hops;
      if (hops === q.b) {
        $('#hopB').disabled = true; $('#hopB').style.opacity = .5;
        ask.appendChild(el('<div class="qtext" style="font-size:26px">Where did the frog land?</div>'));
        choiceRow(opts(q.a - q.b, [q.a - q.b + 1, q.a + q.b]), q.a - q.b, ask, 'Look at the number under the frog.');
      }
    };
  },
  balloon(q, A) {
    A.appendChild(el('<div class="qtext">Pop the balloon with the right answer! 🎈</div>'));
    A.appendChild(el(`<div class="eq">${q.e} = <span class="box">?</span></div>`));
    const hint = q.e.includes('−') ? 'Start at the small number and count on to the big number.' : 'Start at the big number and count on.';
    choiceRow(opts(q.ans, q.ex), q.ans, A, hint, { balloon: true });
  },
  family(q, A) {
    A.appendChild(el(`<div class="qtext">Tap the <b>4 facts</b> that live in this Fact Family House!</div>`));
    A.appendChild(el(`<div class="house"><div class="roof"><span>${q.nums.join(', ')}</span></div></div>`));
    A.appendChild(el(`<div class="counters">${'🔴'.repeat(q.red)}${'🟡'.repeat(q.yellow)}</div>`));
    const cards = el('<div class="cards"></div>'); A.appendChild(cards);
    let found = 0;
    shuffle(q.good.concat(q.bad)).forEach(f => {
      const b = document.createElement('button'); b.className = 'fcard'; b.textContent = f;
      b.onclick = () => {
        if (locked || b.classList.contains('sel')) return;
        if (q.good.includes(f)) { b.classList.add('sel'); sHop(); found++; if (found === 4) correct(); }
        else { b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); wrong('A fact family uses only these 3 numbers: ' + q.nums.join(', ') + '.'); }
      };
      cards.appendChild(b);
    });
  },
  tri(q, A) {
    A.appendChild(el('<div class="qtext">Find the missing number in the fact family triangle! 🔺</div>'));
    const t = v => v == null ? '?' : v;
    A.appendChild(el(`<svg class="tri" width="260" height="220" viewBox="0 0 260 220">
      <polygon points="130,10 250,205 10,205" fill="#e8f7e9" stroke="#2f8f3a" stroke-width="6" stroke-linejoin="round"/>
      <text x="130" y="88" font-size="40" font-weight="700" text-anchor="middle" fill="${q.top == null ? '#8e5cf7' : '#24324a'}">${t(q.top)}</text>
      <text x="62" y="186" font-size="40" font-weight="700" text-anchor="middle" fill="${q.l == null ? '#8e5cf7' : '#24324a'}">${t(q.l)}</text>
      <text x="198" y="186" font-size="40" font-weight="700" text-anchor="middle" fill="${q.r == null ? '#8e5cf7' : '#24324a'}">${t(q.r)}</text></svg>`));
    const hint = q.top == null ? 'The top number is the whole. Add the two bottom numbers.' : 'Subtract: top number minus the number you know.';
    choiceRow(opts(q.ans, [q.ans + 1, q.ans - 1]), q.ans, A, hint);
  },
  odd(q, A) {
    A.appendChild(el(`<div class="qtext">Which fact does <u>NOT</u> belong to the fact family of <b>${q.nums}</b>? 🤔</div>`));
    choiceRow(shuffle(q.items), q.ans, A, 'Check each fact: does it use only 5, 9 and 14?', { wide: true });
  },
  missing(q, A) {
    A.appendChild(el('<div class="qtext">🔍 Be a number detective! Find the missing number.</div>'));
    A.appendChild(el(`<div class="eq">${q.pre}<span class="box">?</span>${q.post}</div>`));
    const hint = q.pre === '' && q.post.includes('−') ? 'Think addition: the missing number is the whole.' : 'Count on from the number you know.';
    choiceRow(opts(q.ans, [q.ans + 2, q.ans - 2]), q.ans, A, hint);
  },
  ppw(q, A) {
    A.appendChild(el('<div class="qtext">🧩 Complete the part-part-whole model!</div>'));
    const c = v => v == null ? '<span style="color:#8e5cf7">?</span>' : v;
    A.appendChild(el(`<table class="ppw"><tr><td colspan="2" class="whole">${c(q.w)}</td></tr><tr><td>${c(q.p)}</td><td>${c(q.q)}</td></tr></table>`));
    const hint = q.w == null ? 'Part + part = whole.' : 'Whole − part = the other part.';
    choiceRow(opts(q.ans, [q.ans + 1, q.ans + 2]), q.ans, A, hint);
  },
  three(q, A) {
    A.appendChild(el('<div class="qtext">Tap the <b>two numbers</b> you want to add first. Look for a 10 or a double!</div>'));
    const row = el('<div class="three"></div>'); A.appendChild(row);
    const sel = [];
    const step = el('<div></div>'); A.appendChild(step);
    q.n.forEach((v, i) => {
      if (i) row.appendChild(el('<span class="plus">+</span>'));
      const b = document.createElement('button'); b.className = 'num'; b.textContent = v;
      b.onclick = () => {
        if (sel.length >= 2 || b.classList.contains('sel')) return;
        b.classList.add('sel'); sel.push(i); sHop();
        if (sel.length === 2) {
          const s1 = q.n[sel[0]] + q.n[sel[1]];
          const rest = q.n[[0, 1, 2].find(k => !sel.includes(k))];
          step.appendChild(el(`<div class="qtext" style="font-size:26px">${q.n[sel[0]]} + ${q.n[sel[1]]} = ?</div>`));
          const r1 = choiceRow(opts(s1, [s1 + 1, s1 - 1]), s1, step, 'Count on from the bigger number.');
          // override: first step does not finish the question
          [...r1.children].forEach(btn => {
            const val = +btn.textContent;
            btn.onclick = () => {
              if (val === s1) {
                sGood(); btn.classList.add('right'); [...r1.children].forEach(x => x.style.pointerEvents = 'none');
                $('#fb').textContent = 'Now add the last number!'; $('#fb').className = 'feedback good';
                const total = s1 + rest;
                step.appendChild(el(`<div class="qtext" style="font-size:26px">${s1} + ${rest} = ?</div>`));
                choiceRow(opts(total, [total + 1, total - 1]), total, step, 'Start at ' + s1 + ' and count on ' + rest + '.');
              } else { btn.classList.add('wrong'); wrong('Count on from the bigger number.'); }
            };
          });
        }
      };
      row.appendChild(b);
    });
  },
  fruit(q, A) {
    A.appendChild(el('<div class="qtext">How many fruits are there in all? 🍓🍌🍇</div>'));
    A.appendChild(el('<div class="fruits">🍓🍓🍓🍓🍓<br>🍌🍌🍌<br>🍇🍇🍇🍇🍇</div>'));
    A.appendChild(el('<div class="eq" style="font-size:40px">5 + 3 + 5 = <span class="box">?</span></div>'));
    choiceRow(opts(13, [12, 14]), 13, A, 'Find the double first: 5 + 5.');
  },
  word(q, A) {
    A.appendChild(el(`<div class="story">${q.text}</div>`));
    if (q.line) numberLine(A, null);
    choiceRow(opts(q.ans, q.ex), q.ans, A, 'Read again slowly. Do we put together (+) or take away (−)?');
  }
};

/* ---------------- confetti ---------------- */
function burst(n) {
  const cols = ['#ff5d8f', '#ffd23f', '#2e9bff', '#2fbf71', '#8e5cf7', '#ff9f1c'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.4 + Math.random() * 1.6) + 's'; c.style.borderRadius = Math.random() > .5 ? '50%' : '3px';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3200);
  }
}

renderMap();
