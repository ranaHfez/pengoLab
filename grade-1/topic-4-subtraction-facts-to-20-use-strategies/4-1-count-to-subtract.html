<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<title>Count to Subtract 4-1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one-screen app — header + tabs on top, the active panel fills the rest; ink layer over every panel. Single bright classroom look. */
:root{
  --sand:#FFF6E6; --card:#FFFFFF; --ink:#24324A; --muted:#66708A;
  --gum:#1E6B52; --gum-2:#2C8A6B; --hop:#F2762E; --back:#D6336C; --on:#2B9348; --line:#2E6FD8;
  --sun:#FFC93C; --edge:#EEDDBF;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Andika","Trebuchet MS",Verdana,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:18px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--gum)}
button{font-family:var(--display);cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
header{background:var(--gum);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .roo{width:48px;height:48px;flex:none}
.titles{flex:1;min-width:0}
.titles h1{font-family:var(--display);font-size:clamp(20px,3vw,30px);line-height:1;margin:0;text-wrap:balance}
.titles .sub{font-size:14px;opacity:.85;letter-spacing:.04em}
.sign{font-family:var(--display);font-size:15px;opacity:.9}
.sndBtn{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:4px 12px;font-size:15px}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav button{flex:none;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:17px;font-weight:700;padding:8px 16px 6px;border-radius:14px 14px 0 0}
nav button[aria-selected="true"]{background:var(--sand);color:var(--gum)}
main{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0;overflow:auto}
.surface{position:relative;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px;box-sizing:border-box}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:3px solid var(--edge);border-radius:22px;padding:16px 18px}
h2{font-family:var(--display);font-size:28px;margin:0;color:var(--gum);line-height:1.1}
h3{font-family:var(--display);font-size:22px;margin:0 0 6px;line-height:1.1}
p{margin:.3em 0;line-height:1.45}
.big{font-family:var(--display);font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:.02em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:16px;padding:10px 18px;font-size:20px;font-weight:700;color:#fff;background:var(--line);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.back{background:var(--back)} .btn.on{background:var(--on)} .btn.orange{background:var(--hop)} .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--edge)}
.bubble{position:relative;background:#FFF;border:3px solid var(--gum-2);border-radius:20px;padding:10px 14px;font-size:19px}
.scene{display:flex;gap:12px;align-items:flex-end}
.scene .roo{width:90px;height:90px;flex:none}
.scene .bubble{flex:1;min-width:0}
/* number line */
.nl{width:100%;overflow-x:auto}
.nl svg{display:block;width:100%;min-width:640px;height:auto}
.nl .tickHit{fill:transparent;cursor:pointer}
.nl .tickHit:hover{fill:rgba(46,111,216,.10)}
.nl.locked .tickHit{cursor:default}
.nl.locked .tickHit:hover{fill:transparent}
.hopPath{fill:none;stroke-width:5;stroke-linecap:round}
.hopPath.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .45s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rooMk{transition:transform .4s cubic-bezier(.4,1.6,.6,1)}
.rooMk .bob{animation:none}
.rooMk.jump .bob{animation:bob .4s ease}
@keyframes bob{40%{transform:translateY(-26px)}}
/* game */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stars{font-family:var(--display);font-size:22px;color:var(--hop);font-variant-numeric:tabular-nums}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{font-family:var(--display);font-size:16px;padding:4px 12px;border-radius:999px;background:#F1E7D3;color:var(--muted)}
.step.now{background:var(--sun);color:var(--ink)}
.step.done{background:#CDEFD6;color:var(--on)}
.msg{font-size:20px;min-height:1.6em;font-weight:700}
.msg.good{color:var(--on)} .msg.bad{color:var(--back)}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{min-width:64px;height:64px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--line);font-family:var(--display);font-size:32px;font-weight:800;touch-action:none;user-select:none}
.chip.right{background:var(--on);border-color:var(--on);color:#fff}
.chip.wrong{background:#FDE3EB;border-color:var(--back);color:var(--back)}
.drop{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:58px;border:3px dashed var(--hop);border-radius:14px;color:var(--hop);background:#FFF1E6;vertical-align:middle}
.drop.over{background:var(--sun)}
.drop.filled{border-style:solid;border-color:var(--on);color:var(--on);background:#E6F7EA}
.dragGhost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.1)}
.counter{font-family:var(--display);font-size:24px;color:var(--hop);font-variant-numeric:tabular-nums}
.choices{display:flex;gap:12px;flex-wrap:wrap}
.endBox{text-align:center;padding:28px}
.endBox .roo{width:150px;height:150px}
/* book */
.bookBar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 16px}
.bookBar button{border:2px solid var(--edge);background:#fff;border-radius:12px;padding:6px 14px;font-size:18px;font-weight:700;color:var(--ink)}
.bookBar button[aria-pressed="true"]{background:var(--gum);color:#fff;border-color:var(--gum)}
#bookPanel{display:flex;flex-direction:column;overflow:hidden}
.bookStage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px 8px}
.pageBox{position:relative;box-shadow:0 6px 20px rgba(36,50,74,.18);border-radius:6px;overflow:hidden;background:#fff}
.pageBox img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
/* whiteboard */
#wbPanel{overflow:hidden}
#wbPanel .surface{height:100%;padding:0}
.wbBg{position:absolute;inset:0;background:#fff}
.wbBg.grid{background-image:linear-gradient(#DCE6F5 1px,transparent 1px),linear-gradient(90deg,#DCE6F5 1px,transparent 1px);background-size:40px 40px}
.wbBg.lines{background-image:linear-gradient(transparent 58px,#9CC0EE 58px,#9CC0EE 60px);background-size:100% 60px}
.wbNL{position:absolute;left:3%;right:3%;bottom:18%}
.wbNL svg{width:100%;height:auto}
.wbBar{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));z-index:60;display:flex;gap:6px;flex-wrap:wrap}
.wbBar button{border:2px solid var(--edge);background:#fff;border-radius:10px;padding:4px 10px;font-size:15px;color:var(--ink)}
.wbBar button[aria-pressed="true"]{background:var(--line);color:#fff;border-color:var(--line)}
/* ink */
.ink{position:absolute;left:0;top:0;pointer-events:none;z-index:50}
body.penOn .ink{pointer-events:auto;cursor:crosshair;touch-action:none}
.dock{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools{display:none;background:#fff;border:3px solid var(--edge);border-radius:18px;padding:8px;gap:6px;flex-wrap:wrap;max-width:min(92vw,520px);justify-content:flex-end;box-shadow:0 8px 24px rgba(36,50,74,.18)}
body.penOn .tools{display:flex}
.tools button{border:2px solid var(--edge);background:#fff;border-radius:12px;min-width:44px;height:44px;font-size:15px;font-weight:700;color:var(--ink);padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tools button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.tools .sw{width:26px;height:26px;border-radius:50%;display:block}
.tools .sep{width:2px;align-self:stretch;background:var(--edge)}
.penToggle{border:0;border-radius:999px;padding:12px 22px;font-size:22px;font-weight:800;color:#fff;background:#8A93A6;box-shadow:0 5px 0 rgba(0,0,0,.2);display:flex;align-items:center;gap:10px}
body.penOn .penToggle{background:var(--hop)}
.penToggle .dot{width:16px;height:16px;border-radius:50%;background:#fff;opacity:.5}
body.penOn .penToggle .dot{opacity:1;box-shadow:0 0 0 4px rgba(255,255,255,.4)}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:600px){body{font-size:16px}.scene .roo{width:64px;height:64px}.penToggle{font-size:18px;padding:10px 16px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<div class="app">
<header>
  <div class="top">
    <span class="roo" data-roo></span>
    <div class="titles">
      <div class="sub">enVision Math · Grade 1 · Topic 4 · Lesson 4-1</div>
      <h1>Count to Subtract</h1>
    </div>
    <button class="sndBtn" id="sndBtn" aria-pressed="true">Sound: On</button>
    <span class="sign">T.Rana Elsisi</span>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="bookPanel" aria-selected="true">Book Pages</button>
    <button role="tab" data-tab="warmPanel">Warm-up</button>
    <button role="tab" data-tab="learnPanel">Learn</button>
    <button role="tab" data-tab="g1Panel">Game 1: Hop Back</button>
    <button role="tab" data-tab="g2Panel">Game 2: Count On</button>
    <button role="tab" data-tab="wbPanel">Whiteboard</button>
  </nav>
</header>
<main>
  <section class="panel" id="bookPanel">
    <div class="bookBar" id="bookBar"></div>
    <div class="bookStage" id="bookStage"></div>
  </section>
  <section class="panel" id="warmPanel" hidden><div class="surface"><div class="wrap" id="warm"></div></div></section>
  <section class="panel" id="learnPanel" hidden><div class="surface"><div class="wrap" id="learn"></div></div></section>
  <section class="panel" id="g1Panel" hidden><div class="surface"><div class="wrap" id="g1"></div></div></section>
  <section class="panel" id="g2Panel" hidden><div class="surface"><div class="wrap" id="g2"></div></div></section>
  <section class="panel" id="wbPanel" hidden>
    <div class="surface" id="wbSurface">
      <div class="wbBg grid" id="wbBg"></div>
      <div class="wbNL" id="wbNL" hidden></div>
      <div class="wbBar" id="wbBar">
        <button data-bg="plain">Plain</button>
        <button data-bg="grid" aria-pressed="true">Grid</button>
        <button data-bg="lines">Lines</button>
        <button id="wbNLBtn" aria-pressed="false">Number line 0–20</button>
      </div>
    </div>
  </section>
</main>
</div>

<div class="dock">
  <div class="tools" id="tools">
    <button data-tool="pen" aria-pressed="true" title="Pen">Pen</button>
    <button data-tool="hl" title="Highlighter">Marker</button>
    <button data-tool="eraser" title="Eraser">Eraser</button>
    <span class="sep"></span>
    <button data-color="#1F4FD8" aria-pressed="true" title="Blue"><span class="sw" style="background:#1F4FD8"></span></button>
    <button data-color="#E03131" title="Red"><span class="sw" style="background:#E03131"></span></button>
    <button data-color="#2B9348" title="Green"><span class="sw" style="background:#2B9348"></span></button>
    <button data-color="#F2762E" title="Orange"><span class="sw" style="background:#F2762E"></span></button>
    <button data-color="#8E44AD" title="Purple"><span class="sw" style="background:#8E44AD"></span></button>
    <button data-color="#1B1B1B" title="Black"><span class="sw" style="background:#1B1B1B"></span></button>
    <span class="sep"></span>
    <button data-size="3" title="Thin">S</button>
    <button data-size="6" aria-pressed="true" title="Medium">M</button>
    <button data-size="12" title="Thick">L</button>
    <span class="sep"></span>
    <button id="undoBtn" title="Undo">Undo</button>
    <button id="clearBtn" title="Clear writing on this tab">Clear</button>
  </div>
  <button class="penToggle" id="penToggle" aria-pressed="false"><span class="dot"></span><span id="penLabel">Pen OFF</span></button>
</div>

let AC=null, soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,d,type='sine',v=.18,f2){const a=ac();if(!a||!soundOn)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);g.gain.setValueAtTime(v,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05);}
function clap(t0){const a=ac();if(!a||!soundOn)return;const n=a.sampleRate*.08,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;const g=a.createGain();g.gain.value=.6;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0);}
const sfx={

};

/* ---------- number line ---------- */
let nlId=0;
class NL{
  constructor(host,{min=0,max=20,onTap=null}={}){
    this.min=min;this.max=max;this.onTap=onTap;this.id='nl'+(nlId++);this.hops=0;
    const W=1000,H=190;this.box=el('div',{class:'nl'});
    const ns='http://www.w3.org/2000/svg';
    let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="${ns}"><defs>
      <marker id="${this.id}b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D6336C"/></marker>
      <marker id="${this.id}o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B9348"/></marker></defs>
      <line x1="14" y1="140" x2="986" y2="140" stroke="#24324A" stroke-width="4"/>
      <path d="M8 140l16-10v20z" fill="#24324A"/><path d="M992 140l-16-10v20z" fill="#24324A"/><g class="ticks">`;
    for(let i=min;i<=max;i++){const x=this.x(i);const big=(i%5===0);
      s+=`<line x1="${x}" y1="${big?124:130}" x2="${x}" y2="${big?156:150}" stroke="#24324A" stroke-width="${big?4:3}"/>
      <text x="${x}" y="182" text-anchor="middle" font-family="Baloo 2,Trebuchet MS,sans-serif" font-size="${max-min>15?24:28}" font-weight="700" fill="#24324A">${i}</text>`;}
    s+=`</g><g class="hops"></g><g class="dots"></g><g class="hits">`;
    for(let i=min;i<=max;i++){s+=`<rect class="tickHit" data-n="${i}" x="${this.x(i)-this.step()/2}" y="100" width="${this.step()}" height="90" rx="8"/>`;}
    s+=`</g><g class="rooLayer"></g></svg>`;
    this.box.innerHTML=s;host.appendChild(this.box);
    this.svg=this.box.querySelector('svg');this.gHops=this.svg.querySelector('.hops');this.gDots=this.svg.querySelector('.dots');this.gRoo=this.svg.querySelector('.rooLayer');
    this.svg.querySelectorAll('.tickHit').forEach(r=>r.addEventListener('click',()=>{if(this.onTap&&!this.locked)this.onTap(+r.dataset.n);}));
  }
  step(){return 920/(this.max-this.min);}
  x(i){return 40+(i-this.min)*this.step();}
  lock(v=true){this.locked=v;this.box.classList.toggle('locked',v);}
  clear(){this.gHops.innerHTML='';this.gDots.innerHTML='';this.gRoo.innerHTML='';this.rooAt=null;this.hops=0;}
  dot(i,color='#2E6FD8'){this.gDots.insertAdjacentHTML('beforeend',`<circle cx="${this.x(i)}" cy="140" r="11" fill="${color}" stroke="#fff" stroke-width="3"/>`);}
  hop(a,b,label){
    const back=b<a,col=back?'#D6336C':'#2B9348',x1=this.x(a),x2=this.x(b),mx=(x1+x2)/2,h=Math.min(70,30+Math.abs(x2-x1)*.6);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M${x1} 132 Q${mx} ${132-h*1.6} ${x2} 132`);p.setAttribute('class','hopPath draw');p.setAttribute('stroke',col);
    p.setAttribute('marker-end',`url(#${this.id}${back?'b':'o'})`);this.gHops.appendChild(p);
    if(label!=null)this.gHops.insertAdjacentHTML('beforeend',`<g><circle cx="${mx}" cy="${132-h*.8-12}" r="15" fill="#fff" stroke="${col}" stroke-width="3"/><text x="${mx}" y="${132-h*.8-4}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="22" fill="${col}">${label}</text></g>`);
  }
  placeRoo(i,face=1){
    if(!this.gRoo.firstChild){this.gRoo.innerHTML=`<g class="rooMk"><g class="bob"><g class="flip">${ROO.replace('<svg','<svg x="-24" y="-50" width="48" height="48"')}</g></g></g>`;}
    const mk=this.gRoo.querySelector('.rooMk');mk.style.transform=`translate(${this.x(i)}px,${this.rooYOff||118}px)`;
    this.gRoo.querySelector('.flip').setAttribute('transform',face<0?'scale(-1,1)':'');
    if(this.rooAt!=null&&this.rooAt!==i){mk.classList.remove('jump');void mk.getBBox();mk.classList.add('jump');}
    this.rooAt=i;
  }
}

/* ---------- ink ---------- */
const pen={on:false,tool:'pen',color:'#1F4FD8',size:6};
const inks=[];let lastInk=null;
function makeInk(host,{scale=false}={}){
  const c=el('canvas',{class:'ink'});host.appendChild(c);const ctx=c.getContext('2d');
  const k={c,ctx,host,undo:[],w:0,h:0,
    fit(){const r=host.getBoundingClientRect();const w=Math.round(Math.max(host.scrollWidth,r.width)),h=Math.round(Math.max(host.scrollHeight,r.height));if(!w||!h||(w===k.w&&h===k.h))return;
      const dpr=window.devicePixelRatio||1;let old=null;if(k.w&&k.h){old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0);}
      c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
      if(old){if(scale)ctx.drawImage(old,0,0,c.width,c.height);else ctx.drawImage(old,0,0);}
      k.w=w;k.h=h;k.undo=[];},
    clear(){ctx.clearRect(0,0,c.width,c.height);k.undo=[];}
  };
  let drawing=false,lx=0,ly=0;
  const pos=e=>{const r=c.getBoundingClientRect();const dpr=c.width/r.width;return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr,dpr];};
  c.addEventListener('pointerdown',e=>{if(!pen.on)return;e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;lastInk=k;
    try{k.undo.push(ctx.getImageData(0,0,c.width,c.height));if(k.undo.length>15)k.undo.shift();}catch(_){}
    [lx,ly]=pos(e);line(lx+.1,ly+.1,pos(e)[2]);});
  c.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y,d]=pos(e);line(x,y,d);});
  const end=()=>{drawing=false;};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  function line(x,y,d){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';

      c.addEventListener('pointermove',e=>{if(!ghost)return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>6)moved=true;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
        const t=document.elementFromPoint(e.clientX,e.clientY);drops().forEach(d=>d.classList.toggle('over',!!t&&d.contains(t)));});
      const up=e=>{if(!ghost)return;ghost.remove();ghost=null;c.style.opacity='';const t=document.elementFromPoint(e.clientX,e.clientY);const hit=drops().some(d=>t&&d.contains(t));drops().forEach(d=>d.classList.remove('over'));
        if(hit||!moved)place(v,c);};
      c.addEventListener('pointerup',up);c.addEventListener('pointercancel',()=>{if(ghost){ghost.remove();ghost=null;c.style.opacity='';}});
    }
    const nx=el('button',{class:'btn orange'},'Next ▶');nx.hidden=true;nx.onclick=()=>{qi++;show();};
    card.append(chips,msg,nx);
    host.appendChild(el('div',{class:'scene'},`<span class="roo">${ROO}</span><div class="bubble">Count on: start at the part and hop on to the whole. The number of hops is the answer!</div>`));
    host.appendChild(card);
  }
  show();
}

runWarm();runLearn();runG1();runG2();
</script>
