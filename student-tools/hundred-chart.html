<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hundred Chart – Follow the Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Shared template: Home button and shared pieces. Keep this. -->
<link rel="stylesheet" href="../shared/theme.css">
<script src="../shared/theme.js" defer></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#FFFDF7;font-family:'Fredoka','Poppins','Comic Sans MS',sans-serif;color:#343A40}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:center;justify-content:center;gap:14px}
  h1{margin:0;font-size:clamp(34px,7vw,56px);color:#7048E8;line-height:1.05;text-align:center}
  .stars{display:flex;gap:6px}
  .hint{text-align:center;font-size:18px;font-weight:600;color:#495057;margin:0}

  .board{position:relative}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:12px;border:3px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:clamp(16px,3.6vw,28px);font-weight:700;cursor:pointer;padding:0;position:relative;transition:transform .12s, box-shadow .12s}
  .cell:hover{transform:scale(1.06)}
  .cell:focus-visible{outline:4px solid #212529;outline-offset:2px}
  .cell.ten{background:var(--bd);color:#fff;border-color:var(--tx)}
  .cell.on{background:#FFD43B;color:#212529;border-color:#212529;box-shadow:0 0 0 3px #FFD43B}
  .cell.current{background:#212529;color:#FFD43B;border-color:#212529;transform:scale(1.1);z-index:2}
  .cell .step{position:absolute;top:2px;right:4px;font-size:clamp(9px,1.6vw,12px);font-weight:600;opacity:.8}
  svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .colhead{font-size:20px;font-weight:700}
  .colhead.r{text-align:right}
  .move{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:16px;border:3px dashed var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:20px;font-weight:600;cursor:pointer;padding:8px 12px}
  .move:hover:not(:disabled){border-style:solid}
  .move:disabled{opacity:.35;cursor:not-allowed}
  .move .big{font-size:22px;font-weight:700}

  .pathbox{background:#fff;border:3px solid #DEE2E6;border-radius:16px;padding:12px 14px;min-height:64px;font-size:20px;font-weight:600;line-height:1.7;word-wrap:break-word}
  .pathbox .n{display:inline-block;background:#FFD43B;border-radius:8px;padding:0 8px;color:#212529}
  .pathbox .j{color:#6C6F73;font-size:16px;margin:0 4px}
  .pathbox .empty{color:#6C6F73;font-weight:500}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{font:inherit;font-size:20px;font-weight:700;border:none;border-radius:14px;padding:12px 26px;cursor:pointer;color:#fff;min-height:48px}
  .btn.undo{background:#4263EB}
  .btn.clear{background:#E03131}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  footer{display:flex;justify-content:flex-end;font-size:16px;font-weight:600;color:#6C6F73}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stars" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z" fill="#FAB005"/></svg>
      <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z" fill="#FF6B6B"/></svg>
    </div>
    <h1>Hundred Chart</h1>
    <div class="stars" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z" fill="#4DABF7"/></svg>
      <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z" fill="#51CF66"/></svg>
    </div>
  </header>
  <p class="hint" id="hint">Tap a number to start your path.</p>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <svg class="path" id="pathSvg" aria-hidden="true">
      <defs>
        <marker id="arrowHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="#212529"/>
        </marker>
      </defs>
      <g id="lines"></g>
    </svg>
  </div>

  <div class="controls">
    <div class="colhead">Add (+)</div>
    <div class="colhead r">Subtract (−)</div>
    <button class="move" data-step="1" style="--bg:#E7F5FF;--bd:#1971C2;--tx:#1864AB">
      <svg width="36" height="22" viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12h32M26 4l8 8-8 8" fill="none" stroke="#1864AB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Move right: <span class="big">+1</span></span>
    </button>
    <button class="move" data-step="-1" style="--bg:#FFE3E3;--bd:#E03131;--tx:#C92A2A">
      <svg width="36" height="22" viewBox="0 0 40 24" aria-hidden="true"><path d="M38 12H6M14 4l-8 8 8 8" fill="none" stroke="#C92A2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Move left: <span class="big">−1</span></span>
    </button>
    <button class="move" data-step="10" style="--bg:#EBFBEE;--bd:#2F9E44;--tx:#2B8A3E">
      <svg width="22" height="36" viewBox="0 0 24 40" aria-hidden="true"><path d="M12 2v32M4 26l8 8 8-8" fill="none" stroke="#2B8A3E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Move down: <span class="big">+10</span></span>
    </button>
    <button class="move" data-step="-10" style="--bg:#FFE8CC;--bd:#E8590C;--tx:#D9480F">
      <svg width="22" height="36" viewBox="0 0 24 40" aria-hidden="true"><path d="M12 38V6M4 14l8-8 8 8" fill="none" stroke="#D9480F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Move up: <span class="big">−10</span></span>
    </button>
  </div>

  <div class="pathbox" id="pathbox" aria-live="polite"><span class="empty">Your path will show here.</span></div>

  <div class="actions">
    <button class="btn undo" id="undoBtn">Undo</button>
    <button class="btn clear" id="clearBtn">Clear</button>
  </div>

  <footer>T.Rana Elsisi</footer>
</div>

<script>
(function(){
  var rows=[["#FFE3E3","#E03131","#C92A2A"],["#FFE8CC","#E8590C","#D9480F"],["#FFF3BF","#E67700","#E67700"],["#EBFBEE","#2F9E44","#2B8A3E"],["#E3FAFC","#0C8599","#0B7285"],["#E7F5FF","#1971C2","#1864AB"],["#EDF2FF","#4263EB","#3B5BDB"],["#F3F0FF","#7048E8","#6741D9"],["#F8F0FC","#AE3EC9","#9C36B5"],["#FFF0F6","#D6336C","#C2255C"]];
  var grid=document.getElementById('grid'), lines=document.getElementById('lines'),
      board=document.getElementById('board'), pathbox=document.getElementById('pathbox'),
      hint=document.getElementById('hint'), undoBtn=document.getElementById('undoBtn'),
      clearBtn=document.getElementById('clearBtn'), moves=document.querySelectorAll('.move');
  var cells={}, path=[];

  for(var n=1;n<=100;n++){
    var r=Math.floor((n-1)/10), c=rows[r], b=document.createElement('button');
    b.className='cell'+(n%10===0?' ten':'');
    b.style.setProperty('--bg',c[0]); b.style.setProperty('--bd',c[1]); b.style.setProperty('--tx',c[2]);
    b.textContent=n; b.dataset.n=n; b.setAttribute('aria-label','Number '+n);
    b.addEventListener('click',onCellClick);
    grid.appendChild(b); cells[n]=b;
  }

  function last(){return path.length?path[path.length-1]:null;}
  function canMove(from,step){
    var to=from+step;
    if(to<1||to>100) return false;
    if(step===1 && from%10===0) return false;     // end of row
    if(step===-1 && from%10===1) return false;    // start of row
    return true;
  }
  function isNeighbour(a,b){
    var d=b-a; return (d===1||d===-1||d===10||d===-10) && canMove(a,d);
  }

  function onCellClick(e){
    var n=+e.currentTarget.dataset.n, l=last();
    if(l===null){ path.push(n); render(); return; }
    if(n===l) return;
    if(isNeighbour(l,n)){ path.push(n); render(); return; }
    // not next door: start a new path from this number
    path=[n]; render();
    hint.textContent='New path started at '+n+'. Move one box at a time!';
  }

  function step(s){
    var l=last(); if(l===null||!canMove(l,s)) return;
    path.push(l+s); render();
  }

  function jumpLabel(d){return d===1?'+1':d===-1?'−1':d===10?'+10':'−10';}

  function render(){
    for(var k in cells){ cells[k].classList.remove('on','current'); var s=cells[k].querySelector('.step'); if(s) s.remove(); }
    path.forEach(function(n,i){
      var el=cells[n]; el.classList.add(i===path.length-1?'current':'on');
    });
    // path text
    if(!path.length){ pathbox.innerHTML='<span class="empty">Your path will show here.</span>'; }
    else{
      var h='<span class="n">'+path[0]+'</span>';
      for(var i=1;i<path.length;i++){ h+='<span class="j">'+jumpLabel(path[i]-path[i-1])+' →</span><span class="n">'+path[i]+'</span>'; }
      pathbox.innerHTML=h;
    }
    var l=last();
    moves.forEach(function(m){ m.disabled=(l===null)||!canMove(l,+m.dataset.step); });
    undoBtn.disabled=!path.length; clearBtn.disabled=!path.length;
    if(!path.length) hint.textContent='Tap a number to start your path.';
    else if(path.length===1) hint.textContent='Start: '+l+'. Use the arrows or tap a box next to it.';
    else hint.textContent='You are on '+l+'. Keep going!';
    drawLines();
  }

  function centre(n){
    var br=board.getBoundingClientRect(), r=cells[n].getBoundingClientRect();
    return {x:r.left-br.left+r.width/2, y:r.top-br.top+r.height/2, w:r.width};
  }
  function drawLines(){
    lines.innerHTML='';
    for(var i=1;i<path.length;i++){
      var a=centre(path[i-1]), b=centre(path[i]), sh=a.w*0.32;
      var dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy), ux=dx/len, uy=dy/len;
      var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',a.x+ux*sh); ln.setAttribute('y1',a.y+uy*sh);
      ln.setAttribute('x2',b.x-ux*sh); ln.setAttribute('y2',b.y-uy*sh);
      ln.setAttribute('stroke','#212529'); ln.setAttribute('stroke-width','5');
      ln.setAttribute('stroke-linecap','round'); ln.setAttribute('marker-end','url(#arrowHead)');
      lines.appendChild(ln);
    }
  }

  moves.forEach(function(m){ m.addEventListener('click',function(){ step(+m.dataset.step); }); });
  undoBtn.addEventListener('click',function(){ path.pop(); render(); });
  clearBtn.addEventListener('click',function(){ path=[]; render(); });
  document.addEventListener('keydown',function(e){
    var map={ArrowRight:1,ArrowLeft:-1,ArrowDown:10,ArrowUp:-10};
    if(map[e.key]!==undefined && path.length){ e.preventDefault(); step(map[e.key]); }
  });
  window.addEventListener('resize',drawLines);
  render();
})();
</script>
</body>
</html>
