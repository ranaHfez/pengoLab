<title>Topic 4 Game Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: arcade lobby of 3 game rooms, each a stage with a mascot, a play board and a keypad */
:root{
  color-scheme: light;
  --sky:#e9f6ff; --ink:#1d2a4a; --muted:#5b6788; --card:#ffffff; --line:#cfdcf0;
  --blue:#2f7dea; --orange:#ff8a1f; --green:#20b46a; --red:#ef4f5f; --yellow:#ffc928; --purple:#8a5cf6;
  --g1:#ffb020; --g2:#6f5cff; --g3:#13a99a;
  --display:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;
  background-image:radial-gradient(circle at 10% 10%,#fff 0 60px,transparent 61px),radial-gradient(circle at 85% 6%,#fff 0 40px,transparent 41px);
  min-height:100vh}
.wrap{max-width:1150px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-family:var(--display);font-size:clamp(1.5rem,3.2vw,2.2rem);margin:0;line-height:1.1;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font-family:var(--display);font-size:1rem;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;padding:7px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
nav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
nav button.on{background:var(--yellow)}
button:focus-visible{outline:4px solid var(--purple);outline-offset:2px}
.screen{margin-top:16px}
/* lobby */
.lobby{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.gcard{border:4px solid var(--ink);border-radius:26px;padding:18px;color:#fff;cursor:pointer;text-align:left;font:inherit;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.gcard:hover{transform:translateY(-4px) rotate(-1deg)}
.gcard .lesson{font-family:var(--display);font-size:.95rem;background:rgba(255,255,255,.25);border-radius:99px;padding:3px 12px;align-self:flex-start}
.gcard h2{font-family:var(--display);font-size:1.7rem;margin:0}
.gcard p{margin:0;font-weight:700}
.gcard svg{width:130px;height:130px;align-self:center}
.gcard .play{font-family:var(--display);background:#fff;color:var(--ink);border-radius:14px;padding:8px;text-align:center;font-size:1.2rem}
.c1{background:var(--g1)} .c2{background:var(--g2)} .c3{background:var(--g3)}
/* stage */
.stage{background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);overflow:hidden}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;color:#fff}
.stagebar h2{font-family:var(--display);margin:0;font-size:1.35rem;flex:1;min-width:180px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;display:grid;place-items:center;font-size:12px}
.dot.cur{background:#fff;transform:scale(1.2)}
.dot.done{background:var(--yellow)}
.score{font-family:var(--display);background:#fff;color:var(--ink);border-radius:99px;padding:4px 12px;font-size:1.1rem}
.mascotrow{display:flex;align-items:flex-end;gap:12px;padding:14px 16px 0}
.mascot{width:110px;height:110px;flex:none}
.mascot svg{width:100%;height:100%}
.bubble{position:relative;background:#fff8d6;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-weight:800;font-size:1.08rem;min-width:0;flex:1;margin-bottom:22px}
.bubble:before{content:"";position:absolute;left:-14px;bottom:14px;border:10px solid transparent;border-right-color:var(--ink)}
.bubble b{color:var(--red)}
.board{padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.qtitle{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.4rem);text-align:center;margin:0}
.qtext{font-size:1.2rem;font-weight:800;text-align:center;margin:0;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.big{font-family:var(--display);font-size:1.25rem;border:3px solid var(--ink);border-radius:16px;padding:10px 22px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.big.go{background:var(--green);color:#fff}
.big.yes{background:var(--blue);color:#fff}
.big.no{background:var(--red);color:#fff}
.big.sel{background:var(--yellow)}
.big.right{background:var(--green);color:#fff}
.big.wrong{background:#ffd5d9}
.big[disabled]{opacity:.5;cursor:default}
/* boxes + keypad */
.box{font-family:var(--display);min-width:64px;height:58px;font-size:1.8rem;border:3px dashed var(--muted);border-radius:14px;background:#f6f9ff;color:var(--ink);cursor:pointer;padding:0 8px;font-variant-numeric:tabular-nums}
.box.act{border-style:solid;border-color:var(--purple);background:#efe9ff;box-shadow:0 0 0 4px #d9ccff}
.box.ok{border-style:solid;border-color:var(--green);background:#dcf7e8}
.box.bad{border-style:solid;border-color:var(--red);background:#ffe1e4}
.eq{font-family:var(--display);font-size:1.7rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.keypad{display:grid;grid-template-columns:repeat(6,minmax(0,64px));gap:8px;justify-content:center}
.keypad button{font-family:var(--display);font-size:1.6rem;height:56px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.keypad .del{background:#ffe1e4}
.keypad .chk{background:var(--green);color:#fff;grid-column:span 2;font-size:1.3rem}
/* place value mat */
.mat{display:grid;grid-template-columns:1fr 1.25fr;border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:#fffdf4}
.mat .col{padding:10px;min-height:190px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mat .col+.col{border-left:4px dashed var(--ink)}
.colhead{font-family:var(--display);font-size:1.25rem;display:flex;align-items:center;gap:6px;justify-content:center}
.colhead svg{width:30px;height:30px}
.rods{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end}
.rod{width:22px;height:150px;border:2px solid var(--ink);border-radius:4px;background:repeating-linear-gradient(to bottom,var(--rc) 0 12.6px,var(--ink) 12.6px 14.6px)}
.cubes{display:grid;grid-template-columns:repeat(5,26px);gap:6px;justify-content:center}
.cube{width:26px;height:26px;border:2px solid var(--ink);border-radius:5px;background:var(--rc);padding:0;cursor:default;transition:transform .2s,opacity .5s}
.a1{--rc:#5aa6ff} .a2{--rc:#ffa24d} .a3{--rc:#3fd18a}
.pick .cube{cursor:pointer}
.pick .cube:hover{transform:scale(1.12)}
.cube.chosen{outline:4px solid var(--purple);transform:scale(1.12)}
.cube.gone{transform:translate(-80px,-60px) scale(.2) rotate(180deg);opacity:0}
.rod.new{animation:landing .7s cubic-bezier(.3,1.6,.6,1)}
@keyframes landing{0%{transform:translateY(-120px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.legend{display:flex;gap:14px;justify-content:center;font-weight:800;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:4px;border:2px solid var(--ink);background:var(--rc);display:inline-block}
.counter{font-family:var(--display);font-size:1.3rem;text-align:center;color:var(--purple)}
/* quick drawings */
.qd{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pad{border:3px solid var(--ink);border-radius:18px;padding:10px;background:#f7f5ff;display:flex;flex-direction:column;gap:8px;min-width:0}
.pad h4{margin:0;font-family:var(--display);font-size:1.15rem;text-align:center}
.drawn{min-height:96px;display:flex;align-items:flex-end;gap:7px;flex-wrap:wrap;padding:8px;background:#fff;border-radius:12px;border:2px dashed var(--line)}
.ln{width:7px;height:76px;border-radius:4px;background:var(--ink);animation:pop .25s}
.dt{width:14px;height:14px;border-radius:50%;background:var(--ink);animation:pop .25s}
.dts{display:grid;grid-template-columns:repeat(5,14px);gap:6px;align-self:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.padbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.padbtns button{font-family:var(--display);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:1rem;cursor:pointer;background:#fff;color:var(--ink)}
.chain{display:flex;flex-direction:column;gap:10px;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
/* partial sums */
.ps{display:grid;grid-template-columns:auto 70px 70px auto;gap:6px 8px;align-items:center;justify-content:center;font-family:var(--display);font-size:2rem}
.ps .h{font-size:1rem;background:var(--g3);color:#fff;border-radius:10px;text-align:center;padding:2px 0}
.ps .d{text-align:center;background:#eafaf7;border-radius:10px;height:58px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ps .lab{font-size:1.15rem;text-align:right;color:var(--muted)}
.ps .rule{grid-column:2 / span 2;height:4px;background:var(--ink);border-radius:2px}
.ps .wide{grid-column:2 / span 2;display:flex;justify-content:center}
.ps .wide .box{width:100%}
.chest{display:flex;align-items:center;gap:8px;justify-content:center;font-family:var(--display);font-size:1.2rem}
.coins{display:flex;gap:3px;flex-wrap:wrap}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a6,#ffc928 55%,#d99a00);border:2px solid #9a6b00;animation:pop .4s}
/* fx */
.bounce{animation:bounce .7s}
@keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(-6px) rotate(4deg)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.endcard{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.endcard h3{font-family:var(--display);font-size:2.2rem;margin:0}
.stars{font-size:2rem;letter-spacing:4px;color:var(--yellow);text-shadow:0 2px 0 var(--ink);overflow-wrap:anywhere}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.stagebar h2 small{display:block;font-size:1rem;font-weight:600;opacity:.95;margin-top:2px}
.teacher{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:16px;margin-bottom:20px;box-shadow:0 8px 0 var(--ink)}
.tfig{width:190px;flex:none;margin-inline:auto;background:radial-gradient(circle at 50% 40%,#fff 0,#ffe0ec 60%,transparent 61%);animation:float 3.5s ease-in-out infinite}
.tfig img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(122,47,82,.25))}
.wave{transform-origin:164px 200px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-14deg)}}
.tsay{flex:1;min-width:240px;background:#fff0f6;border:3px solid var(--ink);border-radius:22px;padding:14px 18px}
.tsay h2{font-family:var(--display);margin:0 0 6px;font-size:1.6rem;color:#c2374f}
.tsay p{margin:0 0 8px;font-weight:700;font-size:1.08rem;max-width:65ch}
.tsay b{color:var(--purple)}
.tsay .sign{font-family:var(--display);font-size:1.2rem;margin:0;text-align:right;color:var(--purple)}
.sendnote{margin:0;font-weight:800;background:#fff0f6;border:3px dashed #ff7aa8;border-radius:14px;padding:8px 14px}
.howbtn{font-family:var(--display);background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:4px 12px;font-size:1rem;cursor:pointer}
.demotag{font-family:var(--display);align-self:center;background:var(--yellow);border:3px solid var(--ink);border-radius:99px;padding:4px 16px;font-size:1.15rem}
.demoStep{font-size:1.2rem;font-weight:800;text-align:center;background:#eef6ff;border:3px dashed var(--blue);border-radius:16px;padding:12px;text-wrap:balance}
.stepnum{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:1px 10px;font-size:.95rem;margin-right:4px}
span.box{display:inline-grid;place-items:center;cursor:default}
.lnum{background:#fff;color:var(--ink);border-radius:10px;padding:1px 9px;margin-right:4px;white-space:nowrap}
@media (max-width:560px){
  .mascot{width:76px;height:76px}
  .mat{grid-template-columns:1fr}
  .mat .col+.col{border-left:0;border-top:4px dashed var(--ink)}
  .rod{height:110px;background:repeating-linear-gradient(to bottom,var(--rc) 0 9px,var(--ink) 9px 10.8px)}
  .ps{font-size:1.6rem;grid-template-columns:auto 56px 56px auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header>
  <h1>Topic 4 Game Arcade<small>Grade 2 · enVision Lessons 4-1 and 4-3 · T.Rana Elsisi</small></h1>
  <nav id="nav">
    <button data-go="home" class="on">Home</button>
    <button data-go="g1">4-1 Game</button>
    <button data-go="g3">4-3 Game</button>
  </nav>
</header>
<main id="main" class="screen"></main>
</div>

<canvas id="fx"></canvas>

/* ---------- sound ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function tone(f,t,d,type="sine",v=.2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t);g.gain.linearRampToValueAtTime(v,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.05)}
function clap(t){const a=ac();if(!a)return;const n=a.sampleRate*.12,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=1500;const g=a.createGain();g.gain.value=.6;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t)}
const snd={
  tap(){tone(660,0,.08,"triangle",.12)},
  good(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.18));[0,.15,.3,.42,.54,.66].forEach(t=>clap(.4+t))},
  oops(){tone(300,0,.18,"square",.07);tone(220,.16,.25,"square",.07)},
  whoosh(){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type="sawtooth";o.frequency.setValueAtTime(200,a.currentTime);o.frequency.exponentialRampToValueAtTime(1200,a.currentTime+.4);g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.45);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.5)},
  win(){[523,523,784,784,880,880,784].forEach((f,i)=>tone(f,i*.18,.2,"triangle",.18));for(let i=0;i<12;i++)clap(1.3+i*.1)}
};

/* ---------- confetti ---------- */
const fx=document.getElementById("fx"),fc=fx.getContext("2d");let parts=[],fxRun=false;
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}
sizeFx();addEventListener("resize",sizeFx);
function confetti(n=90){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cs=["#ffc928","#ef4f5f","#2f7dea","#20b46a","#8a5cf6","#ff8a1f"];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cs[i%6],a:Math.random()*6,life:120});if(!fxRun){fxRun=true;requestAnimationFrame(stepFx)}}
function stepFx(){fc.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.a+=.2;p.life--;fc.save();fc.translate(p.x,p.y);fc.rotate(p.a);fc.fillStyle=p.c;fc.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);fc.restore()});if(parts.length)requestAnimationFrame(stepFx);else{fxRun=false;fc.clearRect(0,0,fx.width,fx.height)}}

function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild}

/* keypad bound to .box elements inside a container */
let activeBox=null;
function bindBoxes(root){root.querySelectorAll(".box").forEach(b=>b.onclick=()=>setActive(b));const f=root.querySelector(".box");if(f)setActive(f)}
function setActive(b){document.querySelectorAll(".box.act").forEach(x=>x.classList.remove("act"));activeBox=b;if(b)b.classList.add("act")}
function nextBox(){const all=[...document.querySelectorAll("#main .box")];const i=all.indexOf(activeBox);if(i>-1&&i<all.length-1)setActive(all[i+1])}
function keypad(onCheck){const k=el(`<div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="del" data-n="del">⌫</button><button class="chk" data-n="chk">Check ✓</button></div>`);
  k.onclick=e=>{const n=e.target.dataset&&e.target.dataset.n;if(n===undefined)return;snd.tap();
    if(n==="chk"){onCheck();return}
    if(!activeBox)return;activeBox.classList.remove("ok","bad");
    if(n==="del")activeBox.textContent=activeBox.textContent.slice(0,-1);
    else if(activeBox.textContent.length<3)activeBox.textContent+=n;
    const max=+activeBox.dataset.len||3;if(n!=="del"&&activeBox.textContent.length>=max)nextBox();};
  keyHandler=e=>{if(/^[0-9]$/.test(e.key)){k.querySelector(`[data-n="${e.key}"]`).click()}else if(e.key==="Backspace"){k.querySelector('[data-n="del"]').click()}else if(e.key==="Enter"){k.querySelector('[data-n="chk"]').click()}};
  return k}
let keyHandler=null;
addEventListener("keydown",e=>{if(keyHandler)keyHandler(e)});
function checkBoxes(root){let all=true;root.querySelectorAll(".box").forEach(b=>{const ok=b.textContent!==""&&+b.textContent===+b.dataset.ans;b.classList.toggle("ok",ok);b.classList.toggle("bad",!ok);if(!ok)all=false});return all}

function drawDots(){const d=$("#dots");if(!d)return;d.innerHTML=G.qs.map((q,i)=>`<span class="dot ${i<G.i?"done":""} ${i===G.i?"cur":""}">${i<G.i?"✓":""}</span>`).join("");$("#score").textContent="⭐ "+G.stars}
function startGame(id){keyHandler=null;G={id,i:0,stars:0,first:true,qs:QS[id]};shell(id);drawDots();
  $("#howBtn").onclick=()=>{snd.tap();if(G.i>=10)return;showDemo(id,()=>{drawDots();RENDER[id](G.qs[G.i])})};
  showDemo(id,()=>{drawDots();RENDER[id](G.qs[0])})}

/* ---------- GAME 1: Block builder ---------- */
function g1(q){
  const {a,b}=q,ones=O(a)+O(b),reg=ones>=10;
  say(`Let's build <b>${a} + ${b}</b> with place-value blocks! Blue blocks are ${a}. Orange blocks are ${b}.`);
  const B=$("#board");
  B.innerHTML=`<h3 class="qtitle">${a} + ${b} = ?</h3>
  <div class="legend"><span class="a1"><i></i>${a}</span><span class="a2"><i></i>${b}</span><span class="a3"><i></i>new ten</span></div>
  <div class="mat"><div class="col"><div class="colhead">${HOUSE} Tens</div><div class="rods" id="rods"></div></div>
  <div class="col" id="onesCol"><div class="colhead">Ones</div><div class="cubes" id="cubes"></div><div class="counter" id="counter"></div></div></div>
  <div id="step"></div>`;
  const rods=$("#rods"),cubes=$("#cubes");
  for(let i=0;i<T(a);i++)rods.appendChild(el(`<div class="rod a1"></div>`));
  for(let i=0;i<T(b);i++)rods.appendChild(el(`<div class="rod a2"></div>`));
  for(let i=0;i<O(a);i++)cubes.appendChild(el(`<button class="cube a1" tabindex="-1" aria-label="one"></button>`));
  for(let i=0;i<O(b);i++)cubes.appendChild(el(`<button class="cube a2" tabindex="-1" aria-label="one"></button>`));
  const step=$("#step");
  step.innerHTML=`<p class="qtext">Count the ones. Can we find 10 ones to send home to the tens?</p><div class="row"><button class="big yes" id="y">Yes, we can!</button><button class="big no" id="n">No, not yet</button></div>`;
  const pick=yes=>{snd.tap();
    if(yes!==reg){miss(`Count the ones again: ${O(a)} + ${O(b)} = <b>${ones} ones</b>. ${reg?"There are 10 ones in there!":"That is less than 10, so they stay with the ones."}`);return}
    if(reg){say(`Yes! ${ones} ones. Tap <b>10 ones</b> to send them home to the tens!`,"bounce");startPick()}
    else{say(`Right! Only ${ones} ones, so they stay at home with the ones. Now count!`,"bounce");countStep()}};
  $("#y").onclick=()=>pick(true);$("#n").onclick=()=>pick(false);
  function startPick(){
    step.innerHTML=`<p class="qtext">Tap 10 ones 👆</p>`;$("#onesCol").classList.add("pick");let sel=0;$("#counter").textContent="0 / 10";
    cubes.querySelectorAll(".cube").forEach(c=>c.onclick=()=>{if(c.classList.contains("gone"))return;snd.tap();c.classList.toggle("chosen");sel=cubes.querySelectorAll(".chosen").length;
      tone(400+sel*60,0,.1,"triangle",.12);$("#counter").textContent=sel+" / 10";
      if(sel===10){$("#onesCol").classList.remove("pick");snd.whoosh();cubes.querySelectorAll(".chosen").forEach(x=>{x.classList.remove("chosen");x.classList.add("gone")});
        setTimeout(()=>{cubes.querySelectorAll(".gone").forEach(x=>x.remove());rods.appendChild(el(`<div class="rod a3 new"></div>`));$("#counter").textContent="";
          say(`Whoosh! 10 ones went home to the tens. Now they are <b>1 ten</b>!`,"bounce");tone(880,0,.2,"triangle",.15);countStep()},600)}})}
  function countStep(){
    const tt=T(a)+T(b)+(reg?1:0),oo=ones%10;
    step.innerHTML=`<p class="qtext">Count the blocks on the mat.</p>
     <div class="eq"><button class="box" data-ans="${tt}" data-len="1"></button> tens <button class="box" data-ans="${oo}" data-len="1"></button> ones</div>
     <div class="eq">${a} + ${b} = <button class="box" data-ans="${a+b}" data-len="${String(a+b).length}"></button></div><div id="kp"></div>`;
    bindBoxes(step);
    $("#kp").appendChild(keypad(()=>{if(checkBoxes(step)){keyHandler=null;solved(`${tt} tens and ${oo} ones is ${a+b}.`)}else miss(`Count again! Tens: count every rod. Ones: count every little cube.`)}));
    if(!reg)say(`Count the tens and ones. Then write the sum.`)}
}

/* ---------- GAME 2: Space drawings ---------- */
function drawPad(label,locked,t,o,id){
  const p=el(`<div class="pad"><h4>${label}</h4><div class="drawn" id="${id}"></div>${locked?"":`<div class="padbtns"><button data-a="t">+ ten |</button><button data-a="o">+ one •</button><button data-a="u">Undo</button></div>`}</div>`);
  const d=p.querySelector(".drawn");const s={t:0,o:0,h:[]};
  function paint(){d.innerHTML="";for(let i=0;i<s.t;i++)d.appendChild(el(`<span class="ln"></span>`));const g=el(`<span class="dts"></span>`);for(let i=0;i<s.o;i++)g.appendChild(el(`<span class="dt"></span>`));d.appendChild(g)}
  if(locked){s.t=t;s.o=o}
  paint();
  p.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{snd.tap();const a=b.dataset.a;if(a==="t"&&s.t<9){s.t++;s.h.push("t")}if(a==="o"&&s.o<19){s.o++;s.h.push("o")}if(a==="u"){const l=s.h.pop();if(l)s[l]--}paint()});
  p.state=s;return p}
function g2(q){
  const B=$("#board");keyHandler=null;
  if(q.t==="draw"){
    say(`Draw quick drawings! A line <b>|</b> is a ten. A dot <b>•</b> is a one.`);
    B.innerHTML=`<h3 class="qtitle">${q.a} + ${q.b} = ?</h3><p class="qtext">Draw both addends.</p><div class="qd" id="qd"></div><div class="row"><button class="big go" id="cd">Check my drawing</button></div><div id="after"></div>`;
    const p1=drawPad(`Draw ${q.a}`,false,0,0,"d1"),p2=drawPad(`Draw ${q.b}`,false,0,0,"d2");$("#qd").append(p1,p2);
    $("#cd").onclick=()=>{snd.tap();const ok1=p1.state.t===T(q.a)&&p1.state.o===O(q.a),ok2=p2.state.t===T(q.b)&&p2.state.o===O(q.b);
      if(!(ok1&&ok2)){miss(`Look at the digits! ${ok1?"":`${q.a} has ${T(q.a)} tens and ${O(q.a)} ones. `}${ok2?"":`${q.b} has ${T(q.b)} tens and ${O(q.b)} ones.`}`);return}
      $("#cd").disabled=true;document.querySelectorAll(".padbtns").forEach(x=>x.remove());const ones=O(q.a)+O(q.b);
      say(`Great drawings! ${ones>=10?`I see ${ones} ones. We find 10 ones and send them home to the tens!`:`Now add the tens and the ones.`}`,"bounce");tone(880,0,.2,"triangle",.15);
      const af=$("#after");af.innerHTML=`<div class="eq">${q.a} + ${q.b} = <button class="box" data-ans="${q.a+q.b}" data-len="2"></button></div><div id="kp"></div>`;bindBoxes(af);
      $("#kp").appendChild(keypad(()=>{if(checkBoxes(af)){keyHandler=null;solved()}else miss(`Count your lines and dots. Remember: 10 dots make 1 more line!`)}))};
  }
  if(q.t==="missing"){
    const m=q.sum-q.a;say(`Mystery! What number did we add to ${q.a} to get ${q.sum}? Draw the second addend.`);
    B.innerHTML=`<h3 class="qtitle">${q.a} + ? = ${q.sum}</h3><div class="qd" id="qd"></div><div class="row"><button class="big go" id="cd">Check my drawing</button></div><div id="after"></div>`;
    const p1=drawPad(`First addend: ${q.a}`,true,T(q.a),O(q.a),"d1"),p2=drawPad("Second addend: draw it!",false,0,0,"d2"),p3=drawPad(`Sum: ${q.sum}`,true,T(q.sum),O(q.sum),"d3");$("#qd").append(p1,p2,p3);
    $("#cd").onclick=()=>{snd.tap();const v=p2.state.t*10+p2.state.o;
      if(q.a+v!==q.sum){miss(`Your drawing shows ${v}. ${q.a} + ${v} = ${q.a+v}. ${q.a+v<q.sum?"We need more!":"That is too big."} Compare the tens, then the ones.`);return}
      $("#cd").disabled=true;document.querySelectorAll(".padbtns").forEach(x=>x.remove());say("Yes! Now write the second addend as a number.","bounce");
      const af=$("#after");af.innerHTML=`<div class="eq">${q.a} + <button class="box" data-ans="${m}" data-len="2"></button> = ${q.sum}</div><div id="kp"></div>`;bindBoxes(af);
      $("#kp").appendChild(keypad(()=>{if(checkBoxes(af)){keyHandler=null;solved()}else miss("Count the lines and dots you drew.")}))};
  }
  if(q.t==="chain"){
    const ones=O(q.a)+O(q.b),tens=T(q.a)+T(q.b),reg=ones>=10;
    say(`Another way! Break both numbers into tens and ones, then put them together.`);
    B.innerHTML=`<h3 class="qtitle">${q.a} + ${q.b} = ?</h3><div class="chain" id="ch">
     <div class="eq">${q.a} = <button class="box" data-ans="${T(q.a)}" data-len="1"></button> tens <button class="box" data-ans="${O(q.a)}" data-len="1"></button> ones</div>
     <div class="eq">${q.b} = <button class="box" data-ans="${T(q.b)}" data-len="1"></button> tens <button class="box" data-ans="${O(q.b)}" data-len="1"></button> ones</div>
     <div class="eq">Together: <button class="box" data-ans="${tens}" data-len="1"></button> tens <button class="box" data-ans="${ones}" data-len="2"></button> ones</div>
     ${reg?`<div class="eq">${HOUSE.replace("<svg",'<svg width="34" height="34"')} ${ones} ones = 1 ten <button class="box" data-ans="${ones-10}" data-len="1"></button> ones</div>`:""}
     <div class="eq">Sum = <button class="box" data-ans="${q.a+q.b}" data-len="2"></button></div></div><div id="kp"></div>`;
    bindBoxes($("#ch"));
    $("#kp").appendChild(keypad(()=>{if(checkBoxes($("#ch"))){keyHandler=null;solved(`${q.a} + ${q.b} = ${q.a+q.b}`)}else miss(`Fix the red boxes. ${reg?`Remember: when we find 10 ones, we send them home to the tens.`:""}`)}));
  }
  if(q.t==="yesno"||q.t==="mcq"){
    const opts=q.t==="yesno"?["Yes, correct","No, not correct"]:q.opts,ans=q.t==="yesno"?(q.ans?0:1):q.ans;
    say(q.t==="yesno"?"Be a maths detective! Check Ken's work.":"Think about the ones first!");
    B.innerHTML=`<p class="qtext" style="font-size:1.4rem">${q.text}</p><div class="opts" id="op">${opts.map((o,i)=>`<button class="big" data-i="${i}">${o}</button>`).join("")}</div>`;
    $("#op").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.disabled)return;snd.tap();
      if(+b.dataset.i===ans){b.classList.add("right");$("#op").querySelectorAll("button").forEach(x=>x.disabled=true);b.disabled=false;solved(q.why)}
      else{b.classList.add("wrong");b.disabled=true;miss("Hmm, not that one. "+(q.t==="yesno"?"Add the ones first: 3 + 7 = ?":"Add the ones in each problem."))}});
  }
  if(q.t==="multi"){
    say("Choose every answer that is the same amount. There may be more than one!");
    B.innerHTML=`<p class="qtext" style="font-size:1.4rem">${q.text}</p><div class="opts" id="op">${q.opts.map((o,i)=>`<button class="big" data-i="${i}">${o}</button>`).join("")}</div><div class="row"><button class="big go" id="cm">Check ✓</button></div>`;
    $("#op").querySelectorAll("button").forEach(b=>b.onclick=()=>{snd.tap();b.classList.toggle("sel")});
    $("#cm").onclick=()=>{const ch=[...$("#op").querySelectorAll(".sel")].map(b=>+b.dataset.i).sort().join();
      if(ch===q.ans.join()){$("#op").querySelectorAll("button").forEach(b=>{b.classList.remove("sel");if(q.ans.includes(+b.dataset.i))b.classList.add("right");b.disabled=true});$("#cm").disabled=true;solved("28 + 16 = 44. 3 tens 14 ones is also 44!")}
      else miss("Not quite. 28 + 16 = 44. Which choices also make 44?")};
  }
  if(q.t==="word"){
    say("Read the story. Find the two numbers and add them!");
    B.innerHTML=`<p class="qtext" style="font-size:1.4rem">${q.text}</p><div class="eq" id="wq"><button class="box" data-ans="${q.ans}" data-len="2"></button> ${q.unit}</div><div id="kp"></div>`;
    bindBoxes($("#wq"));$("#kp").appendChild(keypad(()=>{if(checkBoxes($("#wq"))){keyHandler=null;solved()}else miss("Add the tens, then add the ones. Did you find 10 ones to send home?")}));
  }
}

/* ---------- GAME 3: Partial sums ---------- */
function g3(q){
  const {a,b}=q,tp=(T(a)+T(b))*10,op=O(a)+O(b);
  say(`Ahoy! Find <b>${a} + ${b}</b> with partial sums. First add the tens, then the ones!`);
  const B=$("#board");
  B.innerHTML=`<div class="chest"><span>Treasure:</span><div class="coins">${'<span class="coin"></span>'.repeat(G.stars)}</div></div>
  <h3 class="qtitle">${a} + ${b} = ?</h3>
  <div class="ps" id="ps">
    <span></span><span class="h">Tens</span><span class="h">Ones</span><span></span>
    <span></span><span class="d">${T(a)||""}</span><span class="d">${O(a)}</span><span></span>
    <span class="lab">+</span><span class="d">${T(b)||""}</span><span class="d">${O(b)}</span><span></span>
    <span></span><span class="rule"></span><span></span>
    <span class="lab">Tens:</span><span class="wide"><button class="box" data-ans="${tp}" data-len="${String(tp).length}"></button></span><span class="lab" style="text-align:left">${T(a)} tens + ${T(b)} tens</span>
    <span class="lab">Ones:</span><span class="wide"><button class="box" data-ans="${op}" data-len="${String(op).length}"></button></span><span class="lab" style="text-align:left">${O(a)} ones + ${O(b)} ones</span>
    <span></span><span></span><span class="rule"></span><span></span>
    <span class="lab">Sum:</span><span class="wide"><button class="box" data-ans="${a+b}" data-len="2"></button></span><span></span>
  </div><div id="kp"></div>`;
  bindBoxes($("#ps"));
  $("#kp").appendChild(keypad(()=>{const bx=[...$("#ps").querySelectorAll(".box")];
    if(checkBoxes($("#ps"))){keyHandler=null;solved(`${tp} + ${op} = ${a+b}. Here is a gold coin!`);setTimeout(()=>{$(".coins").appendChild(el('<span class="coin"></span>'));tone(1200,0,.15,"triangle",.15)},300)}
    else{const w=bx.findIndex(x=>x.classList.contains("bad"));
      miss(w===0?`Tens: ${T(a)} tens + ${T(b)} tens = ${T(a)+T(b)} tens. How much is that?`:w===1?`Ones: ${O(a)} + ${O(b)} = ?`:`Add the partial sums: ${tp} + ${op} = ?`)}}));
}

    <span class="lab">Ones:</span><span class="wide"><span class="box" id="eO"></span></span><span class="lab" style="text-align:left">6 ones + 5 ones</span>
    <span></span><span class="rule"></span><span></span>
    <span class="lab">Sum:</span><span class="wide"><span class="box" id="eS"></span></span><span></span>
   </div>`},
  steps:[
   {text:"Look at the chart. <b>36</b> is 3 tens 6 ones. <b>25</b> is 2 tens 5 ones.",say:"Ahoy! Watch me find 36 + 25 with partial sums."},
   {text:"First add the <b>tens</b>: 30 + 20 = <b>50</b>. I type 50 in the Tens box.",act(){["e1","e3"].forEach(i=>$("#"+i).style.background="#ffe9a8");fillBox($("#eT"),50)}},
   {text:"Next add the <b>ones</b>: 6 + 5 = <b>11</b>. I type 11 in the Ones box.",act(){["e1","e3"].forEach(i=>$("#"+i).style.background="");["e2","e4"].forEach(i=>$("#"+i).style.background="#ffe9a8");fillBox($("#eO"),11)}},
   {text:"Last, add the partial sums: 50 + 11 = <b>61</b>. Then I press <b>Check</b> and win a gold coin!",act(){["e2","e4"].forEach(i=>$("#"+i).style.background="");fillBox($("#eS"),61);setTimeout(()=>{snd.good();confetti(50)},800)}},
   {text:"Your turn! Tens first, then ones, then the sum.",say:"Now you try, matey! Press ❓ How to play any time to see this again."}

function home(){keyHandler=null;
  main.innerHTML=`<section class="teacher"><div class="tfig">${TEACHER}</div><div class="tsay"><h2>Hello, my superstars! 🌟</h2><p>I am so proud of you! Every game you play makes your maths brain stronger, so practise a little every day and try both games. Mistakes are okay. They help us learn!</p><p>Play carefully, collect as many stars as you can, and when you finish a game, take a picture of your trophy and <b>send your score to me privately</b>. I can't wait to see how hard you worked!</p><p class="sign">With love, Teacher Rana 💜</p></div></section><div class="lobby">${Object.entries(GAMES).filter(([id])=>id!=="g2").map(([id,g])=>`<button class="gcard ${g.cls}" data-g="${id}"><span class="lesson">${g.lesson} · ${g.title}</span><span class="float">${g.mascot}</span><h2>${g.name}</h2><p>${g.blurb}</p><span class="play">Play · 10 questions</span></button>`).join("")}</div>`;
  main.querySelectorAll(".gcard").forEach(c=>c.onclick=()=>{snd.tap();go(c.dataset.g)})}
function go(where){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===where));
  if(where==="home")home();else startGame(where);scrollTo({top:0})}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){snd.tap();go(b.dataset.go)}};


home();
</script>
