<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silly Math Quiz – Grade 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#2b1b5a;
  --bg1:#fff3b0;
  --bg2:#ffd6f0;
  --a:#ff5c8a; --b:#ffb703; --c:#2ec4b6; --d:#7b61ff;
  --card:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:'Fredoka','Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  background:
    radial-gradient(circle at 10% 10%, #bdf3ff 0 90px, transparent 91px),
    radial-gradient(circle at 92% 18%, #ffe27a 0 70px, transparent 71px),
    radial-gradient(circle at 85% 90%, #c9b8ff 0 110px, transparent 111px),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
}
.wrap{max-width:680px;margin:0 auto;padding:18px 14px 40px}
h1{
  margin:6px 0 2px;text-align:center;font-size:clamp(30px,8vw,46px);line-height:1.05;font-weight:700;
  color:#ff3d81;text-shadow:3px 3px 0 #fff, 6px 6px 0 #ffb703;
}
.sub{text-align:center;margin:10px 0 14px;font-weight:500;font-size:17px}
.stars{display:flex;justify-content:center;gap:8px;margin:8px 0 14px}
.star{font-size:28px;filter:grayscale(1) opacity(.35);transition:transform .3s, filter .3s}
.star.on{filter:none;transform:scale(1.2) rotate(-8deg)}
.star.now{filter:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

.card{
  background:var(--card);border:5px solid var(--ink);border-radius:28px;
  box-shadow:8px 8px 0 var(--ink);overflow:hidden;
}
.photo{
  position:relative;padding:18px 14px 14px;background:var(--bg);
  border-bottom:5px solid var(--ink);text-align:center;
}
.photo .tag{
  position:absolute;left:12px;top:10px;background:#fff;border:3px solid var(--ink);
  border-radius:999px;padding:2px 12px;font-weight:600;font-size:15px;
}
.hero{font-size:86px;line-height:1;display:inline-block;animation:wob 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-6px)}}
.bubble{
  position:relative;display:inline-block;max-width:92%;margin-top:10px;background:#fff;
  border:4px solid var(--ink);border-radius:20px;padding:8px 14px;font-weight:600;font-size:17px;
}
.bubble::before{
  content:"";position:absolute;top:-14px;left:50%;margin-left:-10px;border:10px solid transparent;
  border-bottom-color:var(--ink);border-top:0;
}
.scene{margin-top:12px;display:flex;justify-content:center}
.pairs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:40px}
.pair{background:rgba(255,255,255,.75);border:3px dashed var(--ink);border-radius:18px;padding:2px 8px;display:flex;gap:2px}
.pair.lonely{background:#fff;border-color:#e63946}
.arr{display:grid;gap:4px;background:rgba(255,255,255,.8);border:4px solid var(--ink);border-radius:18px;padding:10px;font-size:36px;line-height:1.1}
.arr span{display:block;text-align:center}
.hc{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:460px;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:6px}
.hc div{
  text-align:center;font-weight:600;font-size:clamp(12px,3.4vw,18px);padding:5px 0;border-radius:8px;
  background:#e8f7ff;
}
.hc div:nth-child(even){background:#fff0f7}
.hc .start{background:#ffb703!important;outline:3px solid var(--ink);animation:pulse 1.2s ease-in-out infinite}
.hc .go{background:#2ec4b6!important;color:#fff}
.body{padding:18px 16px 20px}
.q{font-size:clamp(20px,5.2vw,26px);font-weight:700;margin:0 0 14px;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{
  font:inherit;font-weight:700;font-size:clamp(18px,4.6vw,22px);color:#fff;text-align:center;
  border:4px solid var(--ink);border-radius:20px;padding:14px 10px;cursor:pointer;
  box-shadow:0 6px 0 var(--ink);transition:transform .1s, box-shadow .1s;
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:68px;
}
.opt:nth-child(1){background:var(--a)} .opt:nth-child(2){background:var(--d)}
.opt:nth-child(3){background:var(--c)} .opt:nth-child(4){background:#ff8a00}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt:focus-visible,.btn:focus-visible{outline:5px solid #2b6bff;outline-offset:3px}
.opt .l{background:#fff;color:var(--ink);border-radius:50%;width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:18px}
.opt:disabled{cursor:default}
.opt.right{background:#1fb86a!important;animation:pop .5s}
.opt.wrong{background:#9a9a9a!important;animation:shake .45s}
.opt.dim{opacity:.55}
@keyframes pop{40%{transform:scale(1.08) rotate(-2deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{
  display:none;margin-top:16px;border:4px solid var(--ink);border-radius:20px;padding:12px 14px;font-weight:500;font-size:18px;line-height:1.35;
}
.fb.show{display:block}
.fb.ok{background:#d6ffe6}
.fb.no{background:#ffe3e3}
.fb b{font-size:22px;display:block;margin-bottom:2px}
.btn{
  font:inherit;font-weight:700;font-size:21px;color:#fff;background:#ff3d81;
  border:4px solid var(--ink);border-radius:999px;padding:12px 28px;margin-top:16px;cursor:pointer;
  box-shadow:0 6px 0 var(--ink);
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.end{text-align:center;padding:26px 16px 30px}
.end .big{font-size:110px;line-height:1;display:inline-block;animation:wob 1.6s ease-in-out infinite}
.end h2{font-size:34px;margin:8px 0}
.score{font-size:56px;font-weight:700;color:#ff3d81;text-shadow:3px 3px 0 #ffe27a}
.conf{position:fixed;top:-60px;font-size:30px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){
  .hero,.end .big,.star.now,.hc .start{animation:none}
  .conf{display:none}
}
</style>

<!-- Shared template: colors, fonts, sounds, buttons, mascots. Keep this. -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/theme.js" defer></script>
</head>
<body>
<div class="wrap">
  <h1>Silly Math Quiz!</h1>
  <p class="sub">Even &amp; Odd • Arrays • Hundred Chart</p>
  <div class="stars" id="stars" aria-label="Progress"></div>
  <div class="card" id="card"></div>
</div>

<script>
const pairsOf = (emoji, n) => {
  let h = '<div class="pairs">';
  for (let i = 0; i < n; i += 2) {
    if (i + 1 < n) h += `<div class="pair">${emoji}${emoji}</div>`;
    else h += `<div class="pair lonely">${emoji}</div>`;
  }
  return h + '</div>';
};
const array = (emoji, rows, cols) => {
  let h = `<div class="arr" style="grid-template-columns:repeat(${cols},1fr)" role="img" aria-label="${rows} rows of ${cols}">`;
  for (let i = 0; i < rows * cols; i++) h += `<span>${emoji}</span>`;
  return h + '</div>';
};
const chart = (from, to, start, go) => {
  let h = '<div class="hc" role="img" aria-label="Part of a hundred chart">';
  for (let n = from; n <= to; n++) h += `<div class="${n === start ? 'start' : ''}">${n}</div>`;
  return h + '</div>';
};

const Q = [
  {
    bg:'#ffd6f0', tag:'Even numbers', hero:'🦖', say:'Even numbers make PAIRS with nobody left out!',
    scene: () => pairsOf('🦕', 8),
    q:'Dino Dave is dancing in pairs. Which number is EVEN?',
    opts:['9','13','16','21'], ans:2,
    why:'16 can be split into pairs with none left over. 16 ends in 6, and even numbers end in 0, 2, 4, 6 or 8!'
  },
  {
    bg:'#fff3b0', tag:'Odd numbers', hero:'🤡', say:'I have 7 balloons. Let me make pairs!',
    scene: () => pairsOf('🎈', 7),
    q:'Coco the Clown made pairs with 7 balloons. What happened?',
    opts:['Every balloon had a partner','One balloon was left over','Two balloons were left over','All the balloons popped'], ans:1,
    why:'7 balloons make 3 pairs and 1 lonely balloon. When one is left over, the number is ODD!'
  },
  {
    bg:'#c8f4ff', tag:'Arrays', hero:'🐵', say:'Cookie time! 3 rows with 4 cookies in each row.',
    scene: () => array('🍪', 3, 4),
    q:'Add the ROWS of the array. Which addition sentence matches?',
    opts:['3 + 3 + 3 = 9','4 + 4 = 8','3 + 4 = 7','4 + 4 + 4 = 12'], ans:3,
    why:'There are 3 rows and each row has 4 cookies, so we add 4 three times: 4 + 4 + 4 = 12.'
  },
  {
    bg:'#d9ffd0', tag:'Arrays', hero:'🐸', say:'Ribbit! Pizza party! 2 rows with 5 pizzas in each row.',
    scene: () => array('🍕', 2, 5),
    q:'How many pizzas are there in all?',
    opts:['7','12','25','10'], ans:3,
    why:'Add each row: 5 + 5 = 10 pizzas. Yum!'
  },
  {
    bg:'#e6dcff', tag:'Hundred chart', hero:'🦄', say:'Start at 27. Adding 30 means jump DOWN 3 rows!',
    scene: () => chart(21, 60, 27),
    q:'What is 27 + 30? (Move down 3 rows from 27.)',
    opts:['30','47','60','57'], ans:3,
    why:'Moving down one row adds 10. Down 3 rows is +30: 27 → 37 → 47 → 57.'
  },
  {
    bg:'#ffe0b8', tag:'Hundred chart', hero:'🐙', say:'Start at 36. Move DOWN 2 rows, then RIGHT 3 steps!',
    scene: () => chart(31, 60, 36),
    q:'What is 36 + 23?',
    opts:['49','56','69','59'], ans:3,
    why:'Add the tens first: 36 + 20 = 56 (down 2 rows). Then add the ones: 56 + 3 = 59 (right 3 steps).'
  }
];

const CHEERS = ['Super-duper! 🎉','Bananas! You got it! 🍌','Boom! Genius alert! 🚀','Wiggle-woo, correct! 🕺','High five! 🙌','You are on fire! 🔥'];
const OOPS = ['Oopsie-daisy! 🌼','Whoopsie! Almost! 🙈','Silly goose, not this time! 🪿'];

let i = 0, score = 0, answered = false;
const card = document.getElementById('card');
const starsEl = document.getElementById('stars');

function drawStars() {
  starsEl.innerHTML = Q.map((_, k) =>
    `<span class="star ${k < i ? 'on' : k === i ? 'now' : ''}">⭐</span>`).join('');
}

function confetti() {
  const bits = ['🎉','⭐','🎈','🍭','🌈','✨','🍩','🦄'];
  for (let k = 0; k < 22; k++) {
    const s = document.createElement('span');
    s.className = 'conf';
    s.textContent = bits[Math.floor(Math.random() * bits.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4800);
  }
}

function show() {
  answered = false;
  drawStars();
  const d = Q[i];
  card.innerHTML = `
    <div class="photo" style="--bg:${d.bg}">
      <span class="tag">Question ${i + 1} of ${Q.length}</span>
      <div class="hero" aria-hidden="true">${d.hero}</div><br>
      <div class="bubble">${d.say}</div>
      <div class="scene">${d.scene()}</div>
    </div>
    <div class="body">
      <p class="q">${d.q}</p>
      <div class="opts">
        ${d.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}
      </div>
      <div class="fb" id="fb" role="status" aria-live="polite"></div>
      <div id="nextWrap"></div>
    </div>`;
  card.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => pick(+b.dataset.k)));
}

function pick(k) {
  if (answered) return;
  answered = true;
  const d = Q[i];
  const btns = [...card.querySelectorAll('.opt')];
  btns.forEach((b, idx) => {
    b.disabled = true;
    if (idx === d.ans) b.classList.add('right');
    else if (idx === k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb = document.getElementById('fb');
  const ok = k === d.ans;
  if (ok) { score++; confetti(); }
  fb.className = 'fb show ' + (ok ? 'ok' : 'no');
  const msg = ok ? CHEERS[Math.floor(Math.random() * CHEERS.length)] : OOPS[Math.floor(Math.random() * OOPS.length)];
  fb.innerHTML = `<b>${msg}</b>${ok ? '' : 'The right answer is ' + d.opts[d.ans] + '. '}${d.why}`;
  document.getElementById('nextWrap').innerHTML =
    `<button class="btn" id="next">${i === Q.length - 1 ? 'See my stars! 🌟' : 'Next question ➜'}</button>`;
  const n = document.getElementById('next');
  n.addEventListener('click', () => { i++; i < Q.length ? show() : finish(); });
  n.focus();
}

function finish() {
  i = Q.length; drawStars();
  const t = score === 6 ? ['👑','Math King / Queen!','You got every single one! Wow!']
          : score >= 4 ? ['🦸','Math Superhero!','So close to perfect. Great job!']
          : score >= 2 ? ['🐣','Little Math Chick!','You are growing fast. Try again!']
          : ['🦥','Sleepy Sloth Learner','Read the lessons and try again. You can do it!'];
  card.innerHTML = `
    <div class="end">
      <div class="big">${t[0]}</div>
      <h2>${t[1]}</h2>
      <div class="score">${score} / ${Q.length}</div>
      <p style="font-size:20px;font-weight:500">${t[2]}</p>
      <button class="btn" id="again">Play again 🔄</button>
    </div>`;
  if (score >= 4) confetti();
  document.getElementById('again').addEventListener('click', () => { i = 0; score = 0; show(); });
}

show();
</script>
</body>
</html>
