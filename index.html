<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths Lessons Library</title>
<link rel="icon" href="shared/img/pengo-badge.png">
<!-- Shared template: colors, fonts, sounds, buttons, mascots. Keep this. -->
<!-- ?v=… makes browsers fetch the newest copy after an update. Raise the number when a shared file (theme, home, catalog) changes. -->
<link rel="stylesheet" href="shared/theme.css?v=10">
<link rel="stylesheet" href="shared/home.css?v=10">
<script src="shared/theme.js?v=10" defer></script>
<script src="shared/catalog.js?v=10"></script>
<style>
  /* Pictures used on this page live in shared/img/ (made from the Pic folder). */
  body.rm-page { background: var(--rm-bg) url("shared/img/pattern-math-doodles.jpg") 0 0 / 520px auto; }
  .rm-main { max-width: 1100px; padding-top: 8px; }

  /* ---------- Hero: Pengo and the children ---------- */
  .hero { position: relative; max-width: 1100px; margin: 16px auto 0; box-sizing: border-box; overflow: hidden;
          background: var(--rm-bg); border: 3px solid var(--rm-line); border-radius: 28px; box-shadow: var(--rm-shadow);
          min-height: clamp(270px, 32vw, 380px); display: flex; align-items: center; }
  .hero-art { position: absolute; top: 0; right: 0; height: 100%; width: auto; display: block;
              -webkit-mask-image: linear-gradient(to right, transparent 0, #000 24%);
                      mask-image: linear-gradient(to right, transparent 0, #000 24%); }
  .hero-text { position: relative; z-index: 1; box-sizing: border-box; width: 54%; padding: 24px 0 24px 30px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 62px; height: 62px; }
  .brand .rm-kicker { font: 800 .95rem var(--rm-font-body); color: var(--rm-ink-soft); letter-spacing: .02em; }
  .hero h1 { font-size: clamp(2rem, 4.4vw, 3.2rem); color: var(--rm-g3); margin: 6px 0 4px; }
  #totals { margin: 0 0 14px; font-weight: 800; color: var(--rm-ink-soft); }
  .search { display: block; width: 100%; max-width: 380px; box-sizing: border-box; min-height: 54px;
            font: 700 1.05rem var(--rm-font-body); padding: 12px 20px; border-radius: 999px;
            border: 3px solid var(--rm-line); background: var(--rm-surface); color: var(--rm-ink); }
  .search:focus { outline: none; border-color: var(--rm-g3); }

  @media (max-width: 720px) {
    .hero { display: block; margin: 10px 12px 0; min-height: 0; }
    .hero-art { position: static; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; object-position: 100% 50%;
                -webkit-mask-image: none; mask-image: none; }
    .hero-text { width: 100%; padding: 12px 18px 20px; text-align: center; }
    .brand { justify-content: center; }
    .search { margin: 0 auto; }
  }

  /* ---------- Picture buttons: choose a grade, games or tools ---------- */
  .picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin: 20px 0 6px; }
  .pick { --c: var(--rm-g1); grid-column: span 2; display: flex; flex-direction: column; padding: 0; overflow: hidden;
          cursor: pointer; text-align: center; color: var(--c); background: var(--rm-surface);
          border: 4px solid var(--rm-line); border-radius: 24px; box-shadow: var(--rm-shadow);
          font-family: var(--rm-font-title); transition: transform .12s, border-color .12s, box-shadow .12s; }
  .pick:hover { transform: translateY(-3px); border-color: var(--c); }
  .pick:focus-visible { outline: 4px solid var(--rm-star); outline-offset: 3px; }
  .pick .art { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
  .pick .lab { display: block; padding: 10px 8px; font-weight: 600; font-size: clamp(.95rem, 2.2vw, 1.25rem); line-height: 1.15; }
  .pick .lab small { display: block; font: 800 .8em var(--rm-font-body); color: var(--rm-ink-soft); }
  .pick[aria-selected="true"] { border-color: var(--c); box-shadow: 0 7px 0 var(--c); transform: translateY(-4px); }
  .pick[aria-selected="true"] .lab { background: var(--c); color: #fff; }
  .pick[aria-selected="true"] .lab small { color: #fff; }
  .pick.wide { grid-column: span 3; flex-direction: row; align-items: center; text-align: left; min-height: 96px; }
  .pick.wide .ico { flex: none; width: 76px; height: 76px; margin: 8px 4px 8px 14px; }
  .pick.wide .lab { flex: 1; align-self: stretch; display: flex; flex-direction: column; justify-content: center;
                    padding: 10px 14px; font-size: clamp(1.1rem, 2.6vw, 1.5rem); }
  @media (min-width: 900px) {   /* board and laptop: grades in a row, games and tools stacked beside them */
    .picker { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }
    .pick { grid-column: auto; grid-row: span 2; }
    .pick.wide { grid-column: 4; grid-row: span 1; }
  }
  @media (max-width: 520px) {
    .picker { gap: 10px; }
    .pick { border-width: 3px; border-radius: 18px; }
    .pick.wide { grid-column: span 6; min-height: 80px; }
    .pick.wide .ico { width: 60px; height: 60px; }
  }

  /* ---------- Section heading ---------- */
  .grade-head { display: flex; align-items: center; gap: 12px; margin: 26px 0 10px; }
  .grade-head img { width: 60px; height: 60px; flex: none; }
  .grade-head h2 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.1rem); color: var(--c); }
  .grade-head small { color: var(--rm-ink-soft); font: 800 1rem var(--rm-font-body); }

  /* ---------- Topics ---------- */
  details.topic { background: var(--rm-surface); border: 3px solid var(--rm-line); border-radius: var(--rm-radius);
                  margin-bottom: 12px; box-shadow: var(--rm-shadow); }
  details.topic > summary { cursor: pointer; list-style: none; padding: 16px 18px; display: flex; align-items: center; gap: 12px; min-height: 52px; }
  details.topic > summary::-webkit-details-marker { display: none; }
  details.topic[open] { border-color: var(--c); }
  .tnum { flex: none; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px;
          background: var(--c); color: #fff; font: 700 1.35rem var(--rm-font-title); }
  .tname { font: 600 1.2rem var(--rm-font-title); flex: 1; }
  .tcount { color: var(--rm-ink-soft); font-weight: 800; font-size: .95rem; white-space: nowrap; }
  .chev { display: inline-block; transition: transform .2s; color: var(--c); }
  details[open] .chev { transform: rotate(90deg); }
  @media (max-width: 520px) { .tcount { display: none; } }

  /* ---------- Lesson cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 0 16px 18px; align-items: start; }
  .lesson { display: flex; flex-direction: column; text-decoration: none; color: var(--rm-ink); overflow: hidden;
            background: var(--rm-bg); border: 3px solid var(--rm-line); border-radius: 18px;
            transition: transform .12s, border-color .12s; min-height: 92px; }
  .lesson:hover, .lesson:focus-visible { transform: translateY(-3px); border-color: var(--c); outline: none; }
  .lesson .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-bottom: 3px solid var(--rm-line); }
  .lesson .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; flex: 1; }
  .lesson .ico { flex: none; width: 52px; height: 52px; }
  .lesson .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lesson .top { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font: 800 .78rem var(--rm-font-body); padding: 3px 9px; border-radius: 999px; background: var(--c); color: #fff; }
  .pill.kind { background: var(--rm-surface); color: var(--rm-ink-soft); border: 2px solid var(--rm-line); }
  .lesson strong { font: 600 1.12rem var(--rm-font-title); line-height: 1.2; }
  .lesson[dir="rtl"] strong { font-family: "Segoe UI", Tahoma, sans-serif; }

  /* ---------- Games and tools panels ---------- */
  .panel { padding: 16px 0 0; }
  .panel.with-art { display: grid; grid-template-columns: minmax(180px, 250px) 1fr; gap: 0; padding: 16px 0 16px 16px; align-items: stretch; }
  .panel.with-art .side { width: 100%; height: 100%; max-height: 420px; object-fit: cover; object-position: 50% 20%;
                          border-radius: 16px; display: block; }
  .panel.with-art .grid { padding-bottom: 0; align-content: start; }
  .panel-note { margin: 0 16px 12px; font-weight: 800; color: var(--rm-ink-soft); }
  @media (max-width: 720px) {
    .panel.with-art { grid-template-columns: 1fr; padding: 16px 0 16px; }
    .panel.with-art .side { width: auto; margin: 0 16px 14px; height: auto; aspect-ratio: 1 / 1; object-position: 50% 60%; max-width: calc(100% - 32px); }
  }

  /* ---------- Who is learning? (progress saved on this device) ---------- */
  .who { margin: 18px 0 0; padding: 16px 18px; }
  .who h2 { margin: 0 0 4px; font-size: clamp(1.3rem, 3.4vw, 1.7rem); color: var(--rm-g3); }
  .who p { margin: 0 0 12px; color: var(--rm-ink-soft); font-weight: 700; }
  .who-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .kid { display: inline-flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px 16px 6px 6px; cursor: pointer;
         background: var(--rm-bg); color: var(--rm-ink); border: 3px solid var(--rm-line); border-radius: 999px;
         font: 600 1.15rem var(--rm-font-title); }
  .kid:hover, .kid:focus-visible { border-color: var(--rm-g3); outline: none; }
  .kid .face { width: 42px; height: 42px; flex: none; }
  .kid .face svg, .me .face svg, .pet svg { width: 100%; height: 100%; display: block; }
  .kid.remove { border-color: var(--rm-wrong); }
  .kid.remove::after { content: "✕"; color: var(--rm-wrong); margin-left: 4px; }
  .me { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .me .face { width: 64px; height: 64px; flex: none; }
  .me .hi { flex: 1; min-width: 180px; }
  .me .hi h2 { margin: 0; }
  .me .hi p { margin: 2px 0 0; }
  .new-kid { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  .new-kid input { min-height: 54px; box-sizing: border-box; flex: 1 1 200px; max-width: 320px; padding: 10px 18px;
                   font: 700 1.1rem var(--rm-font-body); border-radius: 999px; border: 3px solid var(--rm-line);
                   background: var(--rm-surface); color: var(--rm-ink); }
  .new-kid input:focus { outline: none; border-color: var(--rm-g3); }
  .pets { display: flex; gap: 8px; }
  .pet { width: 58px; height: 58px; padding: 4px; box-sizing: border-box; cursor: pointer; border-radius: 16px;
         background: var(--rm-bg); border: 3px solid var(--rm-line); }
  .pet[aria-pressed="true"] { border-color: var(--rm-g3); background: var(--rm-surface); box-shadow: 0 4px 0 var(--rm-g3); }
  .grades { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; }
  .grades b { font-weight: 800; color: var(--rm-ink-soft); margin-right: 2px; }
  .gr { width: 56px; height: 56px; cursor: pointer; border-radius: 16px; background: var(--rm-bg); color: var(--c);
        border: 3px solid var(--c); font: 700 1.5rem var(--rm-font-title); }
  .gr[aria-pressed="true"] { background: var(--c); color: #fff; box-shadow: 0 4px 0 rgba(42, 36, 64, .2); }
  .gr:focus-visible { outline: 4px solid var(--rm-star); outline-offset: 2px; }
  .hint { flex-basis: 100%; margin: 0; color: var(--rm-wrong); font-weight: 800; }
  .pill.done { background: var(--rm-correct); }
  .pill.star { background: var(--rm-star); color: var(--rm-ink); }
  .tcount .mine { color: var(--rm-correct); }

  /* ---------- How to use ---------- */
  .hero-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .hero-tools .search { flex: 1 1 220px; }
  @media (max-width: 720px) { .hero-tools { justify-content: center; } }
  dialog.help { width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 40px); box-sizing: border-box; padding: 22px 24px;
                border: 4px solid var(--rm-star); border-radius: 26px; background: var(--rm-surface); color: var(--rm-ink);
                font: 700 1.08rem/1.5 var(--rm-font-body); }
  dialog.help::backdrop { background: rgba(42, 36, 64, .55); }
  .help-head { display: flex; align-items: center; gap: 12px; }
  .help-head [data-mascot] { width: 72px; height: 72px; flex: none; }
  .help h2 { margin: 0; font-size: 2rem; color: var(--rm-g3); }
  .help h3 { margin: 16px 0 6px; font: 600 1.35rem var(--rm-font-title); color: var(--rm-g3); }
  .help-steps, .help-tips { margin: 10px 0 0; padding-left: 1.4em; }
  .help-tips { list-style: none; padding-left: 0; }
  .help li { margin-bottom: 8px; }
  .help .pill { white-space: nowrap; }
  .help-close { text-align: center; margin: 18px 0 0; }

  .empty { text-align: center; color: var(--rm-ink-soft); font-weight: 700; padding: 20px; }
  footer { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--rm-ink-soft); padding: 0 16px 30px; font-weight: 800; }
  footer img { width: 40px; height: 40px; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="rm-page" data-rm-no-dock>

<header class="hero">
  <img class="hero-art" src="shared/img/hero-pengo-lab.jpg" alt="Pengo the penguin in his Pingo Lab hoodie and two children learning maths with a clock, cubes and a number line">
  <div class="hero-text">
    <div class="brand">
      <img src="shared/img/pengo.png" alt="Pengo">
      <span class="rm-kicker" data-t="kicker">enVision Math · Grades 1–3</span>
    </div>
    <h1 data-t="title">Maths Lessons Library</h1>
    <p id="totals"></p>
    <div class="hero-tools">
      <input class="search" id="search" type="search" placeholder="🔎 Find a lesson…" aria-label="Find a lesson">
      <button class="rm-btn rm-btn--star" type="button" id="help-open" data-t="helpBtn">❓ How to use</button>
      <button class="rm-btn rm-btn--ghost round" type="button" id="theme-btn">🌙</button>
      <button class="rm-btn rm-btn--ghost" type="button" id="lang-btn" lang="ar">عربي</button>
    </div>
  </div>
</header>

<main class="rm-main">
  <section class="rm-card who" id="who" aria-live="polite"></section>
  <div class="picker" role="tablist" aria-label="Choose a grade" id="tabs"></div>
  <section class="rm-card daily" id="daily"></section>
  <div id="view"></div>

  <section class="rm-card about" id="about">
    <img src="shared/img/teacher-and-pengo.jpg" alt="The teacher and Pengo in a classroom" loading="lazy">
    <div>
      <h2 data-t="aboutTitle">About the teacher</h2>
      <!-- Rana: change this text in shared/home.js (aboutText) -->
      <p data-t="aboutText"></p>
    </div>
  </section>
</main>

<!-- How to use (the words are in shared/home.js, in English and Arabic) -->
<dialog class="help" id="help" aria-labelledby="help-title">
  <div class="help-head">
    <span data-mascot="owl"></span>
    <h2 id="help-title">How to use</h2>
  </div>
  <ol class="help-steps" id="help-steps"></ol>
  <h3 id="help-safe">Keep your progress safe</h3>
  <ul class="help-tips" id="help-tips"></ul>
  <p class="help-close">
    <button class="rm-btn rm-btn--ghost" type="button" id="tour-again">🐧 Show me the tour</button>
    <button class="rm-btn rm-btn--big" type="button" id="help-close" data-close>Got it! 👍</button>
  </p>
</dialog>

<!-- My badges and Pengo's prizes -->
<dialog class="help badgesd" id="badges" aria-labelledby="badges-title">
  <div class="help-head"><h2 id="badges-title" data-t="badgesTitle">My badges</h2></div>
  <div id="badges-body"></div>
  <p class="help-close"><button class="rm-btn rm-btn--big" type="button" data-close data-t="close">Close</button></p>
</dialog>

<!-- Certificate for a finished topic -->
<dialog class="help certd" id="certd" aria-label="Certificate">
  <div id="cert-body"></div>
  <p class="help-close no-print">
    <button class="rm-btn rm-btn--star rm-btn--big" type="button" id="cert-print" data-t="print">🖨️ Print</button>
    <button class="rm-btn rm-btn--ghost" type="button" data-close data-t="close">Close</button>
  </p>
</dialog>

<!-- Welcome tour (first visit) -->
<div class="tour" id="tour" hidden role="dialog" aria-live="polite" aria-label="Welcome tour">
  <img src="shared/img/pengo.png" alt="Pengo">
  <div class="tour-bubble">
    <p id="tour-text"></p>
    <div class="tour-row">
      <span class="tour-dots" id="tour-dots"></span>
      <button class="rm-btn rm-btn--ghost" type="button" id="tour-skip">Skip</button>
      <button class="rm-btn" type="button" id="tour-next">Next ▶</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<footer><img src="shared/img/pengo.png" alt=""> <span data-t="footer">T. Rana Elsisi</span></footer>

<script src="shared/home.js?v=10" defer></script>
</body>
</html>
